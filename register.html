<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Create Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col p-6">

    <div class="flex items-center mb-6 max-w-sm mx-auto w-full">
        <a href="index.html" class="text-slate-400 hover:text-white mr-4 text-sm font-semibold">&larr; Back</a>
        <h2 class="text-xl font-bold text-emerald-400">Create Your Profile</h2>
    </div>

    <form id="register-form" class="space-y-4 max-w-sm mx-auto w-full flex-1">
        <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">Full Name</label>
            <input type="text" id="reg-name" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm outline-none focus:border-emerald-500 text-white">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">Gender</label>
            <select id="reg-gender" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm outline-none focus:border-emerald-500 text-white">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">Username</label>
            <input type="text" id="reg-username" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm outline-none focus:border-emerald-500 text-white">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">Password</label>
            <input type="password" id="reg-password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm outline-none focus:border-emerald-500 text-white">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">Access Code (Krinox1803)</label>
            <input type="text" id="reg-accesscode" placeholder="Required system code" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm outline-none focus:border-emerald-500 text-white">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-semibold transition text-white mt-4">Register Profile</button>
    </form>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const CORRECT_ACCESS_CODE = 'Krinox1803';

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const gender = document.getElementById('reg-gender').value;
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const accessCode = document.getElementById('reg-accesscode').value.trim();

            if (accessCode !== CORRECT_ACCESS_CODE) {
                alert('Invalid Access Code! Registration denied.');
                return;
            }

            const { data: existing } = await client.from('profiles').select('*').eq('username', username);
            if (existing && existing.length > 0) {
                alert('Username is already taken. Choose another.');
                return;
            }

            const { error } = await client.from('profiles').insert([{ name, gender, username, password }]);
            if (error) {
                alert('Error creating profile: ' + error.message);
            } else {
                alert('Profile created successfully! Please sign in.');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
