<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Create Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative overflow-hidden shadow-2xl bg-slate-900 border-x border-slate-800 p-6 justify-between">
        <div class="space-y-6">
            <div class="flex items-center justify-between">
                <button onclick="window.location.href='index.html'" class="text-slate-400 hover:text-white text-sm flex items-center gap-1 cursor-pointer">&larr; Back</button>
                <h2 class="text-xl font-bold">Create Profile</h2>
                <div class="w-8"></div>
            </div>

            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Gender</label>
                    <select id="reg-gender" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
                    <input type="text" id="reg-username" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" id="reg-password" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Access Code</label>
                    <input type="text" id="reg-code" placeholder="Krinox1803" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all mt-4 cursor-pointer">
                    Register Profile
                </button>
            </form>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const gender = document.getElementById('reg-gender').value;
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const code = document.getElementById('reg-code').value.trim();

            if (code !== 'Krinox1803') {
                alert('Invalid Access Code! Please enter the correct code.');
                return;
            }

            const { data: existing } = await supabaseClient
                .from('profiles')
                .select('username')
                .eq('username', username)
                .maybeSingle();

            if (existing) {
                alert('Username is already taken. Please choose another.');
                return;
            }

            const { error } = await supabaseClient
                .from('profiles')
                .insert([{ name, gender, username, password }]);

            if (error) {
                alert('Error creating profile: ' + error.message);
                return;
            }

            alert('Profile created successfully! Please sign in from the welcome page.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
