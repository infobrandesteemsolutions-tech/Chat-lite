<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Group Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative overflow-hidden shadow-2xl bg-slate-900 border-x border-slate-800 h-screen">
        
        <!-- Header (Tappable to Open Group Backend Settings) -->
        <div onclick="openGroupBackend()" class="p-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-900/90 backdrop-blur-md cursor-pointer group z-10">
            <div class="flex items-center gap-3 min-w-0">
                <button onclick="event.stopPropagation(); window.location.href='chatlist.html'" class="text-slate-400 hover:text-white p-1 cursor-pointer">
                    &larr;
                </button>
                <div id="group-header-avatar" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-orange-400 text-sm overflow-hidden flex-shrink-0">
                    GRP
                </div>
                <div class="min-w-0">
                    <h2 id="group-header-name" class="font-bold text-sm text-white group-hover:text-orange-400 transition-colors truncate">Loading Group...</h2>
                    <span id="group-header-meta" class="text-[11px] text-slate-400 truncate block">Tap for group settings</span>
                </div>
            </div>
            <div class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-slate-300 border border-slate-700 flex-shrink-0">Settings</div>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-950/40 pb-20">
            <div class="text-center text-xs text-slate-500 py-4">Loading group messages...</div>
        </div>

        <!-- Recording Indicator Bar -->
        <div id="recording-bar" class="hidden absolute bottom-16 left-0 right-0 bg-slate-900 border-t border-slate-800 p-3 flex items-center justify-between z-20">
            <div class="flex items-center gap-2 text-red-500 text-xs font-semibold animate-pulse">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                <span id="recording-timer">Recording... 0:00</span>
            </div>
            <button onclick="cancelRecording()" class="text-xs text-slate-400 hover:text-white cursor-pointer">Cancel</button>
        </div>

        <!-- Message Input Bar -->
        <div class="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2 relative z-20">
            <!-- Media Attachment / Tools Menu Toggle -->
            <button onclick="toggleMediaMenu()" class="text-slate-400 hover:text-white p-2 rounded-xl bg-slate-950 border border-slate-800 cursor-pointer flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                </svg>
            </button>

            <!-- Text Input -->
            <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-orange-500 text-sm text-white" onkeydown="if(event.key==='Enter') sendGroupMessage()">
            
            <!-- Send / Voice Note Button -->
            <button id="main-action-btn" onclick="handleMainAction()" class="p-2.5 bg-orange-600 hover:bg-orange-500 font-semibold rounded-xl text-white transition-all cursor-pointer flex-shrink-0">
                <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
            </button>
        </div>

        <!-- Popup Media Toolbar Menu -->
        <div id="media-menu" class="hidden absolute bottom-16 left-3 bg-slate-900 border border-slate-800 rounded-2xl p-2 shadow-2xl flex flex-col gap-1 z-30 w-48">
            <button onclick="triggerImageUpload()" class="flex items-center gap-3 px-3 py-2 text-xs text-slate-300 hover:bg-slate-800 rounded-xl transition-all cursor-pointer">
                <span class="w-7 h-7 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold">&#128247;</span> Photos & Files
            </button>
            <button onclick="openCameraModal()" class="flex items-center gap-3 px-3 py-2 text-xs text-slate-300 hover:bg-slate-800 rounded-xl transition-all cursor-pointer">
                <span class="w-7 h-7 rounded-full bg-orange-500/20 text-orange-400 flex items-center justify-center font-bold">&#127909;</span> Camera Snap
            </button>
            <button onclick="openVideoNoteModal()" class="flex items-center gap-3 px-3 py-2 text-xs text-slate-300 hover:bg-slate-800 rounded-xl transition-all cursor-pointer">
                <span class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">&#9201;</span> Video Note
            </button>
        </div>
        <input type="file" id="hidden-file-input" class="hidden" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" onchange="handleFileSelected(event)">
    </div>

    <!-- CAMERA CAPTURE MODAL -->
    <div id="camera-modal" class="fixed inset-0 bg-black hidden flex-col z-50">
        <div class="flex-1 relative flex items-center justify-center">
            <video id="camera-preview" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="camera-canvas" class="hidden"></canvas>
        </div>
        <div class="p-6 bg-slate-950 flex items-center justify-around">
            <button onclick="closeCameraModal()" class="text-slate-400 px-4 py-2 text-sm cursor-pointer">Cancel</button>
            <button onclick="capturePhoto()" class="w-16 h-16 rounded-full border-4 border-white bg-orange-600 cursor-pointer"></button>
            <div class="w-12"></div>
        </div>
    </div>

    <!-- VIDEO NOTE MODAL -->
    <div id="video-note-modal" class="fixed inset-0 bg-black hidden flex-col z-50">
        <div class="flex-1 relative flex items-center justify-center">
            <video id="video-note-preview" autoplay muted playsinline class="w-full h-full object-cover"></video>
            <div id="video-note-timer" class="absolute top-6 bg-red-600 text-white text-xs px-3 py-1 rounded-full font-mono hidden">0:00</div>
        </div>
        <div class="p-6 bg-slate-950 flex items-center justify-around">
            <button onclick="closeVideoNoteModal()" class="text-slate-400 px-4 py-2 text-sm cursor-pointer">Cancel</button>
            <button id="record-video-btn" onclick="toggleVideoNoteRecording()" class="w-16 h-16 rounded-full border-4 border-white bg-red-600 cursor-pointer animate-pulse"></button>
            <div class="w-12"></div>
        </div>
    </div>

    <!-- GROUP BACKEND / SETTINGS MODAL -->
    <div id="group-backend-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
                <div>
                    <h3 id="modal-group-name" class="font-bold text-base text-white">Group Settings</h3>
                    <p id="modal-group-desc" class="text-xs text-slate-400 truncate max-w-[280px]"></p>
                </div>
                <button onclick="closeGroupBackend()" class="text-slate-400 hover:text-white text-xl cursor-pointer">&times;</button>
            </div>

            <!-- Modal Scrollable Content -->
            <div class="flex-1 overflow-y-auto p-4 space-y-5">
                
                <!-- Group Code Info -->
                <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
                    <div>
                        <span class="text-[10px] text-slate-400 uppercase tracking-wider block font-semibold">Group Chat Code</span>
                        <span id="modal-group-code" class="text-xs font-mono font-bold text-orange-400 mt-0.5 block">--</span>
                    </div>
                    <button onclick="copyGroupCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition-all cursor-pointer">Copy</button>
                </div>

                <!-- Add Member Section (Restricted by Role) -->
                <div id="add-member-section" class="p-3.5 bg-slate-950 border border-slate-800 rounded-xl space-y-2 hidden">
                    <label class="block text-xs font-medium text-slate-400">Add Member via Chat Code</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="backend-member-code" placeholder="e.g. CL-ABC1234" class="flex-1 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg focus:outline-none focus:border-orange-500 text-xs font-mono text-white uppercase">
                        <button onclick="addGroupMemberFromBackend()" class="px-3 py-2 bg-orange-600 hover:bg-orange-500 font-semibold rounded-lg text-xs text-white transition-all cursor-pointer">Add</button>
                    </div>
                </div>

                <!-- Members List Container -->
                <div>
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Members List (<span id="member-count">0</span>)</h4>
                    <div id="backend-members-list" class="space-y-2">
                        <!-- Populated dynamically -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const groupId = urlParams.get('id');
        let currentUser = JSON.parse(localStorage.getItem('chatlite_user'));
        let currentGroup = null;
        let myRole = 'member'; // 'admin', 'assistant_admin', or 'member'
        let groupMembersCache = [];

        // Recording & Media variables
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecordingAudio = false;
        let recordingInterval = null;
        let recordingSeconds = 0;
        
        let cameraStream = null;
        let videoNoteStream = null;
        let videoNoteRecorder = null;
        let videoNoteChunks = [];
        let isRecordingVideoNote = false;

        if (!currentUser || !groupId) {
            window.location.href = 'chatlist.html';
        } else {
            initGroupRoom();
            setInterval(fetchGroupMessages, 4000);
        }

        // Input button dynamic toggling (mic vs send icon)
        const messageInput = document.getElementById('message-input');
        messageInput.addEventListener('input', () => {
            const btnIcon = document.getElementById('mic-icon');
            if (messageInput.value.trim().length > 0) {
                btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />`;
            } else {
                btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />`;
            }
        });

        function handleMainAction() {
            if (messageInput.value.trim().length > 0) {
                sendGroupMessage();
            } else {
                toggleAudioRecording();
            }
        }

        function toggleMediaMenu() {
            const menu = document.getElementById('media-menu');
            menu.classList.toggle('hidden');
        }

        // Close media menu when clicking outside
        window.addEventListener('click', (e) => {
            if (!e.target.closest('#media-menu') && !e.target.closest('button[onclick="toggleMediaMenu()"]')) {
                document.getElementById('media-menu').classList.add('hidden');
            }
        });

        async function initGroupRoom() {
            const { data: grp, error: grpErr } = await supabaseClient
                .from('groups')
                .select('*')
                .eq('id', groupId)
                .single();

            if (grpErr || !grp) {
                alert('Group not found.');
                window.location.href = 'chatlist.html';
                return;
            }
            currentGroup = grp;

            document.getElementById('group-header-name').textContent = grp.name;
            document.getElementById('modal-group-name').textContent = grp.name;
            document.getElementById('modal-group-desc').textContent = grp.description || 'No description provided.';
            document.getElementById('modal-group-code').textContent = grp.chat_code;

            const avatarContainer = document.getElementById('group-header-avatar');
            if (grp.avatar_url) {
                avatarContainer.innerHTML = `<img src="${grp.avatar_url}" class="w-full h-full object-cover">`;
            } else {
                avatarContainer.textContent = grp.name.charAt(0).toUpperCase();
            }

            await checkUserRoleAndLoadMembers();
            fetchGroupMessages();
        }

        async function checkUserRoleAndLoadMembers() {
            const { data: members, error } = await supabaseClient
                .from('group_members')
                .select('*')
                .eq('group_id', groupId);

            if (error || !members) return;

            const usernames = members.map(m => m.username);
            const { data: profiles } = await supabaseClient
                .from('profiles')
                .select('username, name, avatar_url, chat_code')
                .in('username', usernames);

            const profileMap = {};
            if (profiles) {
                profiles.forEach(p => { profileMap[p.username] = p; });
            }

            groupMembersCache = members.map(m => ({
                ...m,
                profiles: profileMap[m.username] || {}
            }));

            const userMembership = groupMembersCache.find(m => m.username === currentUser.username);
            if (!userMembership || userMembership.status !== 'accepted') {
                alert('You are no longer an active member of this group.');
                window.location.href = 'chatlist.html';
                return;
            }

            myRole = userMembership.role;

            if (myRole === 'admin' || myRole === 'assistant_admin') {
                document.getElementById('add-member-section').classList.remove('hidden');
            } else {
                document.getElementById('add-member-section').classList.add('hidden');
            }

            renderBackendMembersList(groupMembersCache);
        }

        function renderBackendMembersList(members) {
            const container = document.getElementById('backend-members-list');
            document.getElementById('member-count').textContent = members.length;
            container.innerHTML = '';

            members.forEach(m => {
                const profile = m.profiles || {};
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-2.5 bg-slate-950 border border-slate-800 rounded-xl';

                let avatarHTML = profile.avatar_url
                    ? `<img src="${profile.avatar_url}" class="w-9 h-9 rounded-full object-cover">`
                    : `<div class="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center font-bold text-orange-400 text-xs">${(profile.name || m.username || 'U').charAt(0).toUpperCase()}</div>`;

                let roleBadgeColor = 'text-slate-400 bg-slate-900 border-slate-800';
                if (m.role === 'admin') roleBadgeColor = 'text-orange-400 bg-orange-950/30 border-orange-500/30';
                else if (m.role === 'assistant_admin') roleBadgeColor = 'text-blue-400 bg-blue-950/30 border-blue-500/30';

                let controlsHTML = `<span class="text-xs px-2 py-1 rounded border font-semibold uppercase tracking-wider ${roleBadgeColor}">${(m.role || 'member').replace('_', ' ')}</span>`;

                if (myRole === 'admin' && m.username !== currentUser.username) {
                    controlsHTML = `
                        <div class="flex items-center gap-1.5">
                            <select onchange="updateMemberRole('${m.username}', this.value)" class="text-[11px] bg-slate-900 border border-slate-700 text-slate-200 rounded px-1.5 py-1 focus:outline-none">
                                <option value="admin" ${m.role === 'admin' ? 'selected' : ''}>Admin</option>
                                <option value="assistant_admin" ${m.role === 'assistant_admin' ? 'selected' : ''}>Assistant Admin</option>
                                <option value="member" ${m.role === 'member' ? 'selected' : ''}>Member</option>
                            </select>
                            <button onclick="removeGroupMember('${m.username}')" class="text-[11px] bg-red-950/30 text-red-400 hover:bg-red-900/50 px-2 py-1 rounded border border-red-900/40 transition-all cursor-pointer">Remove</button>
                        </div>
                    `;
                } else if (myRole === 'assistant_admin' && m.role !== 'admin' && m.username !== currentUser.username) {
                    controlsHTML = `
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] px-2 py-1 rounded border font-semibold uppercase tracking-wider ${roleBadgeColor}">${m.role.replace('_', ' ')}</span>
                            <button onclick="removeGroupMember('${m.username}')" class="text-[11px] bg-red-950/30 text-red-400 hover:bg-red-900/50 px-2 py-1 rounded border border-red-900/40 transition-all cursor-pointer">Remove</button>
                        </div>
                    `;
                }

                item.innerHTML = `
                    <div class="flex items-center gap-2.5 flex-1 min-w-0">
                        ${avatarHTML}
                        <div class="min-w-0">
                            <h5 class="text-xs font-semibold text-white truncate">${profile.name || m.username}</h5>
                            <p class="text-[10px] text-slate-400 truncate">@${profile.username || m.username} &bull; <span class="capitalize text-emerald-400">${m.status}</span></p>
                        </div>
                    </div>
                    <div>${controlsHTML}</div>
                `;
                container.appendChild(item);
            });
        }

        function openGroupBackend() {
            document.getElementById('group-backend-modal').classList.remove('hidden');
            document.getElementById('group-backend-modal').classList.add('flex');
            checkUserRoleAndLoadMembers();
        }

        function closeGroupBackend() {
            document.getElementById('group-backend-modal').classList.remove('flex');
            document.getElementById('group-backend-modal').classList.add('hidden');
        }

        function copyGroupCode() {
            if (!currentGroup || !currentGroup.chat_code) return;
            navigator.clipboard.writeText(currentGroup.chat_code);
            alert('Group Chat Code copied: ' + currentGroup.chat_code);
        }

        async function addGroupMemberFromBackend() {
            const codeInput = document.getElementById('backend-member-code');
            const targetCode = codeInput.value.trim().toUpperCase();
            if (!targetCode) return;

            const { data: userProfile, error: profileErr } = await supabaseClient
                .from('profiles')
                .select('username, name')
                .eq('chat_code', targetCode)
                .maybeSingle();

            if (profileErr || !userProfile) {
                alert('Invalid Chat Code. User not found.');
                return;
            }

            const existing = groupMembersCache.find(m => m.username === userProfile.username);
            if (existing) {
                alert('User is already in this group or has a pending invite.');
                return;
            }

            const { error: insertErr } = await supabaseClient
                .from('group_members')
                .insert([{
                    group_id: groupId,
                    username: userProfile.username,
                    role: 'member',
                    status: 'pending'
                }]);

            if (insertErr) {
                alert('Error adding member: ' + insertErr.message);
                return;
            }

            codeInput.value = '';
            alert(`Group invitation sent to ${userProfile.name}!`);
            checkUserRoleAndLoadMembers();
        }

        async function removeGroupMember(usernameToRemove) {
            if (!confirm("Are you sure you want to remove this member from the group?")) return;

            const { error } = await supabaseClient
                .from('group_members')
                .delete()
                .eq('group_id', groupId)
                .eq('username', usernameToRemove);

            if (error) {
                alert('Error removing member: ' + error.message);
                return;
            }

            checkUserRoleAndLoadMembers();
        }

        async function updateMemberRole(usernameToUpdate, newRole) {
            const { error } = await supabaseClient
                .from('group_members')
                .update({ role: newRole })
                .eq('group_id', groupId)
                .eq('username', usernameToUpdate);

            if (error) {
                alert('Error updating role: ' + error.message);
                checkUserRoleAndLoadMembers();
                return;
            }

            alert('Role updated successfully.');
            checkUserRoleAndLoadMembers();
        }

        // --- MULTIMEDIA & MESSAGING FUNCTIONS ---

        async function sendGroupMessage(mediaUrl = null, mediaType = null) {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text && !mediaUrl) return;

            const { error } = await supabaseClient
                .from('group_messages')
                .insert([{
                    group_id: groupId,
                    sender_username: currentUser.username,
                    sender_name: currentUser.name,
                    message: text || (mediaType === 'image' ? '📷 Photo' : mediaType === 'audio' ? '🎤 Voice Note' : mediaType === 'video' ? '📹 Video Note' : '📁 Attachment'),
                    media_url: mediaUrl,
                    media_type: mediaType
                }]);

            if (error) {
                alert('Error sending message: ' + error.message);
                return;
            }

            input.value = '';
            document.getElementById('mic-icon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />`;
            fetchGroupMessages();
        }

        function triggerImageUpload() {
            document.getElementById('media-menu').classList.add('hidden');
            document.getElementById('hidden-file-input').click();
        }

        async function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileExt = file.name.split('.').pop();
            const fileName = `${Math.random().toString(36.substring(2))}_${Date.now()}.${fileExt}`;
            const filePath = `group_uploads/${fileName}`;

            const { error: uploadErr } = await supabaseClient.storage
                .from('chat_media')
                .upload(filePath, file);

            if (uploadErr) {
                alert('Error uploading file: ' + uploadErr.message);
                return;
            }

            const { data: publicURLData } = supabaseClient.storage
                .from('chat_media')
                .getPublicUrl(filePath);

            const mediaType = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'file';
            await sendGroupMessage(publicURLData.publicUrl, mediaType);
            event.target.value = '';
        }

        // Audio Voice Notes
        async function toggleAudioRecording() {
            if (!isRecordingAudio) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const fileName = `audio_${Date.now()}.webm`;
                        const filePath = `group_uploads/${fileName}`;

                        const { error: uploadErr } = await supabaseClient.storage
                            .from('chat_media')
                            .upload(filePath, audioBlob);

                        if (!uploadErr) {
                            const { data } = supabaseClient.storage.from('chat_media').getPublicUrl(filePath);
                            await sendGroupMessage(data.publicUrl, 'audio');
                        }
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecordingAudio = true;
                    document.getElementById('recording-bar').classList.remove('hidden');
                    recordingSeconds = 0;
                    document.getElementById('recording-timer').textContent = `Recording... 0:00`;
                    recordingInterval = setInterval(() => {
                        recordingSeconds++;
                        const mins = Math.floor(recordingSeconds / 60);
                        const secs = recordingSeconds % 60;
                        document.getElementById('recording-timer').textContent = `Recording... ${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    }, 1000);

                    document.getElementById('main-action-btn').classList.remove('bg-orange-600', 'hover:bg-orange-500');
                    document.getElementById('main-action-btn').classList.add('bg-red-600', 'hover:bg-red-500', 'animate-pulse');
                } catch (err) {
                    alert('Microphone access denied or unavailable.');
                }
            } else {
                clearInterval(recordingInterval);
                mediaRecorder.stop();
                isRecordingAudio = false;
                document.getElementById('recording-bar').classList.add('hidden');
                document.getElementById('main-action-btn').classList.remove('bg-red-600', 'hover:bg-red-500', 'animate-pulse');
                document.getElementById('main-action-btn').classList.add('bg-orange-600', 'hover:bg-orange-500');
            }
        }

        function cancelRecording() {
            if (isRecordingAudio && mediaRecorder) {
                mediaRecorder.onstop = null;
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
            }
            clearInterval(recordingInterval);
            isRecordingAudio = false;
            document.getElementById('recording-bar').classList.add('hidden');
            document.getElementById('main-action-btn').classList.remove('bg-red-600', 'hover:bg-red-500', 'animate-pulse');
            document.getElementById('main-action-btn').classList.add('bg-orange-600', 'hover:bg-orange-500');
        }

        // Camera Snap Modal
        async function openCameraModal() {
            document.getElementById('media-menu').classList.add('hidden');
            const modal = document.getElementById('camera-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                document.getElementById('camera-preview').srcObject = cameraStream;
            } catch (err) {
                alert('Camera access denied or unavailable.');
                closeCameraModal();
            }
        }

        function closeCameraModal() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
            }
            const modal = document.getElementById('camera-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        async function capturePhoto() {
            const video = document.getElementById('camera-preview');
            const canvas = document.getElementById('camera-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                closeCameraModal();
                const fileName = `snap_${Date.now()}.jpg`;
                const filePath = `group_uploads/${fileName}`;

                const { error: uploadErr } = await supabaseClient.storage
                    .from('chat_media')
                    .upload(filePath, blob);

                if (!uploadErr) {
                    const { data } = supabaseClient.storage.from('chat_media').getPublicUrl(filePath);
                    await sendGroupMessage(data.publicUrl, 'image');
                }
            }, 'image/jpeg', 0.85);
        }

        // Video Note Modal
        async function openVideoNoteModal() {
            document.getElementById('media-menu').classList.add('hidden');
            const modal = document.getElementById('video-note-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                videoNoteStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('video-note-preview').srcObject = videoNoteStream;
            } catch (err) {
                alert('Camera/Microphone access denied.');
                closeVideoNoteModal();
            }
        }

        function closeVideoNoteModal() {
            if (videoNoteStream) {
                videoNoteStream.getTracks().forEach(t => t.stop());
            }
            const modal = document.getElementById('video-note-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            isRecordingVideoNote = false;
        }

        function toggleVideoNoteRecording() {
            const timerEl = document.getElementById('video-note-timer');
            const btn = document.getElementById('record-video-btn');

            if (!isRecordingVideoNote) {
                videoNoteChunks = [];
                videoNoteRecorder = new MediaRecorder(videoNoteStream);
                videoNoteRecorder.ondataavailable = e => videoNoteChunks.push(e.data);
                videoNoteRecorder.onstop = async () => {
                    const videoBlob = new Blob(videoNoteChunks, { type: 'video/webm' });
                    const fileName = `vid_note_${Date.now()}.webm`;
                    const filePath = `group_uploads/${fileName}`;

                    const { error: uploadErr } = await supabaseClient.storage
                        .from('chat_media')
                        .upload(filePath, videoBlob);

                    if (!uploadErr) {
                        const { data } = supabaseClient.storage.from('chat_media').getPublicUrl(filePath);
                        await sendGroupMessage(data.publicUrl, 'video');
                    }
                    closeVideoNoteModal();
                };

                videoNoteRecorder.start();
                isRecordingVideoNote = true;
                timerEl.classList.remove('hidden');
                btn.classList.add('bg-white', 'scale-90');
            } else {
                videoNoteRecorder.stop();
            }
        }

        async function fetchGroupMessages() {
            const { data: messages, error } = await supabaseClient
                .from('group_messages')
                .select('*')
                .eq('group_id', groupId)
                .order('created_at', { ascending: true });

            if (error) return;

            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML = '';

            if (!messages || messages.length === 0) {
                chatContainer.innerHTML = `<div class="text-center text-xs text-slate-500 py-8">No messages yet. Start the conversation!</div>`;
                return;
            }

            messages.forEach(msg => {
                const isMe = msg.sender_username === currentUser.username;
                const bubble = document.createElement('div');
                bubble.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2`;

                const timeString = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                let contentHtml = `<span>${escapeHtml(msg.message)}</span>`;
                if (msg.media_type === 'image' && msg.media_url) {
                    contentHtml = `<img src="${msg.media_url}" class="rounded-xl max-h-48 object-cover cursor-pointer mb-1" onclick="window.open('${msg.media_url}', '_blank')"><span>${escapeHtml(msg.message)}</span>`;
                } else if (msg.media_type === 'video' && msg.media_url) {
                    contentHtml = `<video src="${msg.media_url}" controls class="rounded-xl max-h-48 object-cover mb-1"></video><span>${escapeHtml(msg.message)}</span>`;
                } else if (msg.media_type === 'audio' && msg.media_url) {
                    contentHtml = `<audio src="${msg.media_url}" controls class="max-w-[200px] h-10 mb-1"></audio><span>${escapeHtml(msg.message)}</span>`;
                }

                bubble.innerHTML = `
                    <div class="max-w-[75%] px-3.5 py-2 rounded-2xl text-sm ${isMe ? 'bg-orange-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-100 rounded-bl-none'}">
                        ${!isMe ? `<span class="block text-[10px] font-bold text-orange-400 mb-0.5">${msg.sender_name}</span>` : ''}
                        ${contentHtml}
                    </div>
                    <span class="text-[9px] text-slate-500 mt-0.5 px-1">${timeString}</span>
                `;
                chatContainer.appendChild(bubble);
            });

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
