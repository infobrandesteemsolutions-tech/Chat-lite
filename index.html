<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col items-center justify-center p-6 text-center">

    <!-- WELCOME SCREEN -->
    <div class="space-y-6 max-w-xs w-full">
        <div class="space-y-2">
            <h1 class="text-4xl font-black tracking-wider text-emerald-400">Chat Lite</h1>
            <p class="text-slate-400 text-sm">Secure community platform.</p>
        </div>
        <div class="space-y-3">
            <a href="register.html" class="block w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-semibold transition shadow-lg text-white text-center">Create a Profile</a>
            <button onclick="openLoginModal()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 py-3 rounded-xl font-semibold transition text-slate-200">Access Chats</button>
        </div>
    </div>

    <!-- LOGIN MODAL POPUP -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl text-left">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-emerald-400">Access Chats</h3>
                <button onclick="closeLoginModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">Username</label>
                    <input type="text" id="login-username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm outline-none focus:border-emerald-500 text-white">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-semibold transition text-white">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            const { data, error } = await client
                .from('profiles')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .single();

            if (error || !data) {
                alert('Invalid username or password.');
                return;
            }

            // Save user session locally and redirect to chat lists page
            localStorage.setItem('chatlite_user', JSON.stringify(data));
            window.location.href = 'chats.html';
        });
    </script>
</body>
</html>
