<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative overflow-hidden shadow-2xl bg-slate-900 border-x border-slate-800">
        
        <!-- Welcome View Container -->
        <div class="flex flex-col items-center justify-center flex-1 p-8 text-center space-y-8">
            <div class="space-y-3">
                <h1 class="text-5xl font-extrabold tracking-tight bg-gradient-to-r from-sky-400 to-indigo-500 bg-clip-text text-transparent">
                    Chat Lite
                </h1>
                <p class="text-slate-400 text-sm">Your private family messaging space.</p>
            </div>
            
            <div class="w-full space-y-4">
                <!-- Directs to separate Register Page -->
                <button onclick="window.location.href='register.html'" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">
                    Create a Profile
                </button>
                <!-- Opens Login Modal -->
                <button onclick="openLoginModal()" class="w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-slate-700 transition-all cursor-pointer">
                    Access Chats
                </button>
            </div>
        </div>

        <!-- Login Popup Modal -->
        <div id="login-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 space-y-5 shadow-2xl">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold">Access Chats</h3>
                    <button onclick="closeLoginModal()" class="text-slate-400 hover:text-white text-xl cursor-pointer">&times;</button>
                </div>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
                        <input type="text" id="login-username" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                        <input type="password" id="login-password" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all mt-2 cursor-pointer">
                        Sign In &rarr;
                    </button>
                </form>
            </div>
        </div>

    </div>

    <script src="supabase.js"></script>
    <script>
        function openLoginModal() {
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('login-modal').classList.add('flex');
        }
        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('flex');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .maybeSingle();

            if (error || !data) {
                alert('Invalid username or password.');
                return;
            }

            // Save user session locally and redirect to chat list page
            localStorage.setItem('chatlite_user', JSON.stringify(data));
            window.location.href = 'chatlist.html';
        }
    </script>
</body>
</html>
