<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite</title>
    <!-- Tailwind CSS for modern mobile styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold text-emerald-400">Chat Lite</h1>
        <span id="status" class="text-xs text-amber-400">Connecting...</span>
    </header>

    <!-- Chat Messages Stream -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
        <!-- Messages will dynamically inject here -->
    </div>

    <!-- Input Form -->
    <form id="chat-form" class="bg-slate-800 p-3 flex gap-2">
        <input type="text" id="sender-input" placeholder="Your Name" class="bg-slate-700 px-3 py-2 rounded-lg text-sm w-1/3 outline-none focus:ring-2 focus:ring-emerald-500" required>
        <input type="text" id="message-input" placeholder="Type a message..." class="bg-slate-700 px-3 py-2 rounded-lg text-sm flex-1 outline-none focus:ring-2 focus:ring-emerald-500" required>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-semibold transition">Send</button>
    </form>

    <script>
        // Supabase Configuration for Chat Lite
        const SUPABASE_URL = 'https://qclfxoyxnihuttlemzmi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-jLY8uajMI_u_mxQHHUAsA_Q5d5FWVG';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const senderInput = document.getElementById('sender-input');
        const statusIndicator = document.getElementById('status');

        // 1. Fetch initial existing messages
        async function loadMessages() {
            const { data, error } = await client
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Error loading messages:', error);
                statusIndicator.textContent = 'Connection Error';
                statusIndicator.className = 'text-xs text-red-400';
                return;
            }

            statusIndicator.textContent = 'Online & Synced';
            statusIndicator.className = 'text-xs text-emerald-400';
            
            chatContainer.innerHTML = '';
            if (data) {
                data.forEach(msg => appendMessageUI(msg));
                scrollToBottom();
            }
        }

        // 2. Append individual message to UI
        function appendMessageUI(msg) {
            const isMe = senderInput.value && msg.sender === senderInput.value;
            const messageDiv = document.createElement('div');
            messageDiv.className = `max-w-[75%] p-3 rounded-xl text-sm flex flex-col ${isMe ? 'self-end bg-emerald-700 text-white' : 'self-start bg-slate-800 text-slate-200'}`;
            
            const timeString = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `
                <span class="text-xs font-bold text-emerald-300 mb-1">${escapeHtml(msg.sender)}</span>
                <span class="break-words">${escapeHtml(msg.content)}</span>
                <span class="text-[10px] text-slate-400 self-end mt-1">${timeString}</span>
            `;
            chatContainer.appendChild(messageDiv);
        }

        // 3. Send message handler
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const sender = senderInput.value.trim();
            const content = messageInput.value.trim();
            if (!content || !sender) return;

            const { error } = await client
                .from('messages')
                .insert([{ sender, content }]);

            if (error) {
                alert('Failed to send message: ' + error.message);
            } else {
                messageInput.value = ''; // Clear input field
            }
        });

        // 4. Real-time Listener (Listen for incoming messages instantly)
        client
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                appendMessageUI(payload.new);
                scrollToBottom();
            })
            .subscribe();

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Load messages on startup
        loadMessages();
    </script>
</body>
</html>
