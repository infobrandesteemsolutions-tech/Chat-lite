<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Chats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative overflow-hidden shadow-2xl bg-slate-900 border-x border-slate-800 h-screen">
        
        <!-- Header with Tappable Profile Area -->
        <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90 backdrop-blur-md">
            <div onclick="window.location.href='profile.html'" class="flex items-center gap-3 cursor-pointer group">
                <div id="header-avatar" class="w-10 h-10 rounded-full bg-orange-600/20 border border-orange-500/30 flex items-center justify-center font-bold text-orange-400 text-sm overflow-hidden shadow-inner">
                    <!-- Loaded dynamically -->
                </div>
                <div>
                    <h2 class="font-bold text-base text-white group-hover:text-orange-400 transition-colors flex items-center gap-1.5">
                        <span id="current-user-name">Loading...</span> 
                        <svg class="w-3.5 h-3.5 text-slate-400 group-hover:text-orange-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </h2>
                    <span class="text-xs text-emerald-400 flex items-center gap-1.5 mt-0.5"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Online</span>
                </div>
            </div>
            <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-red-400 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/60 transition-all cursor-pointer backdrop-blur-md">Sign Out</button>
        </div>
        
        <!-- Chat Code Banner & Add Contact Action Bar -->
        <div class="px-4 py-3 bg-slate-950 border-b border-slate-800/80 flex items-center justify-between">
            <div>
                <span class="text-[10px] text-slate-400 block uppercase tracking-wider font-semibold">Your Chat Code</span>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="my-chat-code" class="text-xs font-mono font-bold text-orange-400 bg-orange-950/30 px-2 py-0.5 rounded border border-orange-500/20">Loading...</span>
                    <button onclick="copyChatCode()" class="text-[10px] text-slate-300 bg-slate-800 hover:bg-slate-700 px-2 py-0.5 rounded cursor-pointer transition-all">Copy</button>
                </div>
            </div>
            <button onclick="openInviteModal()" class="px-3.5 py-2 bg-orange-600 hover:bg-orange-500 text-white font-semibold rounded-xl text-xs shadow-lg shadow-orange-600/20 transition-all cursor-pointer">
                + Add Contact
            </button>
        </div>

        <!-- Section Tabs or Header -->
        <div class="px-4 py-2 bg-slate-900/80 border-b border-slate-800/50 flex items-center justify-between text-xs font-semibold text-slate-400 uppercase tracking-wider">
            <span>Conversations & Requests</span>
        </div>

        <!-- Members / Chat List Container -->
        <div id="members-list" class="flex-1 overflow-y-auto divide-y divide-slate-800/40 bg-slate-900/40">
            <div class="p-8 text-center text-slate-500 text-sm">Loading connections...</div>
        </div>
    </div>

    <!-- ADD CONTACT / INVITE MODAL -->
    <div id="invite-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-white">Add Contact via Chat Code</h3>
                <button onclick="closeInviteModal()" class="text-slate-400 hover:text-white text-xl cursor-pointer">&times;</button>
            </div>
            <p class="text-xs text-slate-400">Enter your contact's unique Chat Code to send them a connection invite.</p>
            <form onsubmit="sendInvitation(event)" class="space-y-3">
                <input type="text" id="target-chat-code" placeholder="e.g. CL-ABC1234" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-orange-500 text-sm font-mono text-white uppercase">
                <button type="submit" class="w-full py-3 bg-orange-600 hover:bg-orange-500 font-semibold rounded-xl text-sm text-white transition-all cursor-pointer shadow-lg shadow-orange-600/20">
                    Send Invitation
                </button>
            </form>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('chatlite_user'));

        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            initHeaderProfile();
            loadConnectionsAndChats();
            setInterval(loadConnectionsAndChats, 5000);
        }

        function initHeaderProfile() {
            document.getElementById('current-user-name').textContent = currentUser.name;
            document.getElementById('my-chat-code').textContent = currentUser.chat_code || 'N/A';
            const avatarContainer = document.getElementById('header-avatar');
            if (currentUser.avatar_url) {
                avatarContainer.innerHTML = `<img src="${currentUser.avatar_url}" class="w-full h-full object-cover">`;
            } else {
                avatarContainer.textContent = currentUser.name.charAt(0).toUpperCase();
            }
        }

        function copyChatCode() {
            if (!currentUser.chat_code) return;
            navigator.clipboard.writeText(currentUser.chat_code);
            alert('Chat Code copied to clipboard: ' + currentUser.chat_code);
        }

        function openInviteModal() {
            document.getElementById('invite-modal').classList.remove('hidden');
            document.getElementById('invite-modal').classList.add('flex');
        }

        function closeInviteModal() {
            document.getElementById('invite-modal').classList.remove('flex');
            document.getElementById('invite-modal').classList.add('hidden');
        }

        async function sendInvitation(e) {
            e.preventDefault();
            const targetCode = document.getElementById('target-chat-code').value.trim().toUpperCase();

            if (targetCode === currentUser.chat_code) {
                alert("You cannot add your own chat code.");
                return;
            }

            // Find target user by chat code
            const { data: targetUser, error: findError } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('chat_code', targetCode)
                .maybeSingle();

            if (findError || !targetUser) {
                alert('Invalid Chat Code. No user found with this code.');
                return;
            }

            // Check if connection already exists between them
            const { data: existingConn } = await supabaseClient
                .from('connections')
                .select('*')
                .or(`and(sender_username.eq.${currentUser.username},receiver_username.eq.${targetUser.username}),and(sender_username.eq.${targetUser.username},receiver_username.eq.${currentUser.username})`)
                .maybeSingle();

            if (existingConn) {
                if (existingConn.status === 'accepted') {
                    alert('You are already connected with this user!');
                } else if (existingConn.status === 'pending') {
                    alert('An invitation is already pending between you two.');
                } else if (existingConn.status === 'blocked') {
                    alert('Unable to connect with this user.');
                }
                return;
            }

            // Insert new pending connection request
            const { error: insertError } = await supabaseClient
                .from('connections')
                .insert([{
                    sender_username: currentUser.username,
                    receiver_username: targetUser.username,
                    status: 'pending'
                }]);

            if (insertError) {
                alert('Error sending invite: ' + insertError.message);
                return;
            }

            alert(`Invitation sent successfully to ${targetUser.name}!`);
            document.getElementById('target-chat-code').value = '';
            closeInviteModal();
            loadConnectionsAndChats();
        }

        async function loadConnectionsAndChats() {
            if (!navigator.onLine) return;

            // Fetch latest user profile session
            const { data: freshProfile } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('username', currentUser.username)
                .maybeSingle();

            if (freshProfile) {
                currentUser = freshProfile;
                localStorage.setItem('chatlite_user', JSON.stringify(currentUser));
                initHeaderProfile();
            }

            // Fetch all connections where current user is sender or receiver
            const { data: connections, error } = await supabaseClient
                .from('connections')
                .select('*')
                .or(`sender_username.eq.${currentUser.username},receiver_username.eq.${currentUser.username}`);

            if (error) return;

            const listContainer = document.getElementById('members-list');
            listContainer.innerHTML = '';

            if (!connections || connections.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm">No connections yet. Tap <b>+ Add Contact</b> above to add family or friends using their Chat Code.</div>`;
                return;
            }

            // Extract connected / pending usernames
            let relatedUsernames = [];
            connections.forEach(c => {
                if (c.sender_username === currentUser.username) relatedUsernames.push(c.receiver_username);
                if (c.receiver_username === currentUser.username) relatedUsernames.push(c.sender_username);
            });

            if (relatedUsernames.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm">No connections yet.</div>`;
                return;
            }

            const { data: profiles } = await supabaseClient
                .from('profiles')
                .select('*')
                .in('username', relatedUsernames);

            const profileMap = {};
            if (profiles) profiles.forEach(p => profileMap[p.username] = p);

            // Render each connection item
            for (let conn of connections) {
                const otherUsername = conn.sender_username === currentUser.username ? conn.receiver_username : conn.sender_username;
                const member = profileMap[otherUsername];
                if (!member) continue;

                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3.5 border-b border-slate-800/40 bg-slate-900/60';

                let avatarHTML = member.avatar_url 
                    ? `<img src="${member.avatar_url}" class="w-12 h-12 rounded-full object-cover">`
                    : `<div class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-orange-400 text-base">${member.name.charAt(0).toUpperCase()}</div>`;

                // Status Check Logic
                if (conn.status === 'accepted') {
                    item.className += ' hover:bg-slate-800/50 cursor-pointer transition-all';
                    item.innerHTML = `
                        <div class="flex items-center gap-3.5 flex-1 min-w-0" onclick="openChatRoom('${member.username}', '${encodeURIComponent(member.name)}', '${member.gender}')">
                            <div class="relative">
                                ${avatarHTML}
                                <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="font-semibold text-sm truncate text-white">${member.name}</h4>
                                <p class="text-xs text-slate-400 truncate">@${member.username} &bull; Connected</p>
                            </div>
                        </div>
                        <button onclick="blockUser('${conn.id}')" class="text-[10px] text-red-400 bg-red-950/30 hover:bg-red-900/50 px-2.5 py-1.5 rounded-lg border border-red-900/40 transition-all cursor-pointer">Block</button>
                    `;
                } else if (conn.status === 'pending') {
                    if (conn.receiver_username === currentUser.username) {
                        // Incoming Request
                        item.innerHTML = `
                            <div class="flex items-center gap-3.5 flex-1 min-w-0">
                                ${avatarHTML}
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-semibold text-sm truncate text-white">${member.name}</h4>
                                    <p class="text-xs text-orange-400 truncate">Wants to connect with you</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="updateConnectionStatus('${conn.id}', 'accepted')" class="text-xs bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-white font-semibold transition-all cursor-pointer">Accept</button>
                                <button onclick="updateConnectionStatus('${conn.id}', 'declined')" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg text-slate-300 transition-all cursor-pointer">Decline</button>
                            </div>
                        `;
                    } else {
                        // Outgoing Request
                        item.innerHTML = `
                            <div class="flex items-center gap-3.5 flex-1 min-w-0">
                                ${avatarHTML}
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-semibold text-sm truncate text-white">${member.name}</h4>
                                    <p class="text-xs text-slate-400 truncate">Invitation Pending...</p>
                                </div>
                            </div>
                            <button onclick="updateConnectionStatus('${conn.id}', 'declined')" class="text-[10px] text-slate-400 hover:text-red-400 bg-slate-800 px-2.5 py-1.5 rounded-lg transition-all cursor-pointer">Cancel</button>
                        `;
                    }
                } else if (conn.status === 'blocked') {
                    item.className += ' opacity-60';
                    item.innerHTML = `
                        <div class="flex items-center gap-3.5 flex-1 min-w-0">
                            ${avatarHTML}
                            <div class="flex-1 min-w-0">
                                <h4 class="font-semibold text-sm truncate text-white">${member.name}</h4>
                                <p class="text-xs text-red-400 truncate">Blocked Connection</p>
                            </div>
                        </div>
                        <button onclick="updateConnectionStatus('${conn.id}', 'accepted')" class="text-[10px] text-emerald-400 bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg transition-all cursor-pointer">Unblock</button>
                    `;
                }

                listContainer.appendChild(item);
            }
        }

        async function updateConnectionStatus(connId, newStatus) {
            if (newStatus === 'declined') {
                await supabaseClient.from('connections').delete().eq('id', connId);
            } else {
                await supabaseClient.from('connections').update({ status: newStatus }).eq('id', connId);
            }
            loadConnectionsAndChats();
        }

        async function blockUser(connId) {
            if (confirm("Are you sure you want to block this user?")) {
                await supabaseClient.from('connections').update({ status: 'blocked' }).eq('id', connId);
                loadConnectionsAndChats();
            }
        }

        function openChatRoom(username, name, gender) {
            window.location.href = `chatroom.html?to=${username}&name=${name}&gender=${gender}`;
        }

        function handleLogout() {
            localStorage.removeItem('chatlite_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
