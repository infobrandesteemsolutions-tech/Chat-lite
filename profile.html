<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Profile Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative overflow-hidden shadow-2xl bg-slate-900 border-x border-slate-800 h-screen">
        
        <!-- Header -->
        <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90 backdrop-blur-md z-20">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='chatlist.html'" class="text-slate-400 hover:text-white p-1 cursor-pointer">
                    &larr; Back
                </button>
                <h2 class="font-bold text-base text-white">Profile Settings</h2>
            </div>
        </div>

        <!-- Scrollable Form Container -->
        <div class="flex-1 overflow-y-auto pb-10">
            
            <!-- Cover Picture Section with Upload Trigger -->
            <div class="relative h-36 bg-slate-800 border-b border-slate-800 group cursor-pointer" onclick="document.getElementById('cover-file-input').click()">
                <div id="cover-preview" class="w-full h-full bg-cover bg-center bg-slate-800 flex items-center justify-center text-slate-400 text-xs font-medium">
                    Tap to change cover photo
                </div>
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs font-semibold">
                    Change Cover Photo
                </div>
                <input type="file" id="cover-file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event, 'cover')">
            </div>

            <!-- Avatar & Profile Info Form -->
            <div class="px-6 relative pb-6">
                
                <!-- Avatar Overlapping Cover with Upload Trigger -->
                <div class="relative -mt-12 mb-4 flex items-end justify-between">
                    <div class="relative group cursor-pointer" onclick="document.getElementById('avatar-file-input').click()">
                        <div id="avatar-preview" class="w-24 h-24 rounded-full border-4 border-slate-900 bg-slate-800 overflow-hidden shadow-xl flex items-center justify-center text-2xl font-bold text-orange-400">
                            U
                        </div>
                        <div class="absolute inset-0 rounded-full bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-[10px] text-center font-semibold p-1">
                            Change Photo
                        </div>
                    </div>
                    <input type="file" id="avatar-file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event, 'avatar')">
                </div>

                <!-- Chat Code Management Section -->
                <div class="mb-5 p-4 bg-slate-950 border border-slate-800 rounded-2xl flex items-center justify-between">
                    <div>
                        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Your Chat Code</span>
                        <span id="profile-chat-code" class="text-sm font-mono font-bold text-orange-400 mt-0.5 block">Loading...</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="copyProfileChatCode()" id="copy-code-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl transition-all cursor-pointer hidden">Copy</button>
                        <button type="button" onclick="openCodeModal()" id="gen-code-btn" class="text-xs bg-orange-600/20 border border-orange-500/30 hover:bg-orange-600/30 text-orange-400 px-3 py-2 rounded-xl font-semibold transition-all cursor-pointer">Generate Code</button>
                    </div>
                </div>

                <form onsubmit="handleSaveProfile(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Display Name</label>
                        <input type="text" id="profile-name" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-orange-500 text-sm text-white">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Username (Read-only)</label>
                        <input type="text" id="profile-username" disabled class="w-full px-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-sm text-slate-500 cursor-not-allowed">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Bio / About Me</label>
                        <textarea id="profile-bio" rows="3" placeholder="Write a short bio about yourself..." class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-orange-500 text-sm text-white resize-none"></textarea>
                    </div>

                    <button type="submit" id="save-btn" class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 font-semibold rounded-xl shadow-lg shadow-orange-600/30 transition-all mt-4 cursor-pointer text-white">
                        Save Changes
                    </button>
                </form>

            </div>

        </div>

    </div>

    <!-- CODE GENERATION CONFIRMATION MODAL -->
    <div id="code-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-white">Generate New Chat Code?</h3>
            <p class="text-xs text-slate-400 leading-relaxed">
                Generating a brand new chat code will replace your existing code. Anyone who tries to connect with your old code will no longer be able to find you. Are you sure?
            </p>
            <div class="flex items-center gap-3 pt-2">
                <button type="button" onclick="closeCodeModal()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-xs transition-all cursor-pointer">Cancel</button>
                <button type="button" onclick="generateAndSaveChatCode()" class="flex-1 py-2.5 bg-orange-600 hover:bg-orange-500 text-white font-semibold rounded-xl text-xs shadow-lg shadow-orange-600/20 transition-all cursor-pointer">Yes, Generate</button>
            </div>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('chatlite_user'));
        let newAvatarBase64 = null;
        let newCoverBase64 = null;

        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            populateForm();
        }

        function populateForm() {
            document.getElementById('profile-name').value = currentUser.name || '';
            document.getElementById('profile-username').value = currentUser.username || '';
            document.getElementById('profile-bio').value = currentUser.bio || '';
            newAvatarBase64 = currentUser.avatar_url || null;
            newCoverBase64 = currentUser.cover_url || null;

            updateChatCodeUI();
            updatePreviews();
        }

        function updateChatCodeUI() {
            const codeDisplay = document.getElementById('profile-chat-code');
            const copyBtn = document.getElementById('copy-code-btn');
            const genBtn = document.getElementById('gen-code-btn');

            if (currentUser.chat_code) {
                codeDisplay.textContent = currentUser.chat_code;
                copyBtn.classList.remove('hidden');
                genBtn.textContent = 'Regenerate Code';
            } else {
                codeDisplay.textContent = 'Not Generated (N/A)';
                copyBtn.classList.add('hidden');
                genBtn.textContent = 'Generate Code Now';
            }
        }

        function copyProfileChatCode() {
            if (!currentUser.chat_code) return;
            navigator.clipboard.writeText(currentUser.chat_code);
            alert('Chat Code copied to clipboard: ' + currentUser.chat_code);
        }

        function openCodeModal() {
            document.getElementById('code-modal').classList.remove('hidden');
            document.getElementById('code-modal').classList.add('flex');
        }

        function closeCodeModal() {
            document.getElementById('code-modal').classList.remove('flex');
            document.getElementById('code-modal').classList.add('hidden');
        }

        async function generateAndSaveChatCode() {
            closeCodeModal();
            
            // Generate unique format: CL- followed by 6 random uppercase alphanumeric characters
            const randomCode = 'CL-' + Math.random().toString(36).substring(2, 8).toUpperCase();

            const { data, error } = await supabaseClient
                .from('profiles')
                .update({ chat_code: randomCode })
                .eq('username', currentUser.username)
                .select()
                .maybeSingle();

            if (error) {
                alert('Error generating chat code: ' + error.message);
                return;
            }

            currentUser = data || { ...currentUser, chat_code: randomCode };
            localStorage.setItem('chatlite_user', JSON.stringify(currentUser));
            updateChatCodeUI();
            alert('New Chat Code generated successfully: ' + randomCode);
        }

        function updatePreviews() {
            const name = document.getElementById('profile-name').value || 'U';

            const avatarContainer = document.getElementById('avatar-preview');
            if (newAvatarBase64) {
                avatarContainer.innerHTML = `<img src="${newAvatarBase64}" class="w-full h-full object-cover">`;
            } else {
                avatarContainer.textContent = name.charAt(0).toUpperCase();
            }

            const coverContainer = document.getElementById('cover-preview');
            if (newCoverBase64) {
                coverContainer.style.backgroundImage = `url('${newCoverBase64}')`;
                coverContainer.textContent = '';
            } else {
                coverContainer.style.backgroundImage = 'none';
                coverContainer.textContent = 'Tap to change cover photo';
            }
        }

        function handleFileSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = type === 'avatar' ? 300 : 800;
                    const MAX_HEIGHT = type === 'avatar' ? 300 : 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);

                    if (type === 'avatar') {
                        newAvatarBase64 = compressedDataUrl;
                    } else if (type === 'cover') {
                        newCoverBase64 = compressedDataUrl;
                    }
                    updatePreviews();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function handleSaveProfile(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            saveBtn.textContent = 'Saving changes...';
            saveBtn.disabled = true;

            const updatedData = {
                name: document.getElementById('profile-name').value.trim(),
                bio: document.getElementById('profile-bio').value.trim(),
                avatar_url: newAvatarBase64,
                cover_url: newCoverBase64
            };

            const { data, error } = await supabaseClient
                .from('profiles')
                .update(updatedData)
                .eq('username', currentUser.username)
                .select()
                .maybeSingle();

            if (error) {
                alert('Error updating profile: ' + error.message);
                saveBtn.textContent = 'Save Changes';
                saveBtn.disabled = false;
                return;
            }

            currentUser = data || { ...currentUser, ...updatedData };
            localStorage.setItem('chatlite_user', JSON.stringify(currentUser));

            alert('Profile updated successfully!');
            window.location.href = 'chatlist.html';
        }
    </script>
</body>
</html>
