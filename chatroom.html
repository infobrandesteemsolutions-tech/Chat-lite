<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Conversation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col font-sans overflow-hidden m-0">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative shadow-2xl bg-slate-900 border-x border-slate-800 h-full overflow-hidden">

        <!-- HEADER -->
        <div class="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-900 z-20 flex-shrink-0">
            <div class="flex items-center gap-2.5 overflow-hidden">

                <button
                    onclick="window.location.href='chatlist.html'"
                    class="text-slate-400 hover:text-white text-sm cursor-pointer px-1">
                    &larr;
                </button>

                <div
                    class="w-8 h-8 rounded-full bg-indigo-600/30 border border-indigo-500/30 flex items-center justify-center font-bold text-indigo-400 text-xs flex-shrink-0 overflow-hidden"
                    id="active-chat-avatar">
                    U
                </div>

                <div class="overflow-hidden">
                    <h3 class="font-bold text-xs truncate" id="active-chat-name">
                        Username
                    </h3>

                    <span
                        class="text-[9px] text-slate-400 truncate block"
                        id="active-chat-gender">
                        Gender
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-1 flex-shrink-0">

                <button
                    onclick="toggleSearchBox()"
                    class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer"
                    title="Search Keywords">
                    🔍
                </button>

                <button
                    onclick="openMediaGallery('file')"
                    class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer"
                    title="Files">
                    📁
                </button>

                <button
                    onclick="openMediaGallery('image')"
                    class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer"
                    title="Images">
                    🖼️
                </button>

                <button
                    onclick="openMediaGallery('video')"
                    class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer"
                    title="Videos">
                    🎬
                </button>

            </div>
        </div>

        <!-- SEARCH -->
        <div
            id="search-container"
            class="hidden p-2 bg-slate-950 border-b border-slate-800 flex items-center gap-2 z-20 flex-shrink-0">

            <input
                type="text"
                id="search-keyword-input"
                placeholder="Search keywords in chat..."
                oninput="filterMessages(this.value)"
                class="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-500">

            <button
                onclick="toggleSearchBox()"
                class="text-slate-400 hover:text-white text-xs px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                Close
            </button>

        </div>

        <!-- MESSAGES -->
        <div
            id="chat-messages"
            class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3 bg-slate-950 flex flex-col">
        </div>

        <!-- MULTI SELECT -->
        <div
            id="multi-select-bar"
            class="hidden absolute bottom-0 left-0 right-0 bg-slate-900 border-t border-indigo-500/50 p-3 shadow-2xl z-40 items-center justify-between">

            <span
                id="selected-count-text"
                class="text-xs font-semibold text-indigo-300">
                0 selected
            </span>

            <div class="flex items-center gap-1.5">

                <button
                    type="button"
                    onclick="handleMultiSelectAction('everyone')"
                    class="px-2.5 py-1.5 bg-red-600/70 hover:bg-red-600 text-white text-[11px] font-bold rounded-lg cursor-pointer">
                    Delete for everyone
                </button>

                <button
                    type="button"
                    onclick="handleMultiSelectAction('me')"
                    class="px-2.5 py-1.5 bg-red-900/70 hover:bg-red-900 text-white text-[11px] font-bold rounded-lg cursor-pointer">
                    Only me
                </button>

                <button
                    type="button"
                    onclick="handleMultiSelectAction('forward')"
                    class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold rounded-lg cursor-pointer">
                    Forward
                </button>

                <button
                    type="button"
                    onclick="exitMultiSelectMode()"
                    class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold rounded-lg cursor-pointer">
                    &times;
                </button>

            </div>
        </div>

        <!-- UNDO -->
        <div
            id="undo-banner"
            class="hidden absolute bottom-20 left-4 right-4 bg-slate-800 border border-indigo-500/50 rounded-xl p-3 shadow-2xl z-50 items-center justify-between">

            <span
                id="undo-text"
                class="text-xs text-slate-200">
                Message deleted.
            </span>

            <button
                type="button"
                onclick="triggerUndoAction()"
                class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg cursor-pointer">
                Undo (<span id="undo-countdown">10</span>s)
            </button>

        </div>

        <!-- MESSAGE OPTIONS -->
        <div
            id="message-options-modal"
            class="hidden absolute inset-0 bg-slate-950/70 z-50 items-center justify-center p-4 backdrop-blur-xs">

            <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-3 shadow-2xl flex flex-col gap-2">

                <div
                    class="text-xs font-bold text-slate-400 pb-2 border-b border-slate-800 flex justify-between items-center">

                    <span>Message Options</span>

                    <button
                        onclick="closeMessageOptions()"
                        class="text-slate-400 hover:text-white text-base cursor-pointer">
                        &times;
                    </button>

                </div>

                <div
                    id="message-options-actions"
                    class="flex flex-col gap-1.5">
                </div>

            </div>
        </div>

        <!-- REPLY -->
        <div
            id="reply-preview-bar"
            class="hidden p-2.5 bg-slate-900 border-t border-slate-800 items-center justify-between z-20 flex-shrink-0">

            <div class="flex flex-col border-l-2 border-indigo-500 pl-2 overflow-hidden">

                <span
                    class="text-[10px] font-bold text-indigo-400"
                    id="reply-target-sender">
                    Replying to...
                </span>

                <span
                    class="text-xs text-slate-300 truncate"
                    id="reply-target-content">
                    Message content...
                </span>

            </div>

            <button
                type="button"
                onclick="cancelReply()"
                class="text-slate-400 hover:text-white text-base px-2 cursor-pointer">
                &times;
            </button>

        </div>

        <!-- MEDIA PREVIEW -->
        <div
            id="media-preview-bar"
            class="hidden p-2.5 bg-slate-950 border-t border-slate-800 flex-col gap-1.5 z-20 flex-shrink-0">

            <div class="flex items-center justify-between">

                <span class="text-xs font-semibold text-indigo-400">
                    Staged Media Preview
                </span>

                <button
                    type="button"
                    onclick="clearStagedMedia()"
                    class="text-[11px] text-slate-400 hover:text-white px-2 py-0.5 bg-slate-800 rounded">
                    Discard
                </button>

            </div>

            <div
                id="preview-container"
                class="max-h-24 overflow-hidden rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center p-1.5 text-xs text-slate-300">
            </div>

            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                <div
                    id="upload-progress-bar"
                    class="bg-indigo-600 h-full w-0 transition-all duration-300">
                </div>
            </div>

            <span
                class="text-[10px] text-slate-400 text-center"
                id="upload-status-text">
                Ready. Hit Send button to upload & deliver.
            </span>

        </div>

        <!-- FILE INPUTS -->
        <input
            type="file"
            id="media-file-input"
            class="hidden"
            accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"
            onchange="stageFileSelected(event)">

        <input
            type="file"
            id="camera-photo-input"
            class="hidden"
            accept="image/*"
            capture="environment"
            onchange="stageFileSelected(event)">

        <input
            type="file"
            id="camera-video-input"
            class="hidden"
            accept="video/*"
            capture="environment"
            onchange="stageFileSelected(event)">

        <!-- ATTACHMENT MENU -->
        <div
            id="attachment-menu"
            class="hidden absolute bottom-16 left-3 bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-2 z-30 flex flex-col gap-1 w-48 backdrop-blur-md">

            <button
                type="button"
                onclick="document.getElementById('media-file-input').click(); toggleAttachmentMenu();"
                class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📁 File / Document
            </button>

            <button
                type="button"
                onclick="document.getElementById('camera-photo-input').click(); toggleAttachmentMenu();"
                class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📷 Take Photo
            </button>

            <button
                type="button"
                onclick="document.getElementById('camera-video-input').click(); toggleAttachmentMenu();"
                class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📹 Record Video Note
            </button>

        </div>

        <!-- MEDIA GALLERY -->
        <div
            id="media-gallery-modal"
            class="hidden absolute inset-0 bg-slate-950/90 z-40 flex-col p-4 backdrop-blur-sm">

            <div class="flex justify-between items-center pb-3 border-b border-slate-800">

                <h3
                    class="font-bold text-sm text-white"
                    id="gallery-title">
                    Chat Media
                </h3>

                <button
                    onclick="closeMediaGallery()"
                    class="text-xs text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                    Close
                </button>

            </div>

            <div
                id="gallery-content-grid"
                class="flex-1 overflow-y-auto grid grid-cols-2 gap-2 pt-3">
            </div>

        </div>

        <!-- INPUT -->
        <form
            id="chat-form"
            onsubmit="handleFormSubmit(event)"
            class="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2 relative z-25 flex-shrink-0">

            <button
                type="button"
                id="attach-btn"
                onclick="toggleAttachmentMenu()"
                class="p-2 text-slate-400 hover:text-indigo-400 transition-colors text-lg font-bold cursor-pointer flex-shrink-0"
                title="Attach Media">
                +
            </button>

            <input
                type="text"
                id="message-input"
                placeholder="Type a message..."
                class="flex-1 px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-white min-w-0">

            <!-- RECORDING UI -->
            <div
                id="recording-ui"
                class="hidden flex-1 items-center justify-between px-3 py-2 bg-slate-950 border border-red-500/50 rounded-xl min-w-0">

                <div class="flex items-center gap-2">

                    <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse flex-shrink-0"></span>

                    <span
                        id="recording-timer"
                        class="text-xs font-semibold text-red-400">
                        0:00
                    </span>

                </div>

                <div class="flex items-center gap-1">

                    <button
                        type="button"
                        id="pause-rec-btn"
                        onclick="togglePauseRecording()"
                        class="text-[11px] text-slate-300 hover:text-white px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                        ⏸ Pause
                    </button>

                    <button
                        type="button"
                        onclick="stopRecordingOnly()"
                        class="text-[11px] text-white px-2 py-1 bg-red-600 hover:bg-red-500 rounded-lg cursor-pointer font-bold">
                        ⏹ Stop
                    </button>

                    <button
                        type="button"
                        onclick="cancelRecording()"
                        class="text-[11px] text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                        Discard
                    </button>

                </div>
            </div>

            <button
                type="button"
                id="mic-btn"
                onclick="startVoiceRecording()"
                class="p-2 text-slate-400 hover:text-red-400 transition-colors cursor-pointer flex-shrink-0"
                title="Record Voice Note">
                🎤
            </button>

            <button
                type="submit"
                id="send-btn"
                class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl text-sm transition-all cursor-pointer text-white flex-shrink-0">
                Send
            </button>

        </form>

    </div>

    <script src="supabase.js"></script>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('chatlite_user'));

        const urlParams = new URLSearchParams(window.location.search);

        const targetUsername = (urlParams.get('to') || '').trim();
        const targetName = (urlParams.get('name') || '').trim();
        const targetGender = (urlParams.get('gender') || '').trim();

        if (!currentUser || !targetUsername) {
            window.location.href = 'chatlist.html';
        }

        document.getElementById('active-chat-name').textContent =
            targetName || targetUsername;

        document.getElementById('active-chat-gender').textContent =
            `@${targetUsername} • ${targetGender || 'Member'}`;

        document.getElementById('active-chat-avatar').textContent =
            (targetName || targetUsername).charAt(0).toUpperCase();

        const STORAGE_KEY =
            `chatlite_cache_${currentUser.username}_${targetUsername}`;

        const QUEUE_KEY =
            `chatlite_offline_queue_${currentUser.username}_${targetUsername}`;

        let messageSubscription = null;
        let messagesCache = loadLocalCache();

        let mediaRecorder = null;
        let audioChunks = [];
        let recordedBlob = null;
        let stagedPayload = null;

        let isRecording = false;
        let isPaused = false;

        let recordingTimerInterval = null;
        let recordingSeconds = 0;

        let replyingToMessage = null;

        let isMultiSelectMode = false;
        let selectedMessageIds = new Set();

        let pendingDeleteTimer = null;
        let undoTargetMessage = null;

        if (messagesCache.length > 0) {
            renderMessages(messagesCache);
        }

        function loadLocalCache() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                console.error('Cache read error:', e);
                return [];
            }
        }

        function saveLocalCache(messages) {
            messagesCache = messages;
            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(messages)
            );
        }

        function loadOfflineQueue() {
            try {
                const data = localStorage.getItem(QUEUE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function saveOfflineQueue(queue) {
            localStorage.setItem(
                QUEUE_KEY,
                JSON.stringify(queue)
            );
        }

        function toggleAttachmentMenu() {
            const menu = document.getElementById('attachment-menu');
            menu.classList.toggle('hidden');
        }

        function toggleSearchBox() {
            const searchBar =
                document.getElementById('search-container');

            searchBar.classList.toggle('hidden');

            if (!searchBar.classList.contains('hidden')) {
                document
                    .getElementById('search-keyword-input')
                    .focus();
            } else {
                filterMessages('');
            }
        }

        /*
         * FETCH MESSAGES
         */
        async function fetchMessages() {

            if (!navigator.onLine) {
                renderMessages(messagesCache);
                return;
            }

            await flushOfflineQueue();

            const { data: messages, error } =
                await supabaseClient
                    .from('messages')
                    .select('*')
                    .or(
                        `and(sender_username.eq.${currentUser.username},receiver_username.eq.${targetUsername}),and(sender_username.eq.${targetUsername},receiver_username.eq.${currentUser.username})`
                    )
                    .order('created_at', {
                        ascending: true
                    });

            if (error) {
                console.error(
                    'Error fetching messages:',
                    error
                );

                /*
                 * Do NOT wipe the local conversation when
                 * the server temporarily fails.
                 */
                renderMessages(messagesCache);
                return;
            }

            if (messages) {

                saveLocalCache(messages);

                renderMessages(messagesCache);

                await markIncomingMessagesAsRead(messages);
            }
        }

        /*
         * READ RECEIPTS
         */
        async function markIncomingMessagesAsRead(messages) {

            const hiddenKey =
                `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`;

            let hiddenForMe = [];

            try {
                hiddenForMe =
                    JSON.parse(
                        localStorage.getItem(hiddenKey) || '[]'
                    );
            } catch (e) {}

            const unreadIds = messages
                .filter(
                    m =>
                        m.receiver_username === currentUser.username &&
                        !m.is_read &&
                        !hiddenForMe.includes(m.id)
                )
                .map(m => m.id);

            if (unreadIds.length === 0) return;

            const { error } =
                await supabaseClient
                    .from('messages')
                    .update({
                        is_read: true
                    })
                    .in('id', unreadIds);

            if (error) {
                console.warn(
                    'Could not update read status:',
                    error
                );
            }
        }

        /*
         * RENDER
         */
        function renderMessages(messages) {

            const container =
                document.getElementById('chat-messages');

            container.innerHTML = '';

            const hiddenKey =
                `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`;

            let hiddenForMe = [];

            try {
                hiddenForMe =
                    JSON.parse(
                        localStorage.getItem(hiddenKey) || '[]'
                    );
            } catch (e) {}

            const filtered =
                messages.filter(
                    m =>
                        !hiddenForMe.includes(m.id) &&
                        !m.is_deleted_for_everyone
                );

            const offlineQueue =
                loadOfflineQueue();

            const combinedList = [
                ...filtered,
                ...offlineQueue
            ];

            combinedList.sort(
                (a, b) =>
                    new Date(
                        a.created_at || Date.now()
                    ) -
                    new Date(
                        b.created_at || Date.now()
                    )
            );

            combinedList.forEach(
                msg => appendMessageToDOM(msg, false)
            );

            container.scrollTop =
                container.scrollHeight;
        }

        /*
         * SEARCH
         */
        function filterMessages(keyword) {

            const term =
                keyword.toLowerCase().trim();

            if (!term) {
                renderMessages(messagesCache);
                return;
            }

            const filtered =
                messagesCache.filter(m => {

                    if (m.is_deleted_for_everyone) {
                        return false;
                    }

                    const type =
                        m.message_type || 'text';

                    if (
                        type === 'text' &&
                        typeof m.content === 'string' &&
                        m.content.toLowerCase().includes(term)
                    ) {
                        return true;
                    }

                    if (type === term) {
                        return true;
                    }

                    return false;
                });

            renderMessages(filtered);
        }

        /*
         * MESSAGE DOM
         */
        function appendMessageToDOM(
            msg,
            scrollToBottom = true
        ) {

            const container =
                document.getElementById('chat-messages');

            const isMe =
                msg.sender_username === currentUser.username;

            const wrapper =
                document.createElement('div');

            wrapper.className =
                `flex flex-col ${
                    isMe ? 'items-end' : 'items-start'
                } space-y-1 message-row relative transition-transform duration-200 select-none`;

            if (msg.id) {
                wrapper.setAttribute(
                    'data-id',
                    msg.id
                );
            }

            const isSelected =
                msg.id &&
                selectedMessageIds.has(msg.id);

            const rowFlex =
                document.createElement('div');

            rowFlex.className =
                `flex items-center gap-2 max-w-[85%] ${
                    isMe
                        ? 'flex-row-reverse'
                        : 'flex-row'
                }`;

            const checkboxEl =
                document.createElement('div');

            checkboxEl.className =
                `w-5 h-5 rounded-full border border-slate-600 items-center justify-center text-xs transition-all flex-shrink-0 ${
                    isMultiSelectMode
                        ? 'flex'
                        : 'hidden'
                } ${
                    isSelected
                        ? 'bg-indigo-600 border-indigo-500 text-white'
                        : 'bg-slate-900'
                }`;

            checkboxEl.innerHTML =
                isSelected ? '✓' : '';

            rowFlex.appendChild(checkboxEl);

            if (isSelected) {
                wrapper.classList.add(
                    'bg-indigo-950/30',
                    'p-2',
                    'rounded-xl'
                );
            }

            let pressTimer = null;

            const startPress = () => {

                if (msg.is_offline_pending) {
                    return;
                }

                pressTimer = setTimeout(() => {

                    if (isMultiSelectMode) {

                        if (msg.id) {
                            toggleMessageSelection(
                                msg.id
                            );
                        }

                    } else {

                        openMessageOptions(msg);

                    }

                }, 600);
            };

            const cancelPress = () => {

                if (pressTimer) {
                    clearTimeout(pressTimer);
                }
            };

            wrapper.addEventListener(
                'touchstart',
                startPress
            );

            wrapper.addEventListener(
                'touchend',
                cancelPress
            );

            wrapper.addEventListener(
                'touchmove',
                cancelPress
            );

            wrapper.addEventListener(
                'mousedown',
                startPress
            );

            wrapper.addEventListener(
                'mouseup',
                cancelPress
            );

            wrapper.addEventListener(
                'mouseleave',
                cancelPress
            );

            wrapper.addEventListener(
                'click',
                e => {

                    if (
                        isMultiSelectMode &&
                        msg.id
                    ) {

                        toggleMessageSelection(
                            msg.id
                        );

                        e.stopPropagation();
                    }
                }
            );

            wrapper.oncontextmenu = e => {

                e.preventDefault();

                if (
                    !msg.is_offline_pending &&
                    msg.id &&
                    !isMultiSelectMode
                ) {
                    openMessageOptions(msg);
                }
            };

            let touchStartX = 0;
            let touchCurrentX = 0;

            wrapper.addEventListener(
                'touchstart',
                e => {

                    if (isMultiSelectMode) {
                        return;
                    }

                    touchStartX =
                        e.touches[0].clientX;

                },
                {
                    passive: true
                }
            );

            wrapper.addEventListener(
                'touchmove',
                e => {

                    if (isMultiSelectMode) {
                        return;
                    }

                    touchCurrentX =
                        e.touches[0].clientX;

                    const diff =
                        touchCurrentX -
                        touchStartX;

                    if (
                        diff > 0 &&
                        diff < 100
                    ) {
                        wrapper.style.transform =
                            `translateX(${diff}px)`;
                    }

                },
                {
                    passive: true
                }
            );

            wrapper.addEventListener(
                'touchend',
                () => {

                    if (isMultiSelectMode) {
                        return;
                    }

                    const diff =
                        touchCurrentX -
                        touchStartX;

                    wrapper.style.transform =
                        'translateX(0px)';

                    if (diff > 60) {
                        setReplyTarget(msg);
                    }

                    touchStartX = 0;
                    touchCurrentX = 0;

                }
            );

            const bubble =
                document.createElement('div');

            bubble.className =
                `flex-1 px-3 py-2 rounded-2xl text-sm ${
                    isMe
                        ? 'bg-indigo-600 text-white rounded-br-none'
                        : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'
                }`;

            if (msg.reply_to) {

                const replySnippet =
                    document.createElement('div');

                const sender =
                    msg.reply_to.sender || '';

                const replyContent =
                    msg.reply_to.content || '';

                replySnippet.className =
                    `mb-1 p-1.5 rounded text-xs border-l-2 ${
                        isMe
                            ? 'bg-indigo-700/50 border-indigo-300 text-indigo-100'
                            : 'bg-slate-900/60 border-indigo-500 text-slate-300'
                    }`;

                const senderSpan =

                replySnippet.appendChild(contentSpan);

            const contentBody =
                document.createElement('div');

            const type =

            if (type === 'image') {

                const image =
                    document.createElement('img');

                image.src = msg.content;
                image.className =
                    'rounded-xl max-h-60 w-full object-cover cursor-pointer';

                image.onclick = () => {

                        window.open(msg.content);
                    }

            } else if (type === 'video') {

                video.controls = true;

                video.className =

                contentBody.appendChild(video);

            } else if (type === 'audio') {

                const audioId =
                    'audio_' +
                    Math.random()

                        .substring(2, 9);

                contentBody.innerHTML = `
                    <div class="flex items-center gap-2.5 py-1 px-1 min-w-[220px]" data-audio-container>
                        <button
                            type="button"
                            onclick="if(!isMultiSelectMode) toggleAudioPlay('${audioId}', this)"
                            class="w-8 h-8 rounded-full bg-white/25 hover:bg-white/40 flex items-center justify-center text-xs font-bold transition-all flex-shrink-0 cursor-pointer">
                            ▶
                        </button>

                        <audio
                            id="${audioId}"
                            src="${msg.content}"
                            preload="metadata">
                        </audio>

                        <div class="flex flex-col flex-1 gap-1">

                            <div class="flex justify-between items-center text-[10px] opacity-85">

                                <span class="audio-current-time">
                                    0:00
                                </span>

                                <button
                                    type="button"
                                    onclick="if(!isMultiSelectMode) toggleAudioSpeed('${audioId}', this)"
                                    class="bg-white/15 hover:bg-white/25 px-1.5 py-0.5 rounded font-mono text-[9px] cursor-pointer">
                                    1x
                                </button>

                            </div>

                            <input
                                type="range"
                                value="0"
                                max="100"
                                step="0.1"
                                oninput="seekAudio('${audioId}', this.value)"
                                class="audio-range w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white">

                        </div>
                    </div>
                `;

                setTimeout(() => {

                    const audioEl =
                        document.getElementById(audioId);

                    if (!audioEl) {
                        return;
                    }

                    const c =
                        audioEl.closest(
                            '[data-audio-container]'
                        );

                    if (!c) {
                        return;
                    }

                    const rangeEl =
                        c.querySelector(
                            '.audio-range'
                        );

                    const timeEl =
                        c.querySelector(
                            '.audio-current-time'
                        );

                    audioEl.addEventListener(
                        'loadedmetadata',
                        () => {
                            timeEl.textContent =
                                formatAudioTime(
                                    audioEl.duration
                                );

                    );

                    audioEl.addEventListener(
                        'timeupdate',
                        () => {

                            if (!audioEl.duration) {
                                return;
                            }

                            rangeEl.value =
                                (
                                    audioEl.currentTime /
                                    audioEl.duration
                                ) * 100;

                            timeEl.textContent =
                                formatAudioTime(

                                );
                        }
                    );

                    audioEl.addEventListener(
                        'ended',
                        () => {

                            c.querySelector(
                                'button'
                            ).textContent = '▶';

                            audioEl.currentTime = 0;

            } else if (type === 'file') {

                const link =
                    document.createElement('a');

                link.href = msg.content;
                link.download = 'file';

                link.className =

                link.textContent =

                contentBody.appendChild(link);

            bubble.appendChild(contentBody);
            rowFlex.appendChild(bubble);

            const metaRow =

                `flex items-center gap-1 px-1 text-[10px] text-slate-400 ${
                    isMe ? 'mr-7' : 'ml-7'

            metaRow.appendChild(timeSpan);

            if (isMe) {

                const tickSpan =
                    document.createElement('span');

                    tickSpan.textContent =

                    tickSpan.classList.add(
                        msg.is_read

                metaRow.appendChild(tickSpan);

        /*
         * MULTI SELECT
         */
        function enterMultiSelectMode(msg) {

            isMultiSelectMode = true;

            selectedMessageIds.clear();

            if (msg && msg.id) {
                selectedMessageIds.add(msg.id);
            }

            const bar =
                document.getElementById(
                    'multi-select-bar'
                );

            bar.classList.remove('hidden');
            bar.classList.add('flex');

            updateMultiSelectUI();

            renderMessages(messagesCache);
        }

        function exitMultiSelectMode() {

            isMultiSelectMode = false;

            selectedMessageIds.clear();

            const bar =
                document.getElementById(
                    'multi-select-bar'
                );

            bar.classList.remove('flex');
            bar.classList.add('hidden');

            renderMessages(messagesCache);
        }

        function toggleMessageSelection(msgId) {

            if (
                selectedMessageIds.has(msgId)
            ) {
                selectedMessageIds.delete(msgId);
            } else {
                selectedMessageIds.add(msgId);
            }

            if (
                selectedMessageIds.size === 0
            ) {
                exitMultiSelectMode();
                return;
            }

            updateMultiSelectUI();

            renderMessages(messagesCache);
        }

        function updateMultiSelectUI() {

            const countText =
                document.getElementById(
                    'selected-count-text'
                );

            countText.textContent =
                `${selectedMessageIds.size} selected`;
        }

        function handleMultiSelectAction(actionType) {

            if (
                selectedMessageIds.size === 0
            ) {
                return;
            }

            const selectedMsgs =
                messagesCache.filter(
                    m =>
                        selectedMessageIds.has(m.id)
                );

            if (actionType === 'forward') {

                const firstMsg =
                    selectedMsgs[0];

                if (firstMsg) {

                    localStorage.setItem(
                        'chatlite_forward_payload',
                        JSON.stringify({
                            content:
                                firstMsg.content,
                            type:
                                firstMsg.message_type ||
                                'text'
                        })
                    );

                    window.location.href =
                        'chatlist.html?forward=true';
                }

                exitMultiSelectMode();
                return;
            }

            if (actionType === 'me') {

                const key =
                    `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`;

                let hiddenForMe = [];

                try {
                    hiddenForMe =
                        JSON.parse(
                            localStorage.getItem(key) ||
                            '[]'
                        );
                } catch (e) {}

                selectedMessageIds.forEach(id => {

                    if (
                        !hiddenForMe.includes(id)
                    ) {
                        hiddenForMe.push(id);
                    }

                });

                localStorage.setItem(
                    key,
                    JSON.stringify(hiddenForMe)
                );

                exitMultiSelectMode();

                renderMessages(messagesCache);

                showUndoBanner(
                    10,
                    () => fetchMessages()
                );

            } else if (actionType === 'everyone') {

                const now =
                    Date.now();

                const validIds = [];

                selectedMsgs.forEach(msg => {

                    const isSender =
                        msg.sender_username ===
                        currentUser.username;

                    const messageTime =
                        new Date(
                            msg.created_at
                        ).getTime();

                    const diffHours =
                        (
                            now - messageTime
                        ) /
                        (1000 * 60 * 60);

                    if (
                        isSender &&
                        diffHours <= 3
                    ) {

                        msg.is_deleted_for_everyone =
                            true;

                        validIds.push(msg.id);
                    }

                });

                exitMultiSelectMode();

                renderMessages(messagesCache);

                showUndoBanner(
                    10,
                    async () => {

                        if (
                            validIds.length > 0
                        ) {

                            const {
                                error
                            } =
                                await supabaseClient
                                    .from('messages')
                                    .update({
                                        is_deleted_for_everyone:
                                            true,
                                        content:
                                            '[Message deleted]',
                                        message_type:
                                            'text'
                                    })
                                    .in(
                                        'id',
                                        validIds
                                    );

                            if (error) {
                                console.error(
                                    'Delete-for-everyone error:',
                                    error
                                );
                            }
                        }

                        await fetchMessages();
                    }
                );
            }
        }

        /*
         * OFFLINE QUEUE
         */
        async function flushOfflineQueue() {

            if (!navigator.onLine) {
                return;
            }

            const queue =
                loadOfflineQueue();

            if (queue.length === 0) {
                return;
            }

            const remainingQueue = [];

            for (const item of queue) {

                const result =
                    await insertMessageSafely(
                        item
                    );

                if (!result.success) {

                    remainingQueue.push(item);

                } else if (
                    result.message
                ) {

                    messagesCache.push(
                        result.message
                    );
                }
            }

            saveOfflineQueue(
                remainingQueue
            );

            saveLocalCache(
                messagesCache
            );
        }

        window.addEventListener(
            'online',
            async () => {
                await fetchMessages();
            }
        );
