<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Conversation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col font-sans overflow-hidden m-0">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative shadow-2xl bg-slate-900 border-x border-slate-800 h-full overflow-hidden">

        <!-- Header -->
        <div class="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-900 z-20 flex-shrink-0">
            <div class="flex items-center gap-2.5 overflow-hidden">
                <button onclick="window.location.href='chatlist.html'" class="text-slate-400 hover:text-white text-sm cursor-pointer px-1">
                    &larr;
                </button>

                <div id="active-chat-avatar"
                     class="w-8 h-8 rounded-full bg-indigo-600/30 border border-indigo-500/30 flex items-center justify-center font-bold text-indigo-400 text-xs flex-shrink-0 overflow-hidden">
                    U
                </div>

                <div class="overflow-hidden">
                    <h3 id="active-chat-name" class="font-bold text-xs truncate">Username</h3>
                    <span id="active-chat-gender" class="text-[9px] text-slate-400 truncate block">Gender</span>
                </div>
            </div>

            <div class="flex items-center gap-1 flex-shrink-0">
                <button onclick="toggleSearchBox()" class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer" title="Search Keywords">🔍</button>
                <button onclick="openMediaGallery('file')" class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer" title="Files">📁</button>
                <button onclick="openMediaGallery('image')" class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer" title="Images">🖼️</button>
                <button onclick="openMediaGallery('video')" class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer" title="Videos">🎬</button>
            </div>
        </div>

        <!-- Search -->
        <div id="search-container" class="hidden p-2 bg-slate-950 border-b border-slate-800 flex items-center gap-2 z-20 flex-shrink-0">
            <input
                type="text"
                id="search-keyword-input"
                placeholder="Search keywords in chat..."
                oninput="filterMessages(this.value)"
                class="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-500"
            >
            <button onclick="toggleSearchBox()" class="text-slate-400 hover:text-white text-xs px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                Close
            </button>
        </div>

        <!-- Messages -->
        <div id="chat-messages" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3 bg-slate-950 flex flex-col">
            <div class="text-center text-xs text-slate-500 py-4">Loading messages...</div>
        </div>

        <!-- Multi Select -->
        <div id="multi-select-bar"
             class="hidden absolute bottom-0 left-0 right-0 bg-slate-900 border-t border-indigo-500/50 p-3 shadow-2xl z-40 items-center justify-between">
            <span id="selected-count-text" class="text-xs font-semibold text-indigo-300">0 selected</span>

            <div class="flex items-center gap-1.5">
                <button type="button"
                        onclick="handleMultiSelectAction('everyone')"
                        class="px-2.5 py-1.5 bg-red-600/70 hover:bg-red-600 text-white text-[11px] font-bold rounded-lg cursor-pointer">
                    Delete for everyone
                </button>

                <button type="button"
                        onclick="handleMultiSelectAction('me')"
                        class="px-2.5 py-1.5 bg-red-900/70 hover:bg-red-900 text-white text-[11px] font-bold rounded-lg cursor-pointer">
                    Only me
                </button>

                <button type="button"
                        onclick="handleMultiSelectAction('forward')"
                        class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold rounded-lg cursor-pointer">
                    Forward
                </button>

                <button type="button"
                        onclick="exitMultiSelectMode()"
                        class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold rounded-lg cursor-pointer">
                    &times;
                </button>
            </div>
        </div>

        <!-- Undo -->
        <div id="undo-banner"
             class="hidden absolute bottom-20 left-4 right-4 bg-slate-800 border border-indigo-500/50 rounded-xl p-3 shadow-2xl z-50 items-center justify-between">
            <span id="undo-text" class="text-xs text-slate-200">Message deleted.</span>

            <button type="button"
                    onclick="triggerUndoAction()"
                    class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg cursor-pointer">
                Undo (<span id="undo-countdown">10</span>s)
            </button>
        </div>

        <!-- Message Options -->
        <div id="message-options-modal"
             class="hidden absolute inset-0 bg-slate-950/70 z-50 items-center justify-center p-4 backdrop-blur-xs">

            <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-3 shadow-2xl flex flex-col gap-2">

                <div class="text-xs font-bold text-slate-400 pb-2 border-b border-slate-800 flex justify-between items-center">
                    <span>Message Options</span>

                    <button onclick="closeMessageOptions()"
                            class="text-slate-400 hover:text-white text-base cursor-pointer">
                        &times;
                    </button>
                </div>

                <div id="message-options-actions" class="flex flex-col gap-1.5"></div>
            </div>
        </div>

        <!-- Reply Preview -->
        <div id="reply-preview-bar"
             class="hidden p-2.5 bg-slate-900 border-t border-slate-800 items-center justify-between z-20 flex-shrink-0">

            <div class="flex flex-col border-l-2 border-indigo-500 pl-2 overflow-hidden">
                <span id="reply-target-sender" class="text-[10px] font-bold text-indigo-400">
                    Replying to...
                </span>

                <span id="reply-target-content" class="text-xs text-slate-300 truncate">
                    Message content...
                </span>
            </div>

            <button type="button"
                    onclick="cancelReply()"
                    class="text-slate-400 hover:text-white text-base px-2 cursor-pointer">
                &times;
            </button>
        </div>

        <!-- Media Preview -->
        <div id="media-preview-bar"
             class="hidden p-2.5 bg-slate-950 border-t border-slate-800 flex-col gap-1.5 z-20 flex-shrink-0">

            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-indigo-400">
                    Staged Media Preview
                </span>

                <button type="button"
                        onclick="clearStagedMedia()"
                        class="text-[11px] text-slate-400 hover:text-white px-2 py-0.5 bg-slate-800 rounded">
                    Discard
                </button>
            </div>

            <div id="preview-container"
                 class="max-h-24 overflow-hidden rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center p-1.5 text-xs text-slate-300">
            </div>

            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                <div id="upload-progress-bar"
                     class="bg-indigo-600 h-full w-0 transition-all duration-300">
                </div>
            </div>

            <span id="upload-status-text"
                  class="text-[10px] text-slate-400 text-center">
                Ready. Hit Send button to upload & deliver.
            </span>
        </div>

        <!-- File Inputs -->
        <input
            type="file"
            id="media-file-input"
            class="hidden"
            accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"
            onchange="stageFileSelected(event)"
        >

        <input
            type="file"
            id="camera-photo-input"
            class="hidden"
            accept="image/*"
            capture="environment"
            onchange="stageFileSelected(event)"
        >

        <input
            type="file"
            id="camera-video-input"
            class="hidden"
            accept="video/*"
            capture="environment"
            onchange="stageFileSelected(event)"
        >

        <!-- Attachment Menu -->
        <div id="attachment-menu"
             class="hidden absolute bottom-16 left-3 bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-2 z-30 flex flex-col gap-1 w-48 backdrop-blur-md">

            <button type="button"
                    onclick="document.getElementById('media-file-input').click(); toggleAttachmentMenu();"
                    class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📁 File / Document
            </button>

            <button type="button"
                    onclick="document.getElementById('camera-photo-input').click(); toggleAttachmentMenu();"
                    class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📷 Take Photo
            </button>

            <button type="button"
                    onclick="document.getElementById('camera-video-input').click(); toggleAttachmentMenu();"
                    class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📹 Record Video Note
            </button>
        </div>

        <!-- Gallery -->
        <div id="media-gallery-modal"
             class="hidden absolute inset-0 bg-slate-950/90 z-40 flex-col p-4 backdrop-blur-sm">

            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <h3 id="gallery-title" class="font-bold text-sm text-white">
                    Chat Media
                </h3>

                <button onclick="closeMediaGallery()"
                        class="text-xs text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                    Close
                </button>
            </div>

            <div id="gallery-content-grid"
                 class="flex-1 overflow-y-auto grid grid-cols-2 gap-2 pt-3">
            </div>
        </div>

        <!-- Bottom Input -->
        <form id="chat-form"
              onsubmit="handleFormSubmit(event)"
              class="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2 relative z-25 flex-shrink-0">

            <button type="button"
                    id="attach-btn"
                    onclick="toggleAttachmentMenu()"
                    class="p-2 text-slate-400 hover:text-indigo-400 transition-colors text-lg font-bold cursor-pointer flex-shrink-0"
                    title="Attach Media">
                +
            </button>

            <input
                type="text"
                id="message-input"
                placeholder="Type a message..."
                class="flex-1 px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-white min-w-0"
            >

            <!-- Recording UI -->
            <div id="recording-ui"
                 class="hidden flex-1 items-center justify-between px-3 py-2 bg-slate-950 border border-red-500/50 rounded-xl min-w-0">

                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse flex-shrink-0"></span>
                    <span id="recording-timer" class="text-xs font-semibold text-red-400">
                        0:00
                    </span>
                </div>

                <div class="flex items-center gap-1">
                    <button type="button"
                            id="pause-rec-btn"
                            onclick="togglePauseRecording()"
                            class="text-[11px] text-slate-300 hover:text-white px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                        ⏸ Pause
                    </button>

                    <button type="button"
                            onclick="stopRecordingOnly()"
                            class="text-[11px] text-white px-2 py-1 bg-red-600 hover:bg-red-500 rounded-lg cursor-pointer font-bold">
                        ⏹ Stop
                    </button>

                    <button type="button"
                            onclick="cancelRecording()"
                            class="text-[11px] text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                        Discard
                    </button>
                </div>
            </div>

            <button type="button"
                    id="mic-btn"
                    onclick="startVoiceRecording()"
                    class="p-2 text-slate-400 hover:text-red-400 transition-colors cursor-pointer flex-shrink-0"
                    title="Record Voice Note">
                🎤
            </button>

            <button type="submit"
                    id="send-btn"
                    class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl text-sm transition-all cursor-pointer text-white flex-shrink-0">
                Send
            </button>
        </form>
    </div>

    <script src="supabase.js"></script>

    <script>

        /* =========================================================
           PRIVATE CHAT INITIALIZATION
        ========================================================= */

        const currentUser = JSON.parse(localStorage.getItem('chatlite_user'));

        const urlParams = new URLSearchParams(window.location.search);

        const targetUsername = urlParams.get('to');
        const targetName = urlParams.get('name');
        const targetGender = urlParams.get('gender');

        if (!currentUser || !targetUsername) {
            window.location.href = 'chatlist.html';
        }

        document.getElementById('active-chat-name').textContent =
            targetName || targetUsername;

        document.getElementById('active-chat-gender').textContent =
            `@${targetUsername} • ${targetGender || 'Member'}`;

        document.getElementById('active-chat-avatar').textContent =
            (targetName || targetUsername).charAt(0).toUpperCase();


        /* =========================================================
           LOCAL STORAGE
        ========================================================= */

        const STORAGE_KEY =
            `chatlite_cache_${currentUser.username}_${targetUsername}`;

        const QUEUE_KEY =
            `chatlite_offline_queue_${currentUser.username}_${targetUsername}`;


        /* =========================================================
           STATE
        ========================================================= */

        let messagesCache = loadLocalCache();

        let messageSubscription = null;

        let mediaRecorder = null;
        let audioChunks = [];
        let recordedBlob = null;

        let stagedPayload = null;

        let isRecording = false;
        let isPaused = false;

        let recordingTimerInterval = null;
        let recordingSeconds = 0;

        let replyingToMessage = null;

        let isMultiSelectMode = false;
        let selectedMessageIds = new Set();

        let pendingDeleteTimer = null;
        let undoTargetMessage = null;


        /* =========================================================
           INITIAL LOAD
        ========================================================= */

        if (messagesCache.length > 0) {
            renderMessages(messagesCache);
        }

        initChat();


        async function initChat() {

            await flushOfflineQueue();

            await fetchMessages();

            subscribeToMessages();
        }


        /* =========================================================
           CACHE
        ========================================================= */

        function loadLocalCache() {

            try {

                const data =
                    localStorage.getItem(STORAGE_KEY);

                return data ? JSON.parse(data) : [];

            } catch (e) {

                return [];

            }
        }


        function saveLocalCache(messages) {

            messagesCache = messages;

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(messages)
            );
        }


        /* =========================================================
           OFFLINE QUEUE
        ========================================================= */

        function loadOfflineQueue() {

            try {

                const data =
                    localStorage.getItem(QUEUE_KEY);

                return data ? JSON.parse(data) : [];

            } catch (e) {

                return [];

            }
        }


        function saveOfflineQueue(queue) {

            localStorage.setItem(
                QUEUE_KEY,
                JSON.stringify(queue)
            );
        }


        function queueOfflineMessage(msg) {

            const queue = loadOfflineQueue();

            /*
             * Prevent accidental duplicate queue entries.
             */
            const alreadyQueued = queue.some(q =>
                q.local_id && msg.local_id &&
                q.local_id === msg.local_id
            );

            if (!alreadyQueued) {
                queue.push(msg);
            }

            saveOfflineQueue(queue);
        }


        /* =========================================================
           ATTACHMENT MENU
        ========================================================= */

        function toggleAttachmentMenu() {

            const menu =
                document.getElementById('attachment-menu');

            menu.classList.toggle('hidden');
        }


        window.addEventListener('click', (e) => {

            if (
                !e.target.closest('#attachment-menu') &&
                !e.target.closest('#attach-btn')
            ) {

                document
                    .getElementById('attachment-menu')
                    .classList.add('hidden');
            }

        });


        /* =========================================================
           SEARCH
        ========================================================= */

        function toggleSearchBox() {

            const searchBar =
                document.getElementById('search-container');

            searchBar.classList.toggle('hidden');

            if (!searchBar.classList.contains('hidden')) {

                document
                    .getElementById('search-keyword-input')
                    .focus();

            } else {

                filterMessages('');

            }
        }


        function filterMessages(keyword) {

            const term =
                keyword.toLowerCase();

            if (!term) {

                renderMessages(messagesCache);

                return;
            }

            const filtered =
                messagesCache.filter(m => {

                    if (m.is_deleted_for_everyone) {
                        return false;
                    }

                    const type =
                        m.message_type || 'text';

                    const content =
                        m.content || '';

                    if (
                        type === 'text' &&
                        content.toLowerCase().includes(term)
                    ) {
                        return true;
                    }

                    if (type === term) {
                        return true;
                    }

                    return false;
                });

            renderMessages(filtered);
        }


        /* =========================================================
           FETCH PRIVATE MESSAGES
           
           IMPORTANT:
           Uses two simple queries instead of .or(...)
           This avoids PostgREST filter parsing problems.
        ========================================================= */

        async function fetchMessages() {

            if (!navigator.onLine) {
                return;
            }

            /*
             * First attempt to send anything waiting locally.
             */
            await flushOfflineQueue();

            const sentPromise =
                supabaseClient
                    .from('messages')
                    .select('*')
                    .eq(
                        'sender_username',
                        currentUser.username
                    )
                    .eq(
                        'receiver_username',
                        targetUsername
                    );

            const receivedPromise =
                supabaseClient
                    .from('messages')
                    .select('*')
                    .eq(
                        'sender_username',
                        targetUsername
                    )
                    .eq(
                        'receiver_username',
                        currentUser.username
                    );

            const [
                sentResult,
                receivedResult
            ] = await Promise.all([
                sentPromise,
                receivedPromise
            ]);

            if (sentResult.error) {

                console.error(
                    'Error loading sent messages:',
                    sentResult.error
                );

                return;
            }

            if (receivedResult.error) {

                console.error(
                    'Error loading received messages:',
                    receivedResult.error
                );

                return;
            }

            const sentMessages =
                sentResult.data || [];

            const receivedMessages =
                receivedResult.data || [];

            const messages = [
                ...sentMessages,
                ...receivedMessages
            ];

            /*
             * Sort locally instead of asking PostgREST
             * to order the result.
             */
            messages.sort((a, b) => {

                const aTime =
                    new Date(a.created_at || 0).getTime();

                const bTime =
                    new Date(b.created_at || 0).getTime();

                return aTime - bTime;
            });

            saveLocalCache(messages);

            renderMessages(messages);

            await markIncomingMessagesAsRead(messages);
        }


        /* =========================================================
           MARK READ
        ========================================================= */

        async function markIncomingMessagesAsRead(messages) {

            let hiddenForMe = [];

            try {

                hiddenForMe =
                    JSON.parse(
                        localStorage.getItem(
                            `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`
                        ) || '[]'
                    );

            } catch (e) {}

            const unreadIds =
                messages
                    .filter(m =>
                        m.receiver_username === currentUser.username &&
                        !m.is_read &&
                        m.id &&
                        !hiddenForMe.includes(m.id)
                    )
                    .map(m => m.id);

            if (unreadIds.length === 0) {
                return;
            }

            const { error } =
                await supabaseClient
                    .from('messages')
                    .update({
                        is_read: true
                    })
                    .in('id', unreadIds);

            if (error) {

                /*
                 * Read status is secondary.
                 * Do not break the conversation if this update fails.
                 */
                console.warn(
                    'Could not update read status:',
                    error
                );
            }
        }


        /* =========================================================
           RENDER MESSAGES
        ========================================================= */

        function renderMessages(messages) {

            const container =
                document.getElementById('chat-messages');

            container.innerHTML = '';

            let hiddenForMe = [];

            try {

                hiddenForMe =
                    JSON.parse(
                        localStorage.getItem(
                            `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`
                        ) || '[]'
                    );

            } catch (e) {}

            const filtered =
                messages.filter(m =>
                    !hiddenForMe.includes(m.id) &&
                    !m.is_deleted_for_everyone
                );

            const queue =
                loadOfflineQueue();

            if (
                filtered.length === 0 &&
                queue.length === 0
            ) {

                container.innerHTML = `
                    <div class="text-center text-xs text-slate-500 py-8">
                        No messages yet. Start the conversation!
                    </div>
                `;

                return;
            }

            filtered.forEach(msg => {

                appendMessageToDOM(
                    msg,
                    false
                );

            });

            /*
             * Same architecture as groupchat:
             * queued messages are displayed after
             * successfully stored messages.
             */
            queue.forEach(msg => {

                appendMessageToDOM(
                    msg,
                    false
                );

            });

            container.scrollTop =
                container.scrollHeight;
        }


        /* =========================================================
           MESSAGE DOM
        ========================================================= */

        function appendMessageToDOM(
            msg,
            scrollToBottom = true
        ) {

            const container =
                document.getElementById('chat-messages');

            const isMe =
                msg.sender_username === currentUser.username;

            const wrapper =
                document.createElement('div');

            wrapper.className =
                `flex flex-col ${
                    isMe ? 'items-end' : 'items-start'
                } space-y-1 message-row relative transition-transform duration-200 select-none`;

            if (msg.id) {

                wrapper.setAttribute(
                    'data-id',
                    msg.id
                );
            }

            if (msg.local_id) {

                wrapper.setAttribute(
                    'data-local-id',
                    msg.local_id
                );
            }

            const isSelected =
                msg.id &&
                selectedMessageIds.has(msg.id);

            const rowFlex =
                document.createElement('div');

            rowFlex.className =
                `flex items-center gap-2 max-w-[85%] ${
                    isMe ? 'flex-row-reverse' : 'flex-row'
                }`;

            const checkboxEl =
                document.createElement('div');

            checkboxEl.className =
                `w-5 h-5 rounded-full border border-slate-600 items-center justify-center text-xs transition-all flex-shrink-0 ${
                    isMultiSelectMode ? 'flex' : 'hidden'
                } ${
                    isSelected
                        ? 'bg-indigo-600 border-indigo-500 text-white'
                        : 'bg-slate-900'
                }`;

            checkboxEl.innerHTML =
                isSelected ? '✓' : '';

            rowFlex.appendChild(
                checkboxEl
            );

            if (isSelected) {

                wrapper.classList.add(
                    'bg-indigo-950/30',
                    'p-2',
                    'rounded-xl'
                );
            }


            /* Long press */

            let pressTimer = null;

            const startPress = () => {

                if (msg.is_pending) {
                    return;
                }

                pressTimer =
                    setTimeout(() => {

                        if (isMultiSelectMode) {

                            if (msg.id) {
                                toggleMessageSelection(
                                    msg.id
                                );
                            }

                        } else {

                            openMessageOptions(msg);

                        }

                    }, 600);
            };


            const cancelPress = () => {

                if (pressTimer) {
                    clearTimeout(pressTimer);
                }
            };


            wrapper.addEventListener(
                'touchstart',
                startPress
            );

            wrapper.addEventListener(
                'touchend',
                cancelPress
            );

            wrapper.addEventListener(
                'touchmove',
                cancelPress
            );

            wrapper.addEventListener(
                'mousedown',
                startPress
            );

            wrapper.addEventListener(
                'mouseup',
                cancelPress
            );

            wrapper.addEventListener(
                'mouseleave',
                cancelPress
            );


            wrapper.addEventListener(
                'click',
                (e) => {

                    if (
                        isMultiSelectMode &&
                        msg.id
                    ) {

                        toggleMessageSelection(
                            msg.id
                        );

                        e.stopPropagation();
                    }

                }
            );


            wrapper.oncontextmenu =
                (e) => {

                    e.preventDefault();

                    if (
                        !msg.is_pending &&
                        msg.id &&
                        !isMultiSelectMode
                    ) {

                        openMessageOptions(msg);
                    }
                };


            /* Swipe to reply */

            let touchStartX = 0;
            let touchCurrentX = 0;

            wrapper.addEventListener(
                'touchstart',
                (e) => {

                    if (isMultiSelectMode) {
                        return;
                    }

                    touchStartX =
                        e.touches[0].clientX;

                },
                { passive: true }
            );


            wrapper.addEventListener(
                'touchmove',
                (e) => {

                    if (isMultiSelectMode) {
                        return;
                    }

                    touchCurrentX =
                        e.touches[0].clientX;

                    const diff =
                        touchCurrentX -
                        touchStartX;

                    if (
                        diff > 0 &&
                        diff < 100
                    ) {

                        wrapper.style.transform =
                            `translateX(${diff}px)`;
                    }

                },
                { passive: true }
            );


            wrapper.addEventListener(
                'touchend',
                () => {

                    if (isMultiSelectMode) {
                        return;
                    }

                    const diff =
                        touchCurrentX -
                        touchStartX;

                    wrapper.style.transform =
                        'translateX(0px)';

                    if (diff > 60) {
                        setReplyTarget(msg);
                    }

                    touchStartX = 0;
                    touchCurrentX = 0;

                }
            );


            /* Bubble */

            const bubble =
                document.createElement('div');

            bubble.className =
                `flex-1 px-3 py-2 rounded-2xl text-sm ${
                    isMe
                        ? 'bg-indigo-600 text-white rounded-br-none'
                        : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'
                }`;


            /* Reply quote */

            if (msg.reply_to) {

                const replySnippet =
                    document.createElement('div');

                replySnippet.className =
                    `mb-1 p-1.5 rounded text-xs border-l-2 ${
                        isMe
                            ? 'bg-indigo-700/50 border-indigo-300 text-indigo-100'
                            : 'bg-slate-900/60 border-indigo-500 text-slate-300'
                    }`;

                const sender =
                    escapeHtml(
                        msg.reply_to.sender || ''
                    );

                const content =
                    escapeHtml(
                        msg.reply_to.content || ''
                    );

                replySnippet.innerHTML = `
                    <span class="font-bold block text-[10px] opacity-90">
                        ${sender}
                    </span>
                    <span class="truncate block">
                        ${content}
                    </span>
                `;

                bubble.appendChild(
                    replySnippet
                );
            }


            const contentBody =
                document.createElement('div');

            const type =
                msg.message_type || 'text';

            const content =
                msg.content || '';


            if (type === 'image') {

                const img =
                    document.createElement('img');

                img.src = content;

                img.className =
                    'rounded-xl max-h-60 w-full object-cover cursor-pointer';

                img.onclick = () => {

                    if (!isMultiSelectMode) {
                        window.open(
                            content,
                            '_blank'
                        );
                    }
                };

                contentBody.appendChild(img);


            } else if (type === 'video') {

                const video =
                    document.createElement('video');

                video.src = content;

                video.controls = true;

                video.className =
                    'rounded-xl max-h-60 w-full';

                contentBody.appendChild(video);


            } else if (type === 'audio') {

                const audioId =
                    'audio_' +
                    Math.random()
                        .toString(36)
                        .substring(2, 9);

                contentBody.innerHTML = `
                    <div
                        class="flex items-center gap-2.5 py-1 px-1 min-w-[220px]"
                        data-audio-container
                    >
                        <button
                            type="button"
                            onclick="if(!isMultiSelectMode) toggleAudioPlay('${audioId}', this)"
                            class="w-8 h-8 rounded-full bg-white/25 hover:bg-white/40 flex items-center justify-center text-xs font-bold transition-all flex-shrink-0 cursor-pointer"
                        >
                            ▶
                        </button>

                        <audio
                            id="${audioId}"
                            src="${escapeAttribute(content)}"
                            preload="metadata"
                        ></audio>

                        <div class="flex flex-col flex-1 gap-1">

                            <div class="flex justify-between items-center text-[10px] opacity-85">

                                <span class="audio-current-time">
                                    0:00
                                </span>

                                <button
                                    type="button"
                                    onclick="if(!isMultiSelectMode) toggleAudioSpeed('${audioId}', this)"
                                    class="bg-white/15 hover:bg-white/25 px-1.5 py-0.5 rounded font-mono text-[9px] cursor-pointer"
                                >
                                    1x
                                </button>

                            </div>

                            <input
                                type="range"
                                value="0"
                                max="100"
                                step="0.1"
                                oninput="seekAudio('${audioId}', this.value)"
                                class="audio-range w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white"
                            >

                        </div>
                    </div>
                `;

                setTimeout(() => {

                    const audioEl =
                        document.getElementById(audioId);

                    if (!audioEl) {
                        return;
                    }

                    const c =
                        audioEl.closest(
                            '[data-audio-container]'
                        );

                    if (!c) {
                        return;
                    }

                    const rangeEl =
                        c.querySelector(
                            '.audio-range'
                        );

                    const timeEl =
                        c.querySelector(
                            '.audio-current-time'
                        );

                    audioEl.addEventListener(
                        'loadedmetadata',
                        () => {

                            timeEl.textContent =
                                formatAudioTime(
                                    audioEl.duration
                                );

                        }
                    );

                    audioEl.addEventListener(
                        'timeupdate',
                        () => {

                            if (!audioEl.duration) {
                                return;
                            }

                            rangeEl.value =
                                (
                                    audioEl.currentTime /
                                    audioEl.duration
                                ) * 100;

                            timeEl.textContent =
                                formatAudioTime(
                                    audioEl.currentTime
                                );
                        }
                    );

                    audioEl.addEventListener(
                        'ended',
                        () => {

                            c.querySelector(
                                'button'
                            ).textContent = '▶';

                            audioEl.currentTime = 0;
                        }
                    );

                }, 50);


            } else if (type === 'file') {

                const link =
                    document.createElement('a');

                link.href = content;

                link.download = 'file';

                link.className =
                    'flex items-center gap-2 underline text-xs font-semibold py-1';

                link.textContent =
                    '📁 File Attachment';

                contentBody.appendChild(link);


            } else {

                contentBody.textContent =
                    content;
            }

            bubble.appendChild(
                contentBody
            );

            rowFlex.appendChild(
                bubble
            );


            /* Meta */

            const metaRow =
                document.createElement('div');

            metaRow.className =
                `flex items-center gap-1 px-1 text-[10px] text-slate-400 ${
                    isMe ? 'mr-7' : 'ml-7'
                }`;


            const timeSpan =
                document.createElement('span');

            timeSpan.textContent =
                new Date(
                    msg.created_at || Date.now()
                ).toLocaleTimeString(
                    [],
                    {
                        hour: '2-digit',
                        minute: '2-digit'
                    }
                );

            metaRow.appendChild(
                timeSpan
            );


            if (isMe) {

                const tickSpan =
                    document.createElement('span');

                tickSpan.className =
                    'font-bold text-xs';


                if (msg.is_pending) {

                    tickSpan.textContent =
                        '🕒';

                    tickSpan.title =
                        'Waiting for network...';

                    tickSpan.classList.add(
                        'text-slate-500'
                    );

                } else {

                    tickSpan.textContent =
                        msg.is_read
                            ? '✓✓'
                            : '✓';

                    tickSpan.classList.add(
                        msg.is_read
                            ? 'text-indigo-300'
                            : 'text-slate-500'
                    );
                }

                metaRow.appendChild(
                    tickSpan
                );
            }


            wrapper.appendChild(
                rowFlex
            );

            wrapper.appendChild(
                metaRow
            );

            container.appendChild(
                wrapper

            if (scrollToBottom) {

                container.scrollTop =
                    container.scrollHeight;

                document.getElementById(

            replyBar.classList.add(

            );
        }


        /* =========================================================
           PRIVATE MESSAGE SENDING
           
           THIS NOW FOLLOWS THE GROUP CHAT ARCHITECTURE.
        ========================================================= */

        async function sendPayloadToSupabase(
            content,
            type,
            replyMeta = null
        ) {

            /*
             * Create a unique local ID.
             * This lets us distinguish the optimistic
             * local message from the real Supabase row.
             */
            const localId =
                'local_' +
                Date.now() +
                '_' +
                Math.random()
                    .toString(36)
                    .substring(2, 8);


            /*
             * Same basic private messages schema
             * that chatroom was already using.
             */
            const localMessage = {

                local_id: localId,

                sender_username:
                    currentUser.username,

                receiver_username:
                    targetUsername,

                content:
                    content,

                message_type:
                    type || 'text',

                reply_to:
                    replyMeta || null,

                is_read:
                    false,

                created_at:
                    new Date().toISOString(),

                is_pending:
                    true
            };


            /*
             * EXACTLY LIKE GROUPCHAT:
             * Show the message immediately.
             */
            messagesCache.push(
                localMessage
            );

            saveLocalCache(
                messagesCache
            );

            renderMessages(
                messagesCache
            );

            cancelReply();


            /*
             * OFFLINE:
             * Keep the message queued.
             */
            if (!navigator.onLine) {

                queueOfflineMessage(
                    localMessage
                );

                return;
            }


            /*
             * Send the database payload.
             *
             * IMPORTANT:
             * There is deliberately NO .select()
             * here, matching the working groupchat
             * architecture.
             */
            const payload = {

                sender_username:
                    currentUser.username,

                receiver_username:
                    targetUsername,

                content:
                    content,

                message_type:
                    type || 'text',

                reply_to:
                    replyMeta || null,

                is_read:
                    false,

                created_at:
                    localMessage.created_at
            };


            const { error } =
                await supabaseClient
                    .from('messages')
                    .insert([payload]);


            if (error) {

                console.error(
                    'Private message insert failed:',
                    error
                );

                /*
                 * Keep the optimistic message
                 * and queue it for retry.
                 */
                queueOfflineMessage(
                    localMessage
                );

                return;
            }


            /*
             * SUCCESS:
             * Remove ONLY this local pending copy.
             */
            messagesCache =
                messagesCache.filter(
                    m =>
                        m.local_id !==
                        localId
                );

            saveLocalCache(
                messagesCache
            );


            /*
             * Remove it from the offline queue too.
             */
            const queue =
                loadOfflineQueue();

            const cleanedQueue =
                queue.filter(
                    m =>
                        m.local_id !==
                        localId
                );

            saveOfflineQueue(
                cleanedQueue
            );


            /*
             * Now reload the real database message.
             * This is exactly the group-chat pattern.
             */
            await fetchMessages();
        }


        /* =========================================================
           OFFLINE QUEUE FLUSH
        ========================================================= */

        async function flushOfflineQueue() {

            if (!navigator.onLine) {
                return;
            }

            const queue =
                loadOfflineQueue();

            if (queue.length === 0) {
                return;
            }

            const remainingQueue = [];

            for (const msg of queue) {

                const payload = {

                    sender_username:
                        msg.sender_username,

                    receiver_username:
                        msg.receiver_username,

                    content:
                        msg.content,

                    message_type:
                        msg.message_type || 'text',

                    reply_to:
                        msg.reply_to || null,

                    is_read:
                        false,

                    created_at:
                        msg.created_at ||
                        new Date().toISOString()
                };


                const { error } =
                    await supabaseClient
                        .from('messages')
                        .insert([payload]);


                if (error) {

                    console.warn(
                        'Queued private message still failed:',
                        error
                    );

                    remainingQueue.push(
                        msg
                    );

                }

            }


            saveOfflineQueue(
                remainingQueue
            );


            /*
             * If everything was delivered,
             * refresh from Supabase.
             */
            if (remainingQueue.length === 0) {

                await fetchMessagesWithoutQueueFlush();
            }
        }


        /*
         * Prevent recursive queue flushing.
         */
        async function fetchMessagesWithoutQueueFlush() {

            if (!navigator.onLine) {
                return;
            }

            const sentPromise =
                supabaseClient
                    .from('messages')
                    .select('*')
                    .eq(
                        'sender_username',
                        currentUser.username
                    )
                    .eq(
                        'receiver_username',
                        targetUsername
                    );

            const receivedPromise =
                supabaseClient
                    .from('messages')
                    .select('*')
                    .eq(
                        'sender_username',
                        targetUsername
                    )
                    .eq(
                        'receiver_username',
                        currentUser.username
                    );

            const [
                sentResult,
                receivedResult
            ] = await Promise.all([
                sentPromise,
                receivedPromise
            ]);

            if (
                sentResult.error ||
                receivedResult.error
            ) {
                return;
            }

            const messages = [
                ...(sentResult.data || []),
                ...(receivedResult.data || [])
            ];

            messages.sort((a, b) =>
                new Date(a.created_at || 0) -
                new Date(b.created_at || 0)
            );

            saveLocalCache(
                messages
            );

            renderMessages(
                messages
            );
        }


        /* =========================================================
           ONLINE EVENT
        ========================================================= */

        window.addEventListener(
            'online',
            async () => {

                await flushOfflineQueue();

                await fetchMessages();

            }
        );


        /* =========================================================
           MULTI SELECT
        ========================================================= */

        function enterMultiSelectMode(msg) {

            isMultiSelectMode = true;

            selectedMessageIds.clear();

            if (msg && msg.id) {

                selectedMessageIds.add(
                    msg.id
                );
            }

            const bar =
                document.getElementById(
                    'multi-select-bar'
                );

            bar.classList.remove(
                'hidden'
            );

            bar.classList.add(
                'flex'
            );

            updateMultiSelectUI();

            renderMessages(
                messagesCache
            );
        }


        function exitMultiSelectMode() {

            isMultiSelectMode = false;

            selectedMessageIds.clear();

            const bar =
                document.getElementById(
                    'multi-select-bar'
                );

            bar.classList.remove(
                'flex'
            );

            bar.classList.add(
                'hidden'
            );

            renderMessages(
                messagesCache
            );
        }


        function toggleMessageSelection(msgId) {

            if (
                selectedMessageIds.has(
                    msgId
                )
            ) {

                selectedMessageIds.delete(
                    msgId
                );

            } else {

                selectedMessageIds.add(
                    msgId
                );
            }

            if (
                selectedMessageIds.size === 0
            ) {

                exitMultiSelectMode();

                return;
            }

            updateMultiSelectUI();

            renderMessages(
                messagesCache
            );
        }


        function updateMultiSelectUI() {

            document
                .getElementById(
                    'selected-count-text'
                )
                .textContent =
                `${selectedMessageIds.size} selected`;
        }


        function handleMultiSelectAction(
            actionType
        ) {

            if (
                selectedMessageIds.size === 0
            ) {
                return;
            }

            const selectedMsgs =
                messagesCache.filter(
                    m =>
                        m.id &&
                        selectedMessageIds.has(
                            m.id
                        )
                );


            if (actionType === 'forward') {

                const firstMsg =
                    selectedMsgs[0];

                if (firstMsg) {

                    localStorage.setItem(
                        'chatlite_forward_payload',
                        JSON.stringify({
                            content:
                                firstMsg.content,

                            type:
                                firstMsg.message_type ||
                                'text'
                        })
                    );

                    window.location.href =
                        'chatlist.html?forward=true';
                }

                exitMultiSelectMode();

                return;
            }


            if (actionType === 'me') {

                let hiddenForMe = [];

                try {

                    hiddenForMe =
                        JSON.parse(
                            localStorage.getItem(
                                `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`
                            ) || '[]'
                        );

                } catch (e) {}


                selectedMessageIds.forEach(
                    id => {

                        if (
                            !hiddenForMe.includes(id)
                        ) {

                            hiddenForMe.push(id);
                        }

                    }
                );


                localStorage.setItem(
                    `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`,
                    JSON.stringify(hiddenForMe)
                );


                exitMultiSelectMode();

                renderMessages(
                    messagesCache
                );

                showUndoBanner(
                    10,
                    () => fetchMessages()
                );

                return;
            }


            if (actionType === 'everyone') {

                const now =
                    Date.now();

                const validIds = [];

                selectedMsgs.forEach(
                    msg => {

                        const isSender =
                            msg.sender_username ===
                            currentUser.username;

                        const diffHours =
                            (
                                now -
                                new Date(
                                    msg.created_at
                                ).getTime()
                            ) /
                            (1000 * 60 * 60);

                        if (
                            isSender &&
                            diffHours <= 3
                        ) {

                            msg.is_deleted_for_everyone =
                                true;

                            validIds.push(
                                msg.id
                            );
                        }

                    }
                );


                exitMultiSelectMode();

                renderMessages(
                    messagesCache
                );


                showUndoBanner(
                    10,
                    async () => {

                        if (
                            validIds.length > 0
                        ) {

                            await supabaseClient
                                .from('messages')
                                .update({
                                    is_deleted_for_everyone: true,
                                    content: '[Message deleted]',
                                    message_type: 'text'
                                })
                                .in(
                                    'id',
                                    validIds
                                );
                        }

                        await fetchMessages();
                    }
                );
            }
        }

           MESSAGE OPTIONS

                };

                selectMultipleBtn
            );

                    'button'

            replyBtn.className =
                'w-full text-left px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-800 rounded-xl transition-all cursor-pointer';

            replyBtn.textContent =
                '↩️ Reply';

            replyBtn.onclick =

                    closeMessageOptions();

                    setReplyTarget(

                    );
                };

            actionsContainer.appendChild(

            ) {

                        'button'

                copyBtn.textContent =
                    '📋 Copy';

                copyBtn.onclick =
                    async () => {

                        try {
