<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Messenger</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
body {
    background: #0f172a;
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
}
.chat-scrollbar::-webkit-scrollbar {
    width: 6px;
}
.chat-scrollbar::-webkit-scrollbar-track {
    background: transparent;
}
.chat-scrollbar::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 3px;
}
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- TOP NAVIGATION BAR -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <button onclick="window.location.href='chatlist.html'" class="p-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="relative">
                <div id="peer-avatar" class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white">?</div>
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></div>
            </div>
            <div>
                <h1 id="peer-name" class="font-semibold text-sm leading-tight text-white">Loading...</h1>
                <p id="peer-status" class="text-xs text-slate-400">Online</p>
            </div>
        </div>
        <div class="flex items-center space-x-1">
            <button onclick="clearChatHistory()" class="p-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-red-400 transition" title="Clear View">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
        </div>
    </header>

    <!-- MAIN CHAT AREA -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scrollbar flex flex-col">
        <div class="flex justify-center my-2">
            <span class="text-[11px] bg-slate-800/80 text-slate-400 px-3 py-1 rounded-full border border-slate-700/50">Messages are synced securely</span>
        </div>
    </main>

    <!-- TYPING / INPUT DOCK -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 shrink-0">
        <form id="message-form" onsubmit="handleMessageSubmit(event)" class="max-w-4xl mx-auto flex items-center gap-2">
            <input type="text" id="message-input" autocomplete="off" placeholder="Type your message..." class="flex-1 bg-slate-800 border border-slate-700 text-slate-100 placeholder-slate-500 px-4 py-3 rounded-xl focus:outline-none focus:border-indigo-500 transition text-sm">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-medium transition flex items-center justify-center shrink-0 shadow-lg shadow-indigo-600/20">
                <svg class="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
        </form>
    </footer>

    <script>
        const activeUser = JSON.parse(localStorage.getItem('chatlite_user') || 'null');
        const urlParams = new URLSearchParams(window.location.search);
        const recipientUsername = decodeURIComponent(urlParams.get('to') || '');
        const recipientName = decodeURIComponent(urlParams.get('name') || recipientUsername);

        let activeChannel = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!activeUser || !activeUser.username) {
                window.location.href = 'chatlist.html';
                return;
            }
            if (!recipientUsername) {
                window.location.href = 'chatlist.html';
                return;
            }

            document.getElementById('peer-name').textContent = recipientName;
            document.getElementById('peer-avatar').textContent = recipientName.charAt(0).toUpperCase();

            initializeMessenger();
        });

        async function initializeMessenger() {
            await fetchMessages();
            setupRealtimeSubscription();
        }

        async function fetchMessages() {
            if (!window.supabaseClient) return;

            try {
                const { data, error } = await window.supabaseClient
                    .from('messages')
                    .select('*')
                    .or(`and(sender_username.eq.${activeUser.username},receiver_username.eq.${recipientUsername}),and(sender_username.eq.${recipientUsername},receiver_username.eq.${activeUser.username})`)
                    .order('created_at', { ascending: true });

                if (error) throw error;
                renderMessageStream(data || []);
            } catch (err) {
                console.error('Failed to load thread:', err);
            }
        }

        function renderMessageStream(messages) {
            const container = document.getElementById('chat-container');
            
            // Keep the security badge
            container.innerHTML = `
                <div class="flex justify-center my-2">
                    <span class="text-[11px] bg-slate-800/80 text-slate-400 px-3 py-1 rounded-full border border-slate-700/50">Messages are synced securely</span>
                </div>
            `;

            if (messages.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'text-center text-slate-500 text-sm my-auto py-8';
                emptyState.textContent = `No prior messages with ${recipientName}. Start the conversation below.`;
                container.appendChild(emptyState);
                return;
            }

            messages.forEach(msg => {
                const isOutbound = msg.sender_username === activeUser.username;
                const wrapper = document.createElement('div');
                wrapper.className = `flex ${isOutbound ? 'justify-end' : 'justify-start'} mb-3`;

                const bubble = document.createElement('div');
                bubble.className = `max-w-[75%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed ${
                    isOutbound 
                        ? 'bg-indigo-600 text-white rounded-br-sm shadow-md shadow-indigo-600/10' 
                        : 'bg-slate-800 text-slate-100 border border-slate-700/60 rounded-bl-sm'
                }`;

                const textNode = document.createElement('div');
                textNode.textContent = msg.content;
                bubble.appendChild(textNode);

                const timestamp = document.createElement('div');
                timestamp.className = `text-[10px] mt-1 text-right ${isOutbound ? 'text-indigo-200' : 'text-slate-400'}`;
                timestamp.textContent = formatTimestamp(msg.created_at);
                bubble.appendChild(timestamp);

                wrapper.appendChild(bubble);
                container.appendChild(wrapper);
            });

            container.scrollTop = container.scrollHeight;
        }

        async function handleMessageSubmit(e) {
            e.preventDefault();
            const inputField = document.getElementById('message-input');
            const content = inputField.value.trim();

            if (!content || !window.supabaseClient) return;

            inputField.value = '';

            try {
                const { error } = await window.supabaseClient
                    .from('messages')
                    .insert({
                        sender_username: activeUser.username,
                        receiver_username: recipientUsername,
                        content: content
                    });

                if (error) throw error;
                await fetchMessages();
            } catch (err) {
                console.error('Transmission error:', err);
                alert('Failed to send message. Please try again.');
            }
        }

        function setupRealtimeSubscription() {
            if (!window.supabaseClient) return;

            if (activeChannel) {
                window.supabaseClient.removeChannel(activeChannel);
            }

            activeChannel = window.supabaseClient
                .channel(`room_${activeUser.username}_${recipientUsername}`)
                .on(
                    'postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'messages' },
                    payload => {
                        const row = payload.new;
                        const relevant = 
                            (row.sender_username === activeUser.username && row.receiver_username === recipientUsername) ||
                            (row.sender_username === recipientUsername && row.receiver_username === activeUser.username);

                        if (relevant) {
                            fetchMessages();
                        }
                    }
                )
                .subscribe();
        }

        function formatTimestamp(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function clearChatHistory() {
            document.getElementById('chat-container').innerHTML = `
                <div class="flex justify-center my-2">
                    <span class="text-[11px] bg-slate-800/80 text-slate-400 px-3 py-1 rounded-full border border-slate-700/50">Messages are synced securely</span>
                </div>
                <div class="text-center text-slate-500 text-sm my-auto py-8">View cleared locally.</div>
            `;
        }

        window.addEventListener('beforeunload', () => {
            if (activeChannel && window.supabaseClient) {
                window.supabaseClient.removeChannel(activeChannel);
            }
        });
    </script>
</body>
</html>
