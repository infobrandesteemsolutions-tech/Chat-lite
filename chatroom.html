</div><script src="supabase.js"></script><script>
/* ============================================================
   PRIVATE CHAT
   Built from the working group-chat architecture.
   Uses ONLY the confirmed messages-table columns:
   sender_username
   receiver_username
   content
   created_at
   ============================================================ */

const urlParams = new URLSearchParams(window.location.search);

const targetUsername =
    urlParams.get('to') ||
    urlParams.get('username') ||
    '';

const targetName =
    urlParams.get('name') ||
    targetUsername ||
    'Chat';

const targetGender =
    urlParams.get('gender') ||
    '';

let currentUser = null;

try {
    currentUser = JSON.parse(localStorage.getItem('chatlite_user') || 'null');
} catch (e) {
    currentUser = null;
}

let mediaRecorder = null;
let audioChunks = [];
let recordedBlob = null;
let stagedPayload = null;

let isRecording = false;
let isPaused = false;
let recordingTimerInterval = null;
let recordingSeconds = 0;

let activeReplyMessage = null;
let messageSubscription = null;

let pendingDeleteTimer = null;
let undoTargetMessage = null;

let messagesCache = [];

const CACHE_KEY =
    `chatlite_private_cache_${currentUser?.username || 'unknown'}_${targetUsername}`;

const QUEUE_KEY =
    `chatlite_private_offline_queue_${currentUser?.username || 'unknown'}_${targetUsername}`;

const DELETED_KEY =
    `chatlite_private_deleted_for_me_${currentUser?.username || 'unknown'}_${targetUsername}`;


/* ============================================================
   SESSION / INITIALIZATION
   ============================================================ */

if (!currentUser || !targetUsername) {

    window.location.href = 'chatlist.html';

} else {

    initPrivateChat();

}


/* ============================================================
   LOCAL CACHE
   ============================================================ */

function loadLocalCache() {

    try {

        const data = localStorage.getItem(CACHE_KEY);

        return data ? JSON.parse(data) : [];

    } catch (e) {

        return [];

    }
}


function saveLocalCache(messages) {

    messagesCache = messages;

    try {
        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify(messages)
        );
    } catch (e) {
        console.warn('Could not save private chat cache.', e);
    }

}


function getOfflineQueue() {

    try {

        const data = localStorage.getItem(QUEUE_KEY);

        return data ? JSON.parse(data) : [];

    } catch (e) {

        return [];

    }

}


function saveOfflineQueue(queue) {

    try {
        localStorage.setItem(
            QUEUE_KEY,
            JSON.stringify(queue)
        );
    } catch (e) {
        console.warn('Could not save private offline queue.', e);
    }

}


function getDeletedForMe() {

    try {

        return JSON.parse(
            localStorage.getItem(DELETED_KEY) || '[]'
        );

    } catch (e) {

        return [];

    }

}


function saveDeletedForMe(list) {

    localStorage.setItem(
        DELETED_KEY,
        JSON.stringify(list)
    );

}


/* ============================================================
   PRIVATE MESSAGE ENVELOPE
   ------------------------------------------------------------
   IMPORTANT:
   We cannot send reply_to/message_type/media columns because
   those columns are not confirmed in the current messages table.

   Therefore advanced private-chat metadata is packed safely
   inside the existing `content` column.
   ============================================================ */

const PRIVATE_PACKET_PREFIX = '__CHATLITE_PRIVATE_PACKET__';


function createPrivatePacket(content, type, replyData) {

    return PRIVATE_PACKET_PREFIX + JSON.stringify({

        version: 1,

        type: type || 'text',

        content: content || '',

        reply_to_sender:
            replyData?.reply_to_sender || null,

        reply_to_message:
            replyData?.reply_to_message || null

    });

}


function decodePrivateMessage(msg) {

    if (!msg) return msg;

    if (
        typeof msg.content === 'string' &&
        msg.content.startsWith(PRIVATE_PACKET_PREFIX)
    ) {

        try {

            const packet = JSON.parse(
                msg.content.substring(
                    PRIVATE_PACKET_PREFIX.length
                )
            );

            return {

                ...msg,

                message:
                    packet.content || '',

                media_url:
                    packet.type !== 'text'
                        ? packet.content
                        : null,

                media_type:
                    packet.type !== 'text'
                        ? packet.type
                        : null,

                reply_to_sender:
                    packet.reply_to_sender || null,

                reply_to_message:
                    packet.reply_to_message || null,

                _privatePacket: true

            };

        } catch (e) {

            console.warn(
                'Could not decode private message packet.',
                e
            );

        }

    }

    /* Existing plain text messages continue working. */

    return {

        ...msg,

        message:
            msg.message !== undefined
                ? msg.message
                : msg.content,

        media_url:
            msg.media_url || null,

        media_type:
            msg.media_type || 'text'

    };

}


/* ============================================================
   INITIALIZATION
   ============================================================ */

async function initPrivateChat() {

    updateHeader();

    messagesCache = loadLocalCache();

    if (messagesCache.length > 0) {

        renderMessages(messagesCache);

    }

    await flushOfflineQueue();

    await fetchMessages();

    subscribeToPrivateMessages();

}


/* ============================================================
   HEADER
   ============================================================ */

function updateHeader() {

    const nameEl =
        document.getElementById('chat-header-name');

    const metaEl =
        document.getElementById('chat-header-meta');

    const avatarEl =
        document.getElementById('chat-header-avatar');

    nameEl.textContent = targetName;

    metaEl.textContent =
        `@${targetUsername}` +
        (targetGender ? ` • ${targetGender}` : '');

    avatarEl.textContent =
        targetName.charAt(0).toUpperCase();

}


/* ============================================================
   NAVIGATION
   ============================================================ */

function goBack() {

    window.location.href = 'chatlist.html';

}


/* ============================================================
   ATTACHMENT MENU
   ============================================================ */

function toggleAttachmentMenu() {

    const menu =
        document.getElementById('attachment-menu');

    menu.classList.toggle('hidden');

}


window.addEventListener('click', function(e) {

    if (
        !e.target.closest('#attachment-menu') &&
        !e.target.closest('#attach-btn')
    ) {

        document
            .getElementById('attachment-menu')
            .classList.add('hidden');

    }

});


/* ============================================================
   SEARCH
   ============================================================ */

function toggleSearchBox() {

    const searchBar =
        document.getElementById('search-container');

    searchBar.classList.toggle('hidden');

    if (!searchBar.classList.contains('hidden')) {

        document
            .getElementById('search-keyword-input')
            .focus();

    } else {

        filterMessages('');

    }

}


function filterMessages(keyword) {

    const term =
        (keyword || '').toLowerCase();

    if (!term) {

        renderMessages(messagesCache);

        return;

    }

    const filtered =
        messagesCache.filter(raw => {

            const msg =
                decodePrivateMessage(raw);

            if (msg.is_deleted_for_everyone) {
                return false;
            }

            const text =
                String(msg.message || '');

            if (text.toLowerCase().includes(term)) {
                return true;
            }

            if (
                msg.media_type &&
                msg.media_type.toLowerCase() === term
            ) {
                return true;
            }

            return false;

        });

    renderMessages(filtered);

}


/* ============================================================
   FILE STAGING
   ============================================================ */

function stageFileSelected(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    const progressBar =
        document.getElementById(
            'upload-progress-bar'
        );

    const statusText =
        document.getElementById(
            'upload-status-text'
        );

    document
        .getElementById('media-preview-bar')
        .classList.remove('hidden');

    document
        .getElementById('media-preview-bar')
        .classList.add('flex');

    progressBar.style.width = '10%';

    statusText.textContent =
        'Reading file stream...';

    reader.onprogress = function(data) {

        if (data.lengthComputable) {

            const percent =
                Math.round(
                    (data.loaded / data.total) * 90
                );

            progressBar.style.width =
                percent + '%';

        }

    };

    reader.onload = function(e) {

        progressBar.style.width = '100%';

        statusText.textContent =
            'Ready! Hit Send to dispatch.';

        let type = 'file';

        if (file.type.startsWith('image/')) {

            type = 'image';

        } else if (file.type.startsWith('video/')) {

            type = 'video';

        } else if (file.type.startsWith('audio/')) {

            type = 'audio';

        }

        stagedPayload = {

            content: e.target.result,

            type: type,

            fileName: file.name

        };

        const preview =
            document.getElementById(
                'preview-container'
            );

        if (type === 'image') {

            preview.innerHTML =
                `<img src="${e.target.result}" class="max-h-20 rounded object-contain">`;

        } else if (type === 'video') {

            preview.innerHTML =
                `<video src="${e.target.result}" class="max-h-20 rounded" controls></video>`;

        } else {

            preview.innerHTML =
                `<span class="font-semibold">${escapeHtml(file.name)}</span>`;

        }

    };

    reader.readAsDataURL(file);

}


/* ============================================================
   MEDIA CLEAR
   ============================================================ */

function clearStagedMedia() {

    stagedPayload = null;

    recordedBlob = null;

    const bar =
        document.getElementById(
            'media-preview-bar'
        );

    bar.classList.add('hidden');
    bar.classList.remove('flex');

    document
        .getElementById('upload-progress-bar')
        .style.width = '0%';

    document
        .getElementById('preview-container')
        .innerHTML = '';

}


/* ============================================================
   REPLY
   ============================================================ */

function setReplyToMessage(msg) {

    const decoded =
        decodePrivateMessage(msg);

    activeReplyMessage = decoded;

    const previewBar =
        document.getElementById(
            'reply-preview-bar'
        );

    const senderEl =
        document.getElementById(
            'reply-preview-sender'
        );

    const textEl =
        document.getElementById(
            'reply-preview-text'
        );

    senderEl.textContent =
        decoded.sender_username === currentUser.username
            ? 'You'
            : (
                decoded.sender_name ||
                decoded.sender_username ||
                targetName
            );

    textEl.textContent =
        decoded.message ||
        `[${decoded.media_type || 'Media'}]`;

    previewBar.classList.remove('hidden');
    previewBar.classList.add('flex');

    document
        .getElementById('message-input')
        .focus();

}


function cancelReply() {

    activeReplyMessage = null;

    const previewBar =
        document.getElementById(
            'reply-preview-bar'
        );

    previewBar.classList.remove('flex');
    previewBar.classList.add('hidden');

}


/* ============================================================
   VOICE RECORDING
   ============================================================ */

async function startVoiceRecording() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            alert(
                'Voice recording is not supported by this browser.'
            );

            return;

        }

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        let mimeType = 'audio/webm';

        if (
            typeof MediaRecorder !== 'undefined' &&
            MediaRecorder.isTypeSupported &&
            !MediaRecorder.isTypeSupported('audio/webm')
        ) {

            if (
                MediaRecorder.isTypeSupported(
                    'audio/mp4'
                )
            ) {

                mimeType = 'audio/mp4';

            } else {

                mimeType = '';

            }

        }

        mediaRecorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    { type: mimeType }
                )
                : new MediaRecorder(stream);

        audioChunks = [];

        mediaRecorder.ondataavailable =
            function(e) {

                if (e.data && e.data.size > 0) {

                    audioChunks.push(e.data);

                }

            };

        mediaRecorder.onstop =
            function() {

                const actualType =
                    mediaRecorder.mimeType ||
                    mimeType ||
                    'audio/webm';

                recordedBlob =
                    new Blob(
                        audioChunks,
                        { type: actualType }
                    );

                stream
                    .getTracks()
                    .forEach(track => track.stop());

            };

        mediaRecorder.start();

        isRecording = true;
        isPaused = false;
        recordedBlob = null;

        document
            .getElementById('message-input')
            .classList.add('hidden');

        document
            .getElementById('recording-ui')
            .classList.remove('hidden');

        document
            .getElementById('recording-ui')
            .classList.add('flex');

        document
            .getElementById('mic-btn')
            .classList.add('hidden');

        recordingSeconds = 0;

        document
            .getElementById('recording-timer')
            .textContent = '0:00';

        recordingTimerInterval =
            setInterval(function() {

                if (!isPaused) {

                    recordingSeconds++;

                    const m =
                        Math.floor(
                            recordingSeconds / 60
                        );

                    const s =
                        recordingSeconds % 60;

                    document
                        .getElementById(
                            'recording-timer'
                        )
                        .textContent =
                        `${m}:${s < 10 ? '0' : ''}${s}`;

                }

            }, 1000);

    } catch (err) {

        console.error(
            'Voice recording error:',
            err
        );

        alert(
            'Microphone access denied or unavailable.'
        );

    }

}


function togglePauseRecording() {

    if (!mediaRecorder) return;

    const btn =
        document.getElementById(
            'pause-rec-btn'
        );

    if (!isPaused) {

        if (mediaRecorder.state === 'recording') {

            mediaRecorder.pause();

        }

        isPaused = true;

        btn.textContent =
            '▶ Resume';

    } else {

        if (mediaRecorder.state === 'paused') {

            mediaRecorder.resume();

        }

        isPaused = false;

        btn.textContent =
            '⏸ Pause';

    }

}


function stopRecordingOnly() {

    if (
        mediaRecorder &&
        isRecording
    ) {

        mediaRecorder.stop();

        isRecording = false;

        clearInterval(
            recordingTimerInterval
        );

        document
            .getElementById(
                'media-preview-bar'
            )
            .classList.remove('hidden');

        document
            .getElementById(
                'media-preview-bar'
            )
            .classList.add('flex');

        document
            .getElementById(
                'preview-container'
            )
            .innerHTML =
            `<span class="text-orange-400 font-bold text-xs">
                Voice Note Recorded (${recordingSeconds}s). Ready to Send.
            </span>`;

        document
            .getElementById(
                'upload-progress-bar'
            )
            .style.width = '100%';

        document
            .getElementById(
                'upload-status-text'
            )
            .textContent =
            'Hit Send to dispatch voice note.';

    }

}


function cancelRecording() {

    if (
        mediaRecorder &&
        (
            isRecording ||
            isPaused
        )
    ) {

        mediaRecorder.ondataavailable = null;

        try {

            mediaRecorder.stop();

        } catch (e) {}

    }

    resetRecordingUI();

    clearStagedMedia();

}


function resetRecordingUI() {

    clearInterval(
        recordingTimerInterval
    );

    isRecording = false;
    isPaused = false;
    mediaRecorder = null;

    document
        .getElementById('recording-ui')
        .classList.add('hidden');

    document
        .getElementById('recording-ui')
        .classList.remove('flex');

    document
        .getElementById('message-input')
        .classList.remove('hidden');

    document
        .getElementById('mic-btn')
        .classList.remove('hidden');

}


/* ============================================================
   FORM SUBMISSION
   ============================================================ */

async function handleFormSubmit(e) {

    e.preventDefault();

    if (isRecording) {

        stopRecordingOnly();

        return;

    }

    if (recordedBlob) {

        const reader =
            new FileReader();

        reader.readAsDataURL(recordedBlob);

        reader.onloadend =
            async function() {

                await sendPrivatePayload(
                    reader.result,
                    'audio'
                );

                recordedBlob = null;

                resetRecordingUI();

                clearStagedMedia();

            };

        return;

    }

    if (stagedPayload) {

        await sendPrivatePayload(
            stagedPayload.content,
            stagedPayload.type
        );

        clearStagedMedia();

        return;

    }

    const input =
        document.getElementById(
            'message-input'
        );

    const content =
        input.value.trim();

    if (!content) return;

    input.value = '';

    await sendPrivatePayload(
        content,
        'text'
    );

}


/* ============================================================
   SEND PRIVATE MESSAGE
   ============================================================ */

async function sendPrivatePayload(content, type) {

    if (
        !currentUser ||
        !targetUsername
    ) {
        return;
    }

    const replyData =
        activeReplyMessage
            ? {

                reply_to_sender:
                    activeReplyMessage.sender_name ||
                    activeReplyMessage.sender_username ||
                    targetName,

                reply_to_message:
                    activeReplyMessage.message ||
                    `[${activeReplyMessage.media_type || 'Media'}]`

            }
            : {};

    const now =
        new Date().toISOString();

    /*
     * Local message uses the same visual architecture as group chat.
     */
    const localMessage = {

        local_id:
            'local_' +
            Date.now() +
            '_' +
            Math.random()
                .toString(36)
                .substring(2, 8),

        sender_username:
            currentUser.username,

        receiver_username:
            targetUsername,

        sender_name:
            currentUser.name,

        message:
            content,

        content:
            content,

        media_url:
            type !== 'text'
                ? content
                : null,

        media_type:
            type !== 'text'
                ? type
                : 'text',

        reply_to_sender:
            replyData.reply_to_sender || null,

        reply_to_message:
            replyData.reply_to_message || null,

        created_at:
            now,

        is_pending:
            true

    };

    messagesCache.push(
        localMessage
    );

    saveLocalCache(
        messagesCache
    );

    renderMessages(
        messagesCache
    );

    cancelReply();

    /*
     * Offline = queue.
     */
    if (!navigator.onLine) {

        queueOfflineMessage(
            localMessage
        );

        return;

    }

    /*
     * IMPORTANT:
     * Only the confirmed columns are inserted.
     *
     * No reply_to
     * No media_type
     * No media_url
     * No sender_name
     *
     * Advanced information lives inside content.
     */
    const dbContent =
        createPrivatePacket(
            content,
            type,
            replyData
        );

    const payload = {

        sender_username:
            currentUser.username,

        receiver_username:
            targetUsername,

        content:
            dbContent

    };

    try {

        const result =
            await supabaseClient
                .from('messages')
                .insert([payload])
                .select();

        if (result.error) {

            console.error(
                'Private message insert failed:',
                result.error
            );

            queueOfflineMessage(
                localMessage
            );

            return;

        }

        /*
         * Insert succeeded.
         *
         * Remove ONLY this local pending copy.
         */
        messagesCache =
            messagesCache.filter(
                m =>
                    m.local_id !==
                    localMessage.local_id
            );

        saveLocalCache(
            messagesCache
        );

        /*
         * Fetch the authoritative database row.
         * This replaces the clock with ✓✓.
         */
        await fetchMessages();

    } catch (err) {

        console.error(
            'Private send exception:',
            err
        );

        queueOfflineMessage(
            localMessage
        );

    }

}


/* ============================================================
   OFFLINE QUEUE
   ============================================================ */

function queueOfflineMessage(msg) {

    const queue =
        getOfflineQueue();

    /*
     * Prevent accidental duplicate queue entries.
     */
    const alreadyQueued =
        queue.some(
            item =>
                item.local_id ===
                msg.local_id
        );

    if (!alreadyQueued) {

        queue.push(msg);

        saveOfflineQueue(
            queue
        );

    }

}


async function flushOfflineQueue() {

    if (
        !navigator.onLine ||
        !supabaseClient ||
        !currentUser
    ) {
        return;
    }

    const queue =
        getOfflineQueue();

    if (queue.length === 0) {
        return;
    }

    const remaining = [];

    for (const msg of queue) {

        try {

            const dbContent =
                createPrivatePacket(
                    msg.message ||
                    msg.content ||
                    '',
                    msg.media_type ||
                    'text',
                    {
                        reply_to_sender:
                            msg.reply_to_sender || null,

                        reply_to_message:
                            msg.reply_to_message || null
                    }
                );

            const result =
                await supabaseClient
                    .from('messages')
                    .insert([{

                        sender_username:
                            msg.sender_username,

                        receiver_username:
                            msg.receiver_username,

                        content:
                            dbContent

                    }]);

            if (result.error) {

                console.error(
                    'Offline message retry failed:',
                    result.error
                );

                remaining.push(msg);

            }

        } catch (err) {

            console.error(
                'Offline retry exception:',
                err
            );

            remaining.push(msg);

        }

    }

    saveOfflineQueue(
        remaining
    );

    await fetchMessages();

}


window.addEventListener(
    'online',
    async function() {

        await flushOfflineQueue();

        await fetchMessages();

    }
);


/* ============================================================
   FETCH MESSAGES
   ============================================================ */

async function fetchMessages() {

    if (
        !navigator.onLine ||
        !supabaseClient ||
        !currentUser ||
        !targetUsername
    ) {
        return;
    }

    try {

        /*
         * Separate queries are deliberately used.
         * This avoids PostgREST .or() parsing problems with
         * usernames and gives us a reliable private conversation.
         */

        const sentResult =
            await supabaseClient
                .from('messages')
                .select('*')
                .eq(
                    'sender_username',
                    currentUser.username
                )
                .eq(
                    'receiver_username',
                    targetUsername
                )
                .order(
                    'created_at',
                    { ascending: true }
                );

        const receivedResult =
            await supabaseClient
                .from('messages')
                .select('*')
                .eq(
                    'sender_username',
                    targetUsername
                )
                .eq(
                    'receiver_username',
                    currentUser.username
                )
                .order(
                    'created_at',
                    { ascending: true }
                );

        if (
            sentResult.error ||
            receivedResult.error
        ) {

            console.error(
                'Private message fetch error:',
                sentResult.error ||
                receivedResult.error
            );

            /*
             * Do NOT destroy local pending/cache data
             * when the database read fails.
             */
            return;

        }

        const dbMessages = [
            ...(sentResult.data || []),
            ...(receivedResult.data || [])
        ];

        /*
         * Decode packets only for the UI.
         */
        const decoded =
            dbMessages.map(
                decodePrivateMessage
            );

        decoded.sort(
            (a, b) =>
                new Date(a.created_at).getTime() -
                new Date(b.created_at).getTime()
        );

        /*
         * Keep local pending messages only if they haven't
         * already appeared in the database.
         *
         * Once fetch confirms the database insert, the local
         * pending copy disappears.
         */
        const queue =
            getOfflineQueue();

        const pendingLocals =
            [
                ...queue
            ];

        /*
         * Add currently displayed local pending messages that
         * are not in the queue yet.
         */
        messagesCache.forEach(msg => {

            if (
                msg.local_id &&
                msg.is_pending
            ) {

                const exists =
                    pendingLocals.some(
                        q =>
                            q.local_id ===
                            msg.local_id
                    );

                if (!exists) {

                    pendingLocals.push(msg);

                }

            }

        });

        const merged =
            [
                ...decoded,
                ...pendingLocals
            ];

        merged.sort(
            (a, b) =>
                new Date(
                    a.created_at || Date.now()
                ).getTime() -
                new Date(
                    b.created_at || Date.now()
                ).getTime()
        );

        saveLocalCache(
            merged
        );

        renderMessages(
            merged
        );

    } catch (err) {

        console.error(
            'Private fetch exception:',
            err
        );

    }

}


/* ============================================================
   RENDER
   ============================================================ */

function renderMessages(messages) {

    const chatContainer =
        document.getElementById(
            'chat-messages'
        );

    chatContainer.innerHTML = '';

    const hiddenForMe =
        getDeletedForMe();

    const filtered =
        messages.filter(
            raw => {

                const msg =
                    decodePrivateMessage(raw);

                if (
                    msg.id &&
                    hiddenForMe.includes(msg.id)
                ) {
                    return false;
                }

                if (
                    msg.is_deleted_for_everyone
                ) {
                    return false;
                }

                return true;

            }
        );

    if (
        filtered.length === 0 &&
        getOfflineQueue().length === 0
    ) {

        chatContainer.innerHTML =
            `<div class="text-center text-xs text-slate-500 py-8">
                No messages yet. Start the conversation!
            </div>`;

        return;

    }

    filtered.forEach(
        msg =>
            appendMessageToDOM(
                msg,
                false
            )
    );

    chatContainer.scrollTop =
        chatContainer.scrollHeight;

}


/* ============================================================
   MESSAGE DOM
   ============================================================ */

function appendMessageToDOM(
    rawMsg,
    scrollToBottom = true
) {

    const msg =
        decodePrivateMessage(
            rawMsg
        );

    const chatContainer =
        document.getElementById(
            'chat-messages'
        );

    const isMe =
        msg.sender_username ===
        currentUser.username;

    const bubble =
        document.createElement('div');

    bubble.className =
        `flex flex-col ${
            isMe
                ? 'items-end'
                : 'items-start'
        } mb-2 relative select-none`;

    if (msg.id) {

        bubble.setAttribute(
            'data-id',
            msg.id
        );

    }

    if (msg.local_id) {

        bubble.setAttribute(
            'data-local-id',
            msg.local_id
        );

    }

    /* Long press */
    let pressTimer = null;

    const startPress = () => {

        pressTimer =
            setTimeout(
                () => openMessageOptions(msg),
                600
            );

    };

    const cancelPress = () => {

        if (pressTimer) {

            clearTimeout(
                pressTimer
            );

        }

    };

    bubble.addEventListener(
        'touchstart',
        startPress
    );

    bubble.addEventListener(
        'touchend',
        cancelPress
    );

    bubble.addEventListener(
        'touchmove',
        cancelPress
    );

    bubble.addEventListener(
        'mousedown',
        startPress
    );

    bubble.addEventListener(
        'mouseup',
        cancelPress
    );

    bubble.addEventListener(
        'mouseleave',
        cancelPress
    );

    /* Swipe right to reply */
    let touchStartX = 0;

    bubble.addEventListener(
        'touchstart',
        e => {

            if (
                e.touches &&
                e.touches[0]
            ) {

                touchStartX =
                    e.touches[0].clientX;

            }

        }
    );

    bubble.addEventListener(
        'touchend',
        e => {

            if (
                e.changedTouches &&
                e.changedTouches[0]
            ) {

                const touchEndX =
                    e.changedTouches[0].clientX;

                if (
                    touchEndX -
                    touchStartX >
                    70
                ) {

                    setReplyToMessage(
                        msg
                    );

                }

            }

        }
    );

    const timeString =
        new Date(
            msg.created_at ||
            Date.now()
        ).toLocaleTimeString(
            [],
            {
                hour: '2-digit',
                minute: '2-digit'
            }
        );

    let replyQuoteHtml = '';

    if (msg.reply_to_message) {

        replyQuoteHtml =
            `<div class="mb-1.5 p-1.5 bg-black/20 border-l-2 border-orange-400 rounded text-[11px] overflow-hidden">
                <span class="block font-bold text-orange-300 truncate">
                    ${escapeHtml(
                        msg.reply_to_sender ||
                        'Someone'
                    )}
                </span>
                <span class="block text-slate-200 truncate">
                    ${escapeHtml(
                        msg.reply_to_message
                    )}
                </span>
            </div>`;

    }

    let contentHtml = '';

    const type =
        msg.media_type ||
        'text';

    if (type === 'image') {

        const url =
            msg.media_url ||
            msg.message;

        contentHtml =
            `<img
                src="${escapeAttribute(url)}"
                class="rounded-xl max-h-48 object-cover cursor-pointer mb-1"
                onclick="window.open('${escapeAttribute(url)}', '_blank')">`;

    } else if (type === 'video') {

        const url =
            msg.media_url ||
            msg.message;

        contentHtml =
            `<video
                src="${escapeAttribute(url)}"
                controls
                class="rounded-xl max-h-48 object-cover mb-1">
            </video>`;

    } else if (type === 'audio') {

        const audioId =
            'audio_' +
            Math.random()
                .toString(36)
                .substring(2, 9);

        const audioSrc =
            msg.media_url ||
            msg.message;

        contentHtml =
            `<div
                class="flex items-center gap-2.5 py-1 px-1 min-w-[220px]"
                data-audio-container>

                <button
                    type="button"
                    onclick="toggleAudioPlay('${audioId}', this)"
                    class="w-8 h-8 rounded-full bg-white/25 hover:bg-white/40 flex items-center justify-center text-xs font-bold transition-all flex-shrink-0 cursor-pointer">
                    ▶
                </button>

                <audio
                    id="${audioId}"
                    src="${escapeAttribute(audioSrc)}"
                    preload="metadata">
                </audio>

                <div class="flex flex-col flex-1 gap-1">

                    <div class="flex justify-between items-center text-[10px] opacity-80">

                        <span class="audio-current-time">
                            0:00
                        </span>

                        <button
                            type="button"
                            onclick="toggleAudioSpeed('${audioId}', this)"
                            class="bg-white/10 hover:bg-white/20 px-1.5 py-0.5 rounded font-mono text-[9px] cursor-pointer">
                            1x
                        </button>

                    </div>

                    <input
                        type="range"
                        value="0"
                        max="100"
                        step="0.1"
                        oninput="seekAudio('${audioId}', this.value)"
                        class="audio-range w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white">

                </div>

            </div>`;

        setTimeout(
            () => {

                const audioEl =
                    document.getElementById(
                        audioId
                    );

                if (!audioEl) return;

                const container =
                    audioEl.closest(
                        '[data-audio-container]'
                    );

                if (!container) return;

                const rangeEl =
                    container.querySelector(
                        '.audio-range'
                    );

                const timeEl =
                    container.querySelector(
                        '.audio-current-time'
                    );

                audioEl.addEventListener(
                    'loadedmetadata',
                    () => {

                        timeEl.textContent =
                            formatAudioTime(
                                audioEl.duration
                            );

                    }
                );

                audioEl.addEventListener(
                    'timeupdate',
                    () => {

                        if (!audioEl.duration) {
                            return;
                        }

                        rangeEl.value =
                            (
                                audioEl.currentTime /
                                audioEl.duration
                            ) * 100;

                        timeEl.textContent =
                            formatAudioTime(
                                audioEl.currentTime
                            );

                    }
                );

                audioEl.addEventListener(
                    'ended',
                    () => {

                        const btn =
                            container.querySelector(
                                'button'
                            );

                        if (btn) {
                            btn.textContent = '▶';
                        }

                        audioEl.currentTime = 0;

                    }
                );

            },
            50
        );

    } else if (type === 'file') {

        const url =
            msg.media_url ||
            msg.message;

        contentHtml =
            `<a
                href="${escapeAttribute(url)}"
                download
                target="_blank"
                class="flex items-center gap-2 underline text-xs font-semibold py-1">
                📁 File Attachment
            </a>`;

    } else {

        contentHtml =
            `<span>${escapeHtml(
                msg.message || ''
            )}</span>`;

    }

    const metaRow =
        document.createElement('div');

    metaRow.className =
        'flex items-center gap-1 px-1 text-[9px] text-slate-500 mt-0.5';

    const timeSpan =
        document.createElement('span');

    timeSpan.textContent =
        timeString;

    metaRow.appendChild(
        timeSpan
    );

    /*
     * DELIVERY TICKS
     *
     * Pending local message = clock.
     * Successfully present in DB = ✓✓.
     *
     * This does not require another database column.
     */
    if (isMe) {

        const tickSpan =
            document.createElement('span');

        tickSpan.className =
            'font-bold text-xs';

        if (msg.is_pending) {

            tickSpan.textContent =
                '🕒';

            tickSpan.title =
                'Waiting for network...';

        } else {

            tickSpan.textContent =
                '✓✓';

            tickSpan.classList.add(
                'text-orange-400'
            );

            tickSpan.title =
                'Delivered';

        }

        metaRow.appendChild(
            tickSpan
        );

    }

    bubble.innerHTML =
        `<div
            class="max-w-[75%] px-3.5 py-2 rounded-2xl text-sm ${
                isMe
                    ? 'bg-orange-600 text-white rounded-br-none'
                    : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'
            }">

            ${
                !isMe
                    ? `<span class="block text-[10px] font-bold text-orange-400 mb-0.5">
                        ${escapeHtml(
                            msg.sender_name ||
                            targetName
                        )}
                    </span>`
                    : ''
            }

            ${replyQuoteHtml}

            ${contentHtml}

        </div>`;

    bubble.appendChild(
        metaRow
    );

    chatContainer.appendChild(
        bubble
    );

    if (scrollToBottom) {

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

    }

}


/* ============================================================
   MESSAGE OPTIONS
   ============================================================ */

function openMessageOptions(msg) {

    const modal =
        document.getElementById(
            'message-options-modal'
        );

    const actions =
        document.getElementById(
            'message-options-actions'
        );

    actions.innerHTML = '';

    const isSender =
        msg.sender_username ===
        currentUser.username;

    const msgTime =
        new Date(
            msg.created_at
        ).getTime();

    const now =
        Date.now();

    const diffHours =
        (now - msgTime) /
        (1000 * 60 * 60);

    const within3Hours =
        diffHours <= 3;

    addMessageOption(
        actions,
        '↩️ Reply',
        () => {

            closeMessageOptions();

            setReplyToMessage(
                msg
            );

        }
    );

    addMessageOption(
        actions,
        '📋 Copy',
        () => {

            closeMessageOptions();

            const copyValue =
                msg.message ||
                msg.media_url ||
                '';

            navigator.clipboard
                .writeText(
                    copyValue
                )
                .then(
                    () =>
                        alert(
                            'Message copied to clipboard.'
                        )
                )
                .catch(
                    () =>
                        alert(
                            'Could not copy message.'
                        )
                );

        }
    );

    addMessageOption(
        actions,
        '↗️ Forward',
        () => {

            closeMessageOptions();

            alert(
                'Forward functionality selected for: ' +
                (
                    msg.message ||
                    'Media'
                )
            );

        }
    );

    addMessageOption(
        actions,
        '🗑️ Delete for me',
        () => {

            closeMessageOptions();

            executeDeleteMessage(
                msg,
                'me'
            );

        }
    );

    if (
        within3Hours &&
        isSender &&
        msg.id
    ) {

        addMessageOption(
            actions,
            '🗑️ Delete for everyone',
            () => {

                closeMessageOptions();

                executeDeleteMessage(
                    msg,
                    'everyone'
                );

            },
            true
        );

    }

    modal.classList.remove(
        'hidden'
    );

    modal.classList.add(
        'flex'
    );

}


function addMessageOption(
    container,
    label,
    action,
    danger = false
) {

    const btn =
        document.createElement(
            'button'
        );

    btn.type = 'button';

    btn.className =
        `w-full text-left px-3 py-2 text-xs font-medium ${
            danger
                ? 'text-red-400'
                : 'text-slate-200'
        } hover:bg-slate-800 rounded-xl transition-all cursor-pointer`;

    btn.textContent =
        label;

    btn.onclick =
        action;

    container.appendChild(
        btn
    );

}


function closeMessageOptions() {

    const modal =
        document.getElementById(
            'message-options-modal'
        );

    modal.classList.remove(
        'flex'
    );

    modal.classList.add(
        'hidden'
    );

}


/* ============================================================
   DELETE
   ============================================================ */

function executeDeleteMessage(
    msg,
    scope
) {

    undoTargetMessage = {
        msg,
        scope
    };

    if (scope === 'me') {

        if (msg.id) {

            const hidden =
                getDeletedForMe();

            if (
                !hidden.includes(
                    msg.id
                )
            ) {

                hidden.push(
                    msg.id
                );

            }

            saveDeletedForMe(
                hidden
            );

        } else {

            /*
             * Local pending message:
             * remove it from the cache immediately.
             */
            messagesCache =
                messagesCache.filter(
                    m =>
                        m.local_id !==
                        msg.local_id
                );

            saveLocalCache(
                messagesCache
            );

        }

    } else {

        msg.is_deleted_for_everyone =
            true;

    }

    renderMessages(
        messagesCache
    );

    showUndoBanner(
        10,
        async () => {

            if (
                scope === 'everyone' &&
                msg.id
            ) {

                /*
                 * Only attempt deletion if the column exists.
                 *
                 * If the current table does not contain this column,
                 * the original message remains untouched rather than
                 * breaking the chat.
                 */
                const result =
                    await supabaseClient
                        .from('messages')
                        .update({
                            content:
                                '[Message deleted]'
                        })
                        .eq(
                            'id',
                            msg.id
                        );

                if (result.error) {

                    console.error(
                        'Delete-for-everyone update failed:',
                        result.error
                    );

                }

            }

            await fetchMessages();

        }
    );

}


function showUndoBanner(
    seconds,
    onComplete
) {

    const banner =
        document.getElementById(
            'undo-banner'
        );

    const countdown =
        document.getElementById(
            'undo-countdown'
        );

    banner.classList.remove(
        'hidden'
    );

    banner.classList.add(
        'flex'
    );

    let timeLeft =
        seconds;

    countdown.textContent =
        timeLeft;

    if (pendingDeleteTimer) {

        clearInterval(
            pendingDeleteTimer
        );

    }

    pendingDeleteTimer =
        setInterval(
            async () => {

                timeLeft--;

                countdown.textContent =
                    timeLeft;

                if (timeLeft <= 0) {

                    clearInterval(
                        pendingDeleteTimer
                    );

                    banner.classList.remove(
                        'flex'
                    );

                    banner.classList.add(
                        'hidden'
                    );

                    if (onComplete) {

                        await onComplete();

                    }

                }

            },
            1000
        );

}


function triggerUndoAction() {

    if (pendingDeleteTimer) {

        clearInterval(
            pendingDeleteTimer
        );

    }

    const banner =
        document.getElementById(
            'undo-banner'
        );

    banner.classList.remove(
        'flex'
    );

    banner.classList.add(
        'hidden'
    );

    if (!undoTargetMessage) {
        return;
    }

    const {
        msg,
        scope
    } = undoTargetMessage;

    if (scope === 'me') {

        if (msg.id) {

            let hidden =
                getDeletedForMe();

            hidden =
                hidden.filter(
                    id =>
                        id !== msg.id
                );

            saveDeletedForMe(
                hidden
            );

        } else {

            /*
             * Restore pending local message.
             */
            const exists =
                messagesCache.some(
                    m =>
                        m.local_id ===
                        msg.local_id
                );

            if (!exists) {

                messagesCache.push(
                    msg
                );

                saveLocalCache(
                    messagesCache
                );

            }

        }

    } else {

        msg.is_deleted_for_everyone =
            false;

    }

    renderMessages(
        messagesCache
    );

    undoTargetMessage = null;

}


/* ============================================================
   AUDIO CONTROLS
   ============================================================ */

function toggleAudioPlay(
    audioId,
    btn
) {

    const audio =
        document.getElementById(
            audioId
        );

    if (!audio) return;

    if (audio.paused) {

        audio.play()
            .then(
                () =>
                    btn.textContent = '⏸'
            )
            .catch(
                err =>
                    console.error(
                        'Audio playback failed:',
                        err
                    )
            );

    } else {

        audio.pause();

        btn.textContent =
            '▶';

    }

}


function seekAudio(
    audioId,
    value
) {

    const audio =
        document.getElementById(
            audioId
        );

    if (
        !audio ||
        !audio.duration
    ) {
        return;
    }

    audio.currentTime =
        (
            value / 100
        ) *
        audio.duration;

}


function toggleAudioSpeed(
    audioId,
    speedBtn
) {

    const audio =
        document.getElementById(
            audioId
        );

    if (!audio) return;

    let nextRate =
        audio.playbackRate === 1
            ? 1.5
            : audio.playbackRate === 1.5
                ? 2
                : 1;

    audio.playbackRate =
        nextRate;

    speedBtn.textContent =
        nextRate + 'x';

}


function formatAudioTime(
    secs
) {

    if (isNaN(secs)) {
        return '0:00';
    }

    const mins =
        Math.floor(
            secs / 60
        );

    const rSecs =
        Math.floor(
            secs % 60
        );

    return `${mins}:${rSecs < 10 ? '0' : ''}${rSecs}`;

}


/* ============================================================
   MEDIA GALLERY
   ============================================================ */

function openMediaGallery(
    typeFilter
) {

    const modal =
        document.getElementById(
            'media-gallery-modal'
        );

    const grid =
        document.getElementById(
            'gallery-content-grid'
        );

    const title =
        document.getElementById(
            'gallery-title'
        );

    modal.classList.remove(
        'hidden'
    );

    modal.classList.add(
        'flex'
    );

    grid.innerHTML = '';

    title.textContent =
        `Chat ${typeFilter.toUpperCase()} Gallery`;

    const matching =
        messagesCache
            .map(decodePrivateMessage)
            .filter(
                m => {

                    if (
                        m.is_deleted_for_everyone
                    ) {
                        return false;
                    }

                    if (
                        typeFilter === 'image' &&
                        m.media_type === 'image'
                    ) {
                        return true;
                    }

                    if (
                        typeFilter === 'video' &&
                        m.media_type === 'video'
                    ) {
                        return true;
                    }

                    if (
                        typeFilter === 'file' &&
                        (
                            m.media_type === 'file' ||
                            m.media_type === 'audio'
                        )
                    ) {
                        return true;
                    }

                    return false;

                }
            );

    if (matching.length === 0) {

        grid.innerHTML =
            `<span class="text-xs text-slate-500 col-span-2 text-center py-6">
                No ${typeFilter}s found in this chat.
            </span>`;

        return;

    }

    matching.forEach(
        m => {

            const url =
                m.media_url ||
                m.message;

            const card =
                document.createElement(
                    'div'
                );

            card.className =
                'bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col items-center justify-center gap-2';

            if (
                m.media_type === 'image'
            ) {

                card.innerHTML =
                    `<img
                        src="${escapeAttribute(url)}"
                        class="h-24 w-full object-cover rounded cursor-pointer"
                        onclick="window.open('${escapeAttribute(url)}', '_blank')">`;

            } else if (
                m.media_type === 'video'
            ) {

                card.innerHTML =
                    `<video
                        src="${escapeAttribute(url)}"
                        class="h-24 w-full rounded object-cover"
                        controls>
                    </video>`;

            } else {

                card.innerHTML =
                    `<a
                        href="${escapeAttribute(url)}"
                        download
                        target="_blank"
                        class="text-xs text-orange-400 underline font-semibold py-4">
                        Download ${escapeHtml(
                            m.media_type ||
                            'File'
                        )}
                    </a>`;

            }

            grid.appendChild(
                card
            );

        }
    );

}


function closeMediaGallery() {

    const modal =
        document.getElementById(
            'media-gallery-modal'
        );

    modal.classList.remove(
        'flex'
    );

    modal.classList.add(
        'hidden'
    );

}


/* ============================================================
   REALTIME
   ============================================================ */

function subscribeToPrivateMessages() {

    if (
        !supabaseClient ||
        !navigator.onLine
    ) {
        return;
    }

    if (messageSubscription) {

        try {

            supabaseClient.removeChannel(
                messageSubscription
            );

        } catch (e) {}

    }

    /*
     * No filter is used here because we need to handle both
     * directions of the private conversation.
     */
    messageSubscription =
        supabaseClient
            .channel(
                `private_chat_${currentUser.username}_${targetUsername}_${Date.now()}`
            )
            .on(
                'postgres_changes',
                {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages'
                },
                payload => {

                    const msg =
                        payload.new;

                    if (!msg) {
                        return;
                    }

                    const belongsToChat =
                        (
                            msg.sender_username ===
                                currentUser.username &&
                            msg.receiver_username ===
                                targetUsername
                        ) ||
                        (
                            msg.sender_username ===
                                targetUsername &&
                            msg.receiver_username ===
                                currentUser.username
                        );

                    if (!belongsToChat) {
                        return;
                    }

                    /*
                     * Refresh authoritative DB state.
                     *
                     * This is what removes the local clock
                     * after successful delivery.
                     */
                    fetchMessages();

                }
            )
            .subscribe(
                status => {

                    console.log(
                        'Private chat realtime status:',
                        status
                    );

                }
            );

}


/* ============================================================
   SECURITY / HTML HELPERS
   ============================================================ */

function escapeHtml(text) {

    if (
        text === null ||
        text === undefined
    ) {
        return '';
    }

    const value =
        String(text);

    const map = {

        '&': '&amp;',

        '<': '&lt;',

        '>': '&gt;',

        '"': '&quot;',

        "'": '&#039;'

    };

    return value.replace(
        /[&<>"']/g,
        m => map[m]
    );

}


function escapeAttribute(text) {

    if (
        text === null ||
        text === undefined
    ) {
        return '';
    }

    return String(text)
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        );

}


/* ============================================================
   CLEANUP
   ============================================================ */

window.addEventListener(
    'beforeunload',
    () => {

        if (messageSubscription) {

            try {

                supabaseClient.removeChannel(
                    messageSubscription
                );

            } catch (e) {}

        }

        if (mediaRecorder) {

            try {

                if (
                    mediaRecorder.state !==
                    'inactive'
                ) {

                    mediaRecorder.stop();

                }

            } catch (e) {}

        }

    }
);


/* ============================================================
   START QUEUE RETRY
   ============================================================ */

if (
    navigator.onLine &&
    getOfflineQueue().length > 0
) {

    setTimeout(
        () => {

            flushOfflineQueue();

        },
        500
    );

}
