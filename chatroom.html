<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
html, body {
    height: 100%;
    height: 100dvh;
    margin: 0;
    background: #f1f5f9;
    font-family: Arial, sans-serif;
    overflow: hidden;
}
* {
    box-sizing: border-box;
}
.app-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    background: #ffffff;
}
#messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    space-y: 12px;
    background: #f8fafc;
}
.message-bubble {
    word-break: break-word;
    overflow-wrap: anywhere;
    max-width: min(85%, 520px);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}
.message-image, .message-video {
    max-width: 260px;
    max-height: 320px;
    border-radius: 12px;
    object-fit: cover;
    display: block;
}
.message-audio {
    width: 240px;
    max-width: 100%;
}
.reply-quote {
    border-left: 3px solid #6366f1;
    background: rgba(99, 102, 241, 0.08);
}
.recording-pulse {
    animation: pulse 1s infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .45; }
}
</style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="bg-white border-b px-4 py-3 flex items-center gap-3 shrink-0">
            <button onclick="goBack()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-xl">
                ←
            </button>
            <div id="target-avatar" class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">
                ?
            </div>
            <div class="flex-1 min-w-0">
                <div id="target-name" class="font-semibold truncate text-sm">Chat</div>
                <div id="target-info" class="text-xs text-slate-500 truncate"></div>
            </div>
            <button onclick="toggleSearch()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-sm">
                🔍
            </button>
        </header>

        <!-- SEARCH -->
        <div id="search-bar" class="hidden bg-white border-b px-4 py-2 shrink-0">
            <input id="search-input" type="text" placeholder="Search messages..." class="w-full border rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-200" oninput="renderMessages()">
        </div>

        <!-- MESSAGES -->
        <main id="messages" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Messages injected dynamically -->
        </main>

        <!-- LOADING -->
        <div id="loading-message" class="hidden text-center text-xs text-slate-400 py-2 shrink-0">
            Loading messages...
        </div>

        <!-- REPLY PREVIEW -->
        <div id="reply-preview" class="hidden bg-slate-50 border-t px-4 py-2 shrink-0">
            <div class="flex items-center gap-3">
                <div class="flex-1 min-w-0">
                    <div class="text-xs font-semibold text-indigo-600">Replying to <span id="reply-name"></span></div>
                    <div id="reply-text" class="text-xs text-slate-500 truncate"></div>
                </div>
                <button onclick="cancelReply()" class="w-7 h-7 rounded-full hover:bg-slate-200 text-xs">✕</button>
            </div>
        </div>

        <!-- MEDIA PREVIEW -->
        <div id="media-preview" class="hidden bg-slate-50 border-t px-4 py-2 shrink-0">
            <div class="flex items-center gap-3">
                <div id="media-preview-content" class="w-12 h-12 rounded-lg bg-slate-200 overflow-hidden flex items-center justify-center"></div>
                <div class="flex-1 min-w-0">
                    <div class="font-medium text-xs truncate" id="media-file-name"></div>
                    <div class="text-[10px] text-slate-400" id="media-file-type"></div>
                </div>
                <button onclick="cancelMedia()" class="w-7 h-7 rounded-full hover:bg-slate-200 text-xs">✕</button>
            </div>
        </div>

        <!-- RECORDING BAR -->
        <div id="recording-bar" class="hidden bg-red-50 border-t px-4 py-3 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-red-500 recording-pulse"></div>
                <div class="flex-1">
                    <div class="font-semibold text-xs text-red-600">Recording voice note...</div>
                    <div id="recording-time" class="text-[10px] text-slate-500">00:00</div>
                </div>
                <button onclick="stopRecording()" class="px-3 py-1.5 rounded-lg bg-red-500 text-white text-xs">Stop & Send</button>
            </div>
        </div>

        <!-- COMPOSER -->
        <form id="message-form" class="bg-white border-t px-4 py-3 flex items-center gap-2 shrink-0">
            <button type="button" onclick="openImagePicker()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-lg shrink-0">
                📎
            </button>
            <input id="message-input" type="text" autocomplete="off" placeholder="Type a message..." class="flex-1 min-w-0 border rounded-full px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-200 bg-slate-50">
            <button type="button" onclick="startRecording()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-lg shrink-0">
                🎙️
            </button>
            <button type="submit" class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center shrink-0">
                ➤
            </button>
        </form>
    </div>

    <!-- HIDDEN INPUT -->
    <input id="image-input" type="file" accept="image/*,video/*,.pdf,.doc,.docx" class="hidden" onchange="stageSelectedFile(this.files[0])">

    <script>
    const currentUser = JSON.parse(localStorage.getItem('chatlite_user') || 'null');
    const params = new URLSearchParams(window.location.search);
    const targetUsername = decodeURIComponent(params.get('to') || '');
    const targetName = decodeURIComponent(params.get('name') || targetUsername || 'Chat');
    const targetGender = decodeURIComponent(params.get('gender') || '');

    let messagesCache = [];
    let messageSubscription = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordedBlob = null;
    let isRecording = false;
    let recordingSeconds = 0;
    let recordingTimerInterval = null;
    let stagedPayload = null;
    let activeReplyMessage = null;

    document.addEventListener('DOMContentLoaded', initChat);

    async function initChat() {
        if (!currentUser || !currentUser.username || !targetUsername) {
            window.location.href = 'chatlist.html';
            return;
        }

        setupHeader();
        document.getElementById('message-form').addEventListener('submit', handleSend);

        await fetchPrivateMessages();
        subscribeToPrivateMessages();
    }

    function setupHeader() {
        document.getElementById('target-name').textContent = targetName;
        document.getElementById('target-info').textContent = '@' + targetUsername + (targetGender ? ' • ' + targetGender : '');
        document.getElementById('target-avatar').textContent = (targetName || targetUsername || '?').charAt(0).toUpperCase();
    }

    function goBack() {
        window.location.href = 'chatlist.html';
    }

    function toggleSearch() {
        document.getElementById('search-bar').classList.toggle('hidden');
    }

    function openImagePicker() {
        document.getElementById('image-input').click();
    }

    function stageSelectedFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            let type = 'file';
            if (file.type.startsWith('image/')) type = 'image';
            else if (file.type.startsWith('video/')) type = 'video';

            stagedPayload = { type, content: event.target.result, fileName: file.name };
            showMediaPreview();
        };
        reader.readAsDataURL(file);
    }

    function showMediaPreview() {
        if (!stagedPayload) return;
        const preview = document.getElementById('media-preview');
        document.getElementById('media-file-name').textContent = stagedPayload.fileName;
        document.getElementById('media-file-type').textContent = stagedPayload.type.toUpperCase();
        preview.classList.remove('hidden');
    }

    function cancelMedia() {
        stagedPayload = null;
        document.getElementById('media-preview').classList.add('hidden');
    }

    async function startRecording() {
        if (isRecording) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = async () => {
                recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
                stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                clearInterval(recordingTimerInterval);
                document.getElementById('recording-bar').classList.add('hidden');
                
                const reader = new FileReader();
                reader.onload = async function(e) {
                    await sendPrivatePayload({ type: 'audio', content: e.target.result, fileName: 'voice.webm' });
                };
                reader.readAsDataURL(recordedBlob);
            };

            mediaRecorder.start();
            isRecording = true;
            recordingSeconds = 0;
            document.getElementById('recording-bar').classList.remove('hidden');
            recordingTimerInterval = setInterval(() => {
                recordingSeconds++;
                const m = Math.floor(recordingSeconds / 60).toString().padStart(2, '0');
                const s = (recordingSeconds % 60).toString().padStart(2, '0');
                document.getElementById('recording-time').textContent = `${m}:${s}`;
            }, 1000);
        } catch (err) {
            alert('Microphone access is blocked or unavailable.');
        }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording) mediaRecorder.stop();
    }

    async function handleSend(e) {
        e.preventDefault();
        if (stagedPayload) {
            const payload = stagedPayload;
            cancelMedia();
            await sendPrivatePayload(payload);
            return;
        }

        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        
        const payload = { type: 'text', content: text };
        await sendPrivatePayload(payload);
    }

    async function sendPrivatePayload(payload) {
        if (!supabaseClient) return;

        const messageData = {
            sender_username: currentUser.username,
            receiver_username: targetUsername,
            content: JSON.stringify(payload)
        };

        // Instantly push to local array for fluid UI rendering
        const tempId = 'temp_' + Date.now();
        messagesCache.push({
            ...messageData,
            id: tempId,
            created_at: new Date().toISOString()
        });
        renderMessages();

        // Ask Supabase to return the inserted row so we can reconcile it
        // with our optimistic temp entry, instead of re-fetching and
        // wholesale-replacing messagesCache (which can race with
        // replication/realtime and make the message briefly vanish).
        const { data, error } = await supabaseClient
            .from('messages')
            .insert(messageData)
            .select()
            .single();

        if (error) {
            alert('Error sending message: ' + error.message);
            // Remove the failed optimistic message so the UI doesn't lie
            messagesCache = messagesCache.filter(m => m.id !== tempId);
            renderMessages();
        } else if (data) {
            reconcileMessage(tempId, data);
        }
    }

    // Replace a temp/optimistic message with the confirmed server row,
    // or add the server row if the temp one is no longer present
    // (e.g. it already arrived via the realtime subscription).
    function reconcileMessage(tempId, realMsg) {
        const idx = messagesCache.findIndex(m => m.id === tempId);
        if (idx !== -1) {
            messagesCache[idx] = realMsg;
        } else if (!messagesCache.some(m => m.id === realMsg.id)) {
            messagesCache.push(realMsg);
        }
        renderMessages();
    }

    async function fetchPrivateMessages() {
        if (!supabaseClient) return;
        
        const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .or(`and(sender_username.eq.${currentUser.username},receiver_username.eq.${targetUsername}),and(sender_username.eq.${targetUsername},receiver_username.eq.${currentUser.username})`)
            .order('created_at', { ascending: true });

        if (!error && data) {
            messagesCache = data;
            renderMessages();
        }
    }

    function renderMessages() {
        const container = document.getElementById('messages');
        const search = (document.getElementById('search-input')?.value || '').toLowerCase();
        container.innerHTML = '';

        if (!messagesCache.length) {
            container.innerHTML = `<div class="text-center text-slate-400 text-xs py-8">No messages here yet. Say hello!</div>`;
            return;
        }

        messagesCache.forEach(msg => {
            let parsed = msg.content;
            try {
                if (typeof msg.content === 'string' && msg.content.startsWith('{')) {
                    parsed = JSON.parse(msg.content);
                }
            } catch (e) {}

            const textVal = (typeof parsed === 'object' && parsed !== null)
                ? (parsed.type === 'text' ? (parsed.content || '') : '')
                : (parsed || '');
            if (search && !String(textVal).toLowerCase().includes(search)) return;

            const isMine = msg.sender_username === currentUser.username;
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${isMine ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `message-bubble rounded-2xl px-3.5 py-2 text-sm ${
                isMine ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-white border text-slate-800 rounded-bl-sm'
            }`;

            if (typeof parsed === 'object' && parsed !== null) {
                if (parsed.type === 'image') {
                    const img = document.createElement('img');
                    img.src = parsed.content;
                    img.className = 'message-image mb-1';
                    bubble.appendChild(img);
                } else if (parsed.type === 'audio') {
                    const aud = document.createElement('audio');
                    aud.src = parsed.content;
                    aud.controls = true;
                    aud.className = 'message-audio mb-1';
                    bubble.appendChild(aud);
                } else {
                    const t = document.createElement('div');
                    t.textContent = parsed.content;
                    bubble.appendChild(t);
                }
            } else {
                const t = document.createElement('div');
                t.textContent = parsed;
                bubble.appendChild(t);
            }

            const time = document.createElement('div');
            time.className = `text-[9px] mt-1 text-right ${isMine ? 'text-indigo-200' : 'text-slate-400'}`;
            time.textContent = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            bubble.appendChild(time);

            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
        });

        container.scrollTop = container.scrollHeight;
    }

    function subscribeToPrivateMessages() {
        if (!supabaseClient) return;
        if (messageSubscription) supabaseClient.removeChannel(messageSubscription);

        messageSubscription = supabaseClient
            .channel('public:messages:private')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                const newMsg = payload.new;
                const relevant = (newMsg.sender_username === currentUser.username && newMsg.receiver_username === targetUsername) ||
                                 (newMsg.sender_username === targetUsername && newMsg.receiver_username === currentUser.username);
                if (relevant && !messagesCache.some(m => m.id === newMsg.id)) {
                    messagesCache.push(newMsg);
                    renderMessages();
                }
            })
            .subscribe();
    }
    </script>
</body>
</html>
