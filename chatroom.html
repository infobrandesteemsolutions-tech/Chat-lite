                                msg.content
                            );

                        } catch (e) {}

                        closeMessageOptions();
                    };

                actionsContainer.appendChild(
                    copyBtn
                );
            }


            const forwardBtn =
                document.createElement(
                    'button'
                );

            forwardBtn.className =
                'w-full text-left px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-800 rounded-xl transition-all cursor-pointer';

            forwardBtn.textContent =
                '↗️ Forward';

            forwardBtn.onclick =
                () => {

                    closeMessageOptions();

                    localStorage.setItem(
                        'chatlite_forward_payload',
                        JSON.stringify({
                            content:
                                msg.content,

                            type:
                                msgType
                        })
                    );

                    window.location.href =
                        'chatlist.html?forward=true';
                };

            actionsContainer.appendChild(
                forwardBtn
            );


            const deleteForMeBtn =
                document.createElement(
                    'button'
                );

            deleteForMeBtn.className =
                'w-full text-left px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-800 rounded-xl transition-all cursor-pointer';

            deleteForMeBtn.textContent =
                '🗑️ Only me';

            deleteForMeBtn.onclick =
                () => {

                    closeMessageOptions();

                    executeDeleteMessage(
                        msg,
                        'me'
                    );
                };

            actionsContainer.appendChild(
                deleteForMeBtn
            );


            if (
                isSender &&
                within3Hours
            ) {

                const deleteForEveryoneBtn =
                    document.createElement(
                        'button'
                    );

                deleteForEveryoneBtn.className =
                    'w-full text-left px-3 py-2 text-xs font-medium text-red-400 hover:bg-slate-800 rounded-xl transition-all cursor-pointer';

                deleteForEveryoneBtn.textContent =
                    '🗑️ Delete for everyone';

                deleteForEveryoneBtn.onclick =
                    () => {

                        closeMessageOptions();

                        executeDeleteMessage(
                            msg,
                            'everyone'
                        );
                    };

                actionsContainer.appendChild(
                    deleteForEveryoneBtn
                );
            }


            modal.classList.remove(
                'hidden'
            );

            modal.classList.add(
                'flex'
            );
        }


        function closeMessageOptions() {

            const modal =
                document.getElementById(
                    'message-options-modal'
                );

            modal.classList.remove(
                'flex'
            );

            modal.classList.add(
                'hidden'
            );
        }


        /* =========================================================
           DELETE
        ========================================================= */

        function executeDeleteMessage(
            msg,
            scope
        ) {

            undoTargetMessage = {
                msg,
                scope
            };


            if (scope === 'me') {

                let hiddenForMe = [];

                try {

                    hiddenForMe =
                        JSON.parse(
                            localStorage.getItem(
                                `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`
                            ) || '[]'
                        );

                } catch (e) {}


                if (
                    !hiddenForMe.includes(
                        msg.id
                    )
                ) {

                    hiddenForMe.push(
                        msg.id
                    );
                }


                localStorage.setItem(
                    `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`,
                    JSON.stringify(hiddenForMe)
                );

            } else {

                msg.is_deleted_for_everyone =
                    true;
            }


            renderMessages(
                messagesCache
            );


            showUndoBanner(
                10,
                async () => {

                    if (
                        scope === 'everyone' &&
                        msg.id
                    ) {

                        await supabaseClient
                            .from('messages')
                            .update({
                                is_deleted_for_everyone: true,
                                content: '[Message deleted]',
                                message_type: 'text'
                            })
                            .eq(
                                'id',
                                msg.id
                            );
                    }

                    await fetchMessages();
                }
            );
        }


        function showUndoBanner(
            seconds,
            onComplete
        ) {

            const banner =
                document.getElementById(
                    'undo-banner'
                );

            const countdownEl =
                document.getElementById(
                    'undo-countdown'
                );

            banner.classList.remove(
                'hidden'
            );

            banner.classList.add(
                'flex'
            );


            let timeLeft =
                seconds;

            countdownEl.textContent =
                timeLeft;


            if (pendingDeleteTimer) {

                clearInterval(
                    pendingDeleteTimer
                );
            }


            pendingDeleteTimer =
                setInterval(
                    () => {

                        timeLeft--;

                        countdownEl.textContent =
                            timeLeft;

                        if (
                            timeLeft <= 0
                        ) {

                            clearInterval(
                                pendingDeleteTimer
                            );

                            banner.classList.remove(
                                'flex'
                            );

                            banner.classList.add(
                                'hidden'
                            );

                            if (onComplete) {
                                onComplete();
                            }
                        }

                    },
                    1000
                );
        }


        function triggerUndoAction() {

            if (pendingDeleteTimer) {

                clearInterval(
                    pendingDeleteTimer
                );
            }


            const banner =
                document.getElementById(
                    'undo-banner'
                );

            banner.classList.remove(
                'flex'
            );

            banner.classList.add(
                'hidden'
            );


            if (!undoTargetMessage) {
                return;
            }


            const {
                msg,
                scope
            } = undoTargetMessage;


            if (scope === 'me') {

                let hiddenForMe = [];

                try {

                    hiddenForMe =
                        JSON.parse(
                            localStorage.getItem(
                                `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`
                            ) || '[]'
                        );

                } catch (e) {}


                hiddenForMe =
                    hiddenForMe.filter(
                        id =>
                            id !== msg.id
                    );


                localStorage.setItem(
                    `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`,
                    JSON.stringify(hiddenForMe)
                );

            } else {

                msg.is_deleted_for_everyone =
                    false;
            }


            renderMessages(
                messagesCache
            );

            undoTargetMessage = null;
        }


        /* =========================================================
           FILE / MEDIA STAGING
        ========================================================= */

        function stageFileSelected(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }


            const reader =
                new FileReader();

            const progressBar =
                document.getElementById(
                    'upload-progress-bar'
                );

            const statusText =
                document.getElementById(
                    'upload-status-text'
                );


            document
                .getElementById(
                    'media-preview-bar'
                )
                .classList.remove(
                    'hidden'
                );

            document
                .getElementById(
                    'media-preview-bar'
                )
                .classList.add(
                    'flex'
                );


            progressBar.style.width =
                '10%';

            statusText.textContent =
                'Reading file stream...';


            reader.onprogress =
                (data) => {

                    if (
                        data.lengthComputable
                    ) {

                        const percent =
                            Math.round(
                                (
                                    data.loaded /
                                    data.total
                                ) * 90
                            );

                        progressBar.style.width =
                            percent + '%';
                    }
                };


            reader.onload =
                function(e) {

                    progressBar.style.width =
                        '100%';

                    statusText.textContent =
                        'Ready! Hit the Send button to dispatch.';


                    let type =
                        'file';

                    if (
                        file.type.startsWith(
                            'image/'
                        )
                    ) {

                        type =
                            'image';

                    } else if (
                        file.type.startsWith(
                            'video/'
                        )
                    ) {

                        type =
                            'video';

                    } else if (
                        file.type.startsWith(
                            'audio/'
                        )
                    ) {

                        type =
                            'audio';
                    }


                    stagedPayload = {

                        content:
                            e.target.result,

                        type:
                            type,

                        fileName:
                            file.name
                    };


                    const previewContainer =
                        document.getElementById(
                            'preview-container'
                        );


                    if (type === 'image') {

                        previewContainer.innerHTML =
                            `<img src="${escapeAttribute(e.target.result)}" class="max-h-20 rounded object-contain">`;

                    } else if (type === 'video') {

                        previewContainer.innerHTML =
                            `<video src="${escapeAttribute(e.target.result)}" class="max-h-20 rounded" controls></video>`;

                    } else {

                        previewContainer.textContent =
                            `Staged File: ${file.name}`;
                    }
                };


            reader.readAsDataURL(
                file
            );
        }


        function clearStagedMedia() {

            stagedPayload = null;

            recordedBlob = null;

            document
                .getElementById(
                    'media-preview-bar'
                )
                .classList.add(
                    'hidden'
                );

            document
                .getElementById(
                    'media-preview-bar'
                )
                .classList.remove(
                    'flex'
                );

            document
                .getElementById(
                    'upload-progress-bar'
                )
                .style.width =
                '0%';

            document
                .getElementById(
                    'media-file-input'
                )
                .value = '';

            document
                .getElementById(
                    'camera-photo-input'
                )
                .value = '';

            document
                .getElementById(
                    'camera-video-input'
                )
                .value = '';
        }


        /* =========================================================
           VOICE RECORDING
        ========================================================= */

        async function startVoiceRecording() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });


                mediaRecorder =
                    new MediaRecorder(
                        stream
                    );

                audioChunks = [];


                mediaRecorder.ondataavailable =
                    e => {

                        audioChunks.push(
                            e.data
                        );
                    };


                mediaRecorder.onstop =
                    () => {

                        recordedBlob =
                            new Blob(
                                audioChunks,
                                {
                                    type: 'audio/webm'
                                }
                            );
                    };


                mediaRecorder.start();

                isRecording = true;

                isPaused = false;

                recordedBlob = null;


                document
                    .getElementById(
                        'message-input'
                    )
                    .classList.add(
                        'hidden'
                    );

                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.add(
                        'flex'
                    );

                document
                    .getElementById(
                        'mic-btn'
                    )
                    .classList.add(
                        'hidden'
                    );


                recordingSeconds = 0;

                document
                    .getElementById(
                        'recording-timer'
                    )
                    .textContent =
                    '0:00';


                recordingTimerInterval =
                    setInterval(
                        () => {

                            if (!isPaused) {

                                recordingSeconds++;

                                const m =
                                    Math.floor(
                                        recordingSeconds /
                                        60
                                    );

                                const s =
                                    recordingSeconds %
                                    60;

                                document
                                    .getElementById(
                                        'recording-timer'
                                    )
                                    .textContent =
                                    `${m}:${s < 10 ? '0' : ''}${s}`;
                            }

                        },
                        1000
                    );

            } catch (err) {

                alert(
                    'Microphone access denied or unavailable.'
                );
            }
        }


        function togglePauseRecording() {

            if (!mediaRecorder) {
                return;
            }

            const btn =
                document.getElementById(
                    'pause-rec-btn'
                );


            if (!isPaused) {

                mediaRecorder.pause();

                isPaused = true;

                btn.textContent =
                    '▶ Resume';

            } else {

                mediaRecorder.resume();

                isPaused = false;

                btn.textContent =
                    '⏸ Pause';
            }
        }


        function stopRecordingOnly() {

            if (
                mediaRecorder &&
                (
                    isRecording ||
                    isPaused
                )
            ) {

                if (
                    mediaRecorder.state !==
                    'inactive'
                ) {

                    mediaRecorder.stop();
                }

                isRecording = false;

                isPaused = false;

                clearInterval(
                    recordingTimerInterval
                );


                if (mediaRecorder.stream) {

                    mediaRecorder.stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );
                }


                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.add(
                        'hidden'
                    );

                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.remove(
                        'flex'
                    );

                document
                    .getElementById(
                        'message-input'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'mic-btn'
                    )
                    .classList.remove(
                        'hidden'
                    );


                document
                    .getElementById(
                        'media-preview-bar'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'media-preview-bar'
                    )
                    .classList.add(
                        'flex'
                    );


                document
                    .getElementById(
                        'preview-container'
                    )
                    .textContent =
                    `Voice Note Recorded (${recordingSeconds}s). Ready to Send.`;


                document
                    .getElementById(
                        'upload-progress-bar'
                    )
                    .style.width =
                    '100%';


                document
                    .getElementById(
                        'upload-status-text'
                    )
                    .textContent =
                    'Hit the Send button to dispatch voice note.';
            }
        }


        function cancelRecording() {

            if (
                mediaRecorder &&
                (
                    isRecording ||
                    isPaused
                )
            ) {

                if (
                    mediaRecorder.state !==
                    'inactive'
                ) {

                    mediaRecorder.stop();
                }

                if (mediaRecorder.stream) {

                    mediaRecorder.stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );
                }
            }

            resetRecordingUI();

            clearStagedMedia();
        }


        function resetRecordingUI() {

            clearInterval(
                recordingTimerInterval
            );

            isRecording = false;

            isPaused = false;

            document
                .getElementById(
                    'recording-ui'
                )
                .classList.add(
                    'hidden'
                );

            document
                .getElementById(
                    'recording-ui'
                )
                .classList.remove(
                    'flex'
                );

            document
                .getElementById(
                    'message-input'
                )
                .classList.remove(
                    'hidden'
                );

            document
                .getElementById(
                    'mic-btn'
                )
                .classList.remove(
                    'hidden'
                );
        }


        /* =========================================================
           FORM SUBMIT
        ========================================================= */

        async function handleFormSubmit(e) {

            e.preventDefault();


            if (isRecording) {

                stopRecordingOnly();

                return;
            }


            let replyMeta = null;


            if (replyingToMessage) {

                const repType =
                    replyingToMessage.message_type ||
                    'text';

                replyMeta = {

                    sender:
                        replyingToMessage.sender_username ===
                        currentUser.username
                            ? 'You'
                            : targetName ||
                              targetUsername,

                    content:
                        repType === 'text'
                            ? replyingToMessage.content
                            : `[${repType}]`
                };
            }


            if (recordedBlob) {

                const blobToSend =
                    recordedBlob;

                recordedBlob = null;

                const reader =
                    new FileReader();

                reader.readAsDataURL(
                    blobToSend
                );

                reader.onloadend =
                    async () => {

                        await sendPayloadToSupabase(
                            reader.result,
                            'audio',
                            replyMeta
                        );

                        resetRecordingUI();

                        clearStagedMedia();

                        cancelReply();
                    };

                return;
            }


            if (stagedPayload) {

                const payloadToSend =
                    stagedPayload;

                stagedPayload = null;

                await sendPayloadToSupabase(
                    payloadToSend.content,
                    payloadToSend.type,
                    replyMeta
                );

                clearStagedMedia();

                cancelReply();

                return;
            }


            const input =
                document.getElementById(
                    'message-input'
                );

            const content =
                input.value.trim();

            if (!content) {
                return;
            }


            input.value = '';


            await sendPayloadToSupabase(
                content,
                'text',
                replyMeta
            );

            cancelReply();
        }


        /* =========================================================
           AUDIO
        ========================================================= */

        function toggleAudioPlay(
            audioId,
            btn
        ) {

            const audio =
                document.getElementById(
                    audioId
                );

            if (!audio) {
                return;
            }


            if (audio.paused) {

                audio.play();

                btn.textContent =
                    '⏸';

            } else {

                audio.pause();

                btn.textContent =
                    '▶';
            }
        }


        function seekAudio(
            audioId,
            value
        ) {

            const audio =
                document.getElementById(
                    audioId
                );

            if (
                !audio ||
                !audio.duration
            ) {
                return;
            }

            audio.currentTime =
                (
                    value /
                    100
                ) *
                audio.duration;
        }


        function toggleAudioSpeed(
            audioId,
            speedBtn
        ) {

            const audio =
                document.getElementById(
                    audioId
                );

            if (!audio) {
                return;
            }

            const nextRate =
                audio.playbackRate === 1
                    ? 1.5
                    : audio.playbackRate === 1.5
                        ? 2
                        : 1;

            audio.playbackRate =
                nextRate;

            speedBtn.textContent =
                nextRate + 'x';
        }


        function formatAudioTime(secs) {

            if (isNaN(secs)) {
                return '0:00';
            }

            const mins =
                Math.floor(
                    secs / 60
                );

            const rSecs =
                Math.floor(
                    secs % 60
                );

            return `${mins}:${rSecs < 10 ? '0' : ''}${rSecs}`;
        }


        /* =========================================================
           MEDIA GALLERY
        ========================================================= */

        function openMediaGallery(
            typeFilter
        ) {

            const modal =
                document.getElementById(
                    'media-gallery-modal'
                );

            const grid =
                document.getElementById(
                    'gallery-content-grid'
                );

            const title =
                document.getElementById(
                    'gallery-title'
                );


            modal.classList.remove(
                'hidden'
            );

            modal.classList.add(
                'flex'
            );


            grid.innerHTML = '';


            title.textContent =
                `${typeFilter.toUpperCase()} Gallery`;


            const matching =
                messagesCache.filter(
                    m => {

                        if (
                            m.is_deleted_for_everyone
                        ) {
                            return false;
                        }

                        const mType =
                            m.message_type ||
                            'text';


                        if (
                            typeFilter === 'image' &&
                            mType === 'image'
                        ) {
                            return true;
                        }

                        if (
                            typeFilter === 'video' &&
                            mType === 'video'
                        ) {
                            return true;
                        }

                        if (
                            typeFilter === 'file' &&
                            (
                                mType === 'file' ||
                                mType === 'audio'
                            )
                        ) {
                            return true;
                        }

                        return false;
                    }
                );


            if (
                matching.length === 0
            ) {

                grid.innerHTML = `
                    <span class="text-xs text-slate-500 col-span-2 text-center py-6">
                        No ${typeFilter}s found in this chat.
                    </span>
                `;

                return;
            }


            matching.forEach(
                m => {

                    const card =
                        document.createElement(
                            'div'
                        );

                    card.className =
                        'bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col items-center justify-center gap-2';


                    const mType =
                        m.message_type ||
                        'text';

                    const url =
                        m.content ||
                        '';


                    if (
                        mType === 'image'
                    ) {

                        const img =
                            document.createElement(
                                'img'
                            );

                        img.src =
                            url;

                        img.className =
                            'h-24 w-full object-cover rounded cursor-pointer';

                        img.onclick =
                            () => window.open(
                                url,
                                '_blank'
                            );

                        card.appendChild(
                            img
                        );


                    } else if (
                        mType === 'video'
                    ) {

                        const video =
                            document.createElement(
                                'video'
                            );

                        video.src =
                            url;

                        video.controls =
                            true;

                        video.className =
                            'h-24 w-full rounded object-cover';

                        card.appendChild(
                            video
                        );


                    } else {

                        const link =
                            document.createElement(
                                'a'
                            );

                        link.href =
                            url;

                        link.download =
                            'file';

                        link.className =
                            'text-xs text-indigo-400 underline font-semibold py-4';

                        link.textContent =
                            `Download ${mType}`;

                        card.appendChild(
                            link
                        );
                    }


                    grid.appendChild(
                        card
                    );
                }
            );
        }


        function closeMediaGallery() {

            const modal =
                document.getElementById(
                    'media-gallery-modal'
                );

            modal.classList.remove(
                'flex'
            );

            modal.classList.add(
                'hidden'
            );
        }


        /* =========================================================
           REALTIME
        ========================================================= */

        function subscribeToMessages() {

            if (messageSubscription) {

                supabaseClient.removeChannel(
                    messageSubscription
                );
            }


            messageSubscription =
                supabaseClient
                    .channel(
                        `private_messages_${currentUser.username}_${targetUsername}`
                    )
                    .on(
                        'postgres_changes',
                        {
                            event: '*',
                            schema: 'public',
                            table: 'messages'
                        },
                        payload => {

                            const newMsg =
                                payload.new || {};

                            const relevant =
                                (
                                    newMsg.sender_username ===
                                    currentUser.username &&
                                    newMsg.receiver_username ===
                                    targetUsername
                                ) ||
                                (
                                    newMsg.sender_username ===
                                    targetUsername &&
                                    newMsg.receiver_username ===
                                    currentUser.username
                                );


                            if (relevant) {

                                fetchMessages();
                            }

                        }
                    )
                    .subscribe();
        }


        /* =========================================================
           HTML SAFETY
        ========================================================= */

        function escapeHtml(text) {

            if (
                text === null ||
                text === undefined
            ) {
                return '';
            }

            const map = {

                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };

            return String(text).replace(
                /[&<>"']/g,
                m => map[m]
            );
        }


        function escapeAttribute(text) {

            if (
                text === null ||
                text === undefined
            ) {
                return '';
            }

            return String(text)
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                );
        }

    </script>
