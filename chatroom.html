<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Private Conversation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col font-sans overflow-hidden m-0">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative shadow-2xl bg-slate-900 border-x border-slate-800 h-full overflow-hidden">

        <!-- HEADER -->
        <div class="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-900 z-20 flex-shrink-0">
            <div class="flex items-center gap-2.5 overflow-hidden">

                <button
                    onclick="window.location.href='chatlist.html'"
                    class="text-slate-400 hover:text-white text-sm cursor-pointer px-1">
                    &larr;
                </button>

                <div
                    class="w-8 h-8 rounded-full bg-indigo-600/30 border border-indigo-500/30 flex items-center justify-center font-bold text-indigo-400 text-xs flex-shrink-0 overflow-hidden"
                    id="active-chat-avatar">
                    U
                </div>

                <div class="overflow-hidden">
                    <h3 class="font-bold text-xs truncate" id="active-chat-name">
                        Private Chat
                    </h3>

                    <span
                        class="text-[9px] text-slate-400 truncate block"
                        id="active-chat-members">
                        @username
                    </span>
                </div>
            </div>

            <!-- HEADER ACTIONS -->
            <div class="flex items-center gap-1 flex-shrink-0">

                <button
                    onclick="toggleSearchBox()"
                    class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer"
                    title="Search Keywords">
                    🔍
                </button>

                <button
                    onclick="openMediaGallery('file')"
                    class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer"
                    title="Files">
                    📁
                </button>

                <button
                    onclick="openMediaGallery('image')"
                    class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer"
                    title="Images">
                    🖼️
                </button>

                <button
                    onclick="openMediaGallery('video')"
                    class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer"
                    title="Videos">
                    🎬
                </button>

            </div>
        </div>

        <!-- SEARCH -->
        <div
            id="search-container"
            class="hidden p-2 bg-slate-950 border-b border-slate-800 flex items-center gap-2 z-20 flex-shrink-0">

            <input
                type="text"
                id="search-keyword-input"
                placeholder="Search this conversation..."
                oninput="filterMessages(this.value)"
                class="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-500">

            <button
                onclick="toggleSearchBox()"
                class="text-slate-400 hover:text-white text-xs px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                Close
            </button>
        </div>

        <!-- MESSAGES -->
        <div
            id="chat-messages"
            class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3 bg-slate-950 flex flex-col">
        </div>

        <!-- MULTI SELECT BAR -->
        <div
            id="multi-select-bar"
            class="hidden absolute bottom-0 left-0 right-0 bg-slate-900 border-t border-indigo-500/50 p-3 shadow-2xl z-40 items-center justify-between">

            <span
                id="selected-count-text"
                class="text-xs font-semibold text-indigo-300">
                0 selected
            </span>

            <div class="flex items-center gap-1.5">

                <button
                    type="button"
                    onclick="handleMultiSelectAction('everyone')"
                    class="px-2.5 py-1.5 bg-red-600/70 hover:bg-red-600 text-white text-[11px] font-bold rounded-lg cursor-pointer">
                    Delete for everyone
                </button>

                <button
                    type="button"
                    onclick="handleMultiSelectAction('me')"
                    class="px-2.5 py-1.5 bg-red-900/70 hover:bg-red-900 text-white text-[11px] font-bold rounded-lg cursor-pointer">
                    Only me
                </button>

                <button
                    type="button"
                    onclick="handleMultiSelectAction('forward')"
                    class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold rounded-lg cursor-pointer">
                    Forward
                </button>

                <button
                    type="button"
                    onclick="exitMultiSelectMode()"
                    class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold rounded-lg cursor-pointer">
                    &times;
                </button>

            </div>
        </div>

        <!-- UNDO -->
        <div
            id="undo-banner"
            class="hidden absolute bottom-20 left-4 right-4 bg-slate-800 border border-indigo-500/50 rounded-xl p-3 shadow-2xl z-50 items-center justify-between">

            <span
                id="undo-text"
                class="text-xs text-slate-200">
                Message deleted.
            </span>

            <button
                type="button"
                onclick="triggerUndoAction()"
                class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg cursor-pointer">
                Undo (<span id="undo-countdown">10</span>s)
            </button>
        </div>

        <!-- MESSAGE OPTIONS -->
        <div
            id="message-options-modal"
            class="hidden absolute inset-0 bg-slate-950/70 z-50 items-center justify-center p-4 backdrop-blur-xs">

            <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-3 shadow-2xl flex flex-col gap-2">

                <div class="text-xs font-bold text-slate-400 pb-2 border-b border-slate-800 flex justify-between items-center">

                    <span>Message Options</span>

                    <button
                        onclick="closeMessageOptions()"
                        class="text-slate-400 hover:text-white text-base cursor-pointer">
                        &times;
                    </button>

                </div>

                <div
                    id="message-options-actions"
                    class="flex flex-col gap-1.5">
                </div>

            </div>
        </div>

        <!-- REPLY PREVIEW -->
        <div
            id="reply-preview-bar"
            class="hidden p-2.5 bg-slate-900 border-t border-slate-800 items-center justify-between z-20 flex-shrink-0">

            <div class="flex flex-col border-l-2 border-indigo-500 pl-2 overflow-hidden">

                <span
                    class="text-[10px] font-bold text-indigo-400"
                    id="reply-target-sender">
                    Replying to...
                </span>

                <span
                    class="text-xs text-slate-300 truncate"
                    id="reply-target-content">
                    Message content...
                </span>

            </div>

            <button
                type="button"
                onclick="cancelReply()"
                class="text-slate-400 hover:text-white text-base px-2 cursor-pointer">
                &times;
            </button>

        </div>

        <!-- MEDIA PREVIEW -->
        <div
            id="media-preview-bar"
            class="hidden p-2.5 bg-slate-950 border-t border-slate-800 flex-col gap-1.5 z-20 flex-shrink-0">

            <div class="flex items-center justify-between">

                <span class="text-xs font-semibold text-indigo-400">
                    Staged Media Preview
                </span>

                <button
                    type="button"
                    onclick="clearStagedMedia()"
                    class="text-[11px] text-slate-400 hover:text-white px-2 py-0.5 bg-slate-800 rounded">
                    Discard
                </button>

            </div>

            <div
                id="preview-container"
                class="max-h-24 overflow-hidden rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center p-1.5 text-xs text-slate-300">
            </div>

            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                <div
                    id="upload-progress-bar"
                    class="bg-indigo-600 h-full w-0 transition-all duration-300">
                </div>
            </div>

            <span
                class="text-[10px] text-slate-400 text-center"
                id="upload-status-text">
                Ready. Hit Send button to upload & deliver.
            </span>

        </div>

        <!-- FILE INPUTS -->
        <input
            type="file"
            id="media-file-input"
            class="hidden"
            accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"
            onchange="stageFileSelected(event)">

        <input
            type="file"
            id="camera-photo-input"
            class="hidden"
            accept="image/*"
            capture="environment"
            onchange="stageFileSelected(event)">

        <input
            type="file"
            id="camera-video-input"
            class="hidden"
            accept="video/*"
            capture="environment"
            onchange="stageFileSelected(event)">

        <!-- ATTACHMENT MENU -->
        <div
            id="attachment-menu"
            class="hidden absolute bottom-16 left-3 bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-2 z-30 flex flex-col gap-1 w-48 backdrop-blur-md">

            <button
                type="button"
                onclick="document.getElementById('media-file-input').click(); toggleAttachmentMenu();"
                class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📁 File / Document
            </button>

            <button
                type="button"
                onclick="document.getElementById('camera-photo-input').click(); toggleAttachmentMenu();"
                class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📷 Take Photo
            </button>

            <button
                type="button"
                onclick="document.getElementById('camera-video-input').click(); toggleAttachmentMenu();"
                class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📹 Record Video Note
            </button>

        </div>

        <!-- MEDIA GALLERY -->
        <div
            id="media-gallery-modal"
            class="hidden absolute inset-0 bg-slate-950/90 z-40 flex-col p-4 backdrop-blur-sm">

            <div class="flex justify-between items-center pb-3 border-b border-slate-800">

                <h3
                    class="font-bold text-sm text-white"
                    id="gallery-title">
                    Private Media
                </h3>

                <button
                    onclick="closeMediaGallery()"
                    class="text-xs text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded-lg">
                    Close
                </button>

            </div>

            <div
                id="gallery-content-grid"
                class="flex-1 overflow-y-auto grid grid-cols-2 gap-2 pt-3">
            </div>

        </div>

        <!-- INPUT -->
        <form
            id="chat-form"
            onsubmit="handleFormSubmit(event)"
            class="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2 relative z-25 flex-shrink-0">

            <button
                type="button"
                id="attach-btn"
                onclick="toggleAttachmentMenu()"
                class="p-2 text-slate-400 hover:text-indigo-400 transition-colors text-lg font-bold cursor-pointer flex-shrink-0"
                title="Attach Media">
                +
            </button>

            <input
                type="text"
                id="message-input"
                placeholder="Type a message..."
                class="flex-1 px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-white min-w-0">

            <!-- RECORDING UI -->
            <div
                id="recording-ui"
                class="hidden flex-1 items-center justify-between px-3 py-2 bg-slate-950 border border-red-500/50 rounded-xl min-w-0">

                <div class="flex items-center gap-2">

                    <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse flex-shrink-0"></span>

                    <span
                        id="recording-timer"
                        class="text-xs font-semibold text-red-400">
                        0:00
                    </span>

                </div>

                <div class="flex items-center gap-1">

                    <button
                        type="button"
                        id="pause-rec-btn"
                        onclick="togglePauseRecording()"
                        class="text-[11px] text-slate-300 hover:text-white px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                        ⏸ Pause
                    </button>

                    <button
                        type="button"
                        onclick="stopRecordingOnly()"
                        class="text-[11px] text-white px-2 py-1 bg-red-600 hover:bg-red-500 rounded-lg cursor-pointer font-bold">
                        ⏹ Stop
                    </button>

                    <button
                        type="button"
                        onclick="cancelRecording()"
                        class="text-[11px] text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
                        Discard
                    </button>

                </div>
            </div>

            <button
                type="button"
                id="mic-btn"
                onclick="startVoiceRecording()"
                class="p-2 text-slate-400 hover:text-red-400 transition-colors cursor-pointer flex-shrink-0"
                title="Record Voice Note">
                🎤
            </button>

            <button
                type="submit"
                id="send-btn"
                class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl text-sm transition-all cursor-pointer text-white flex-shrink-0">
                Send
            </button>

        </form>

    </div>

    <script src="supabase.js"></script>

    <script>

        /* =========================================================
           USER + PRIVATE CHAT TARGET
        ========================================================= */

        const currentUser = JSON.parse(localStorage.getItem('chatlite_user'));

        const urlParams = new URLSearchParams(window.location.search);

        const targetUsername = urlParams.get('to');
        const targetName = urlParams.get('name') || targetUsername || 'Private Chat';
        const targetGender = urlParams.get('gender') || '';

        if (!currentUser) {
            window.location.href = 'index.html';
            throw new Error('No logged-in user.');
        }

        if (!targetUsername) {
            window.location.href = 'chatlist.html';
            throw new Error('No private chat recipient supplied.');
        }


        /* =========================================================
           HEADER
        ========================================================= */

        document.getElementById('active-chat-name').textContent = targetName;

        document.getElementById('active-chat-members').textContent =
            `@${targetUsername}`;

        document.getElementById('active-chat-avatar').textContent =
            targetName.charAt(0).toUpperCase();


        /* =========================================================
           STATE
        ========================================================= */

        let messageSubscription = null;

        let messagesCache = [];

        let mediaRecorder = null;
        let audioChunks = [];
        let recordedBlob = null;

        let stagedPayload = null;

        let isRecording = false;
        let isPaused = false;

        let recordingTimerInterval = null;
        let recordingSeconds = 0;

        let replyingToMessage = null;

        let isMultiSelectMode = false;
        let selectedMessageIds = new Set();

        let pendingDeleteTimer = null;
        let undoTargetMessage = null;


        /* =========================================================
           PRIVATE "DELETE FOR ME" STORAGE KEY
        ========================================================= */

        function getPrivateDeleteKey() {
            return `chatlite_private_deleted_for_me_${currentUser.username}_${targetUsername}`;
        }

        function getHiddenForMe() {
            try {
                return JSON.parse(
                    localStorage.getItem(getPrivateDeleteKey()) || '[]'
                );
            } catch (e) {
                return [];
            }
        }

        function saveHiddenForMe(ids) {
            localStorage.setItem(
                getPrivateDeleteKey(),
                JSON.stringify(ids)
            );
        }


        /* =========================================================
           ATTACHMENT MENU
        ========================================================= */

        function toggleAttachmentMenu() {
            const menu = document.getElementById('attachment-menu');
            menu.classList.toggle('hidden');
        }


        /* =========================================================
           SEARCH
        ========================================================= */

        function toggleSearchBox() {

            const searchBar =
                document.getElementById('search-container');

            searchBar.classList.toggle('hidden');

            if (!searchBar.classList.contains('hidden')) {
                document
                    .getElementById('search-keyword-input')
                    .focus();
            } else {
                filterMessages('');
            }
        }


        /* =========================================================
           FETCH PRIVATE MESSAGES
        ========================================================= */

        async function fetchMessages() {

            const me = currentUser.username;
            const other = targetUsername;

            const [sentResult, receivedResult] = await Promise.all([

                supabaseClient
                    .from('private_messages')
                    .select('*')
                    .eq('sender_username', me)
                    .eq('receiver_username', other)
                    .order('created_at', { ascending: true }),

                supabaseClient
                    .from('private_messages')
                    .select('*')
                    .eq('sender_username', other)
                    .eq('receiver_username', me)
                    .order('created_at', { ascending: true })

            ]);

            if (sentResult.error) {
                console.error(
                    'Error fetching sent private messages:',
                    sentResult.error
                );
            }

            if (receivedResult.error) {
                console.error(
                    'Error fetching received private messages:',
                    receivedResult.error
                );
            }

            if (sentResult.error || receivedResult.error) {
                return;
            }

            const combined = [
                ...(sentResult.data || []),
                ...(receivedResult.data || [])
            ];

            combined.sort(
                (a, b) =>
                    new Date(a.created_at).getTime() -
                    new Date(b.created_at).getTime()
            );

            messagesCache = combined;

            renderMessages(messagesCache);
        }


        /* =========================================================
           RENDER MESSAGES
        ========================================================= */

        function renderMessages(messages) {

            const container =
                document.getElementById('chat-messages');

            container.innerHTML = '';

            const hiddenForMe = getHiddenForMe();

            const filtered = messages.filter(msg => {

                if (hiddenForMe.includes(msg.id)) {
                    return false;
                }

                if (msg.is_deleted_for_everyone) {
                    return false;
                }

                return true;
            });

            filtered.forEach(msg => {
                appendMessageToDOM(msg, false);
            });

            container.scrollTop = container.scrollHeight;
        }


        /* =========================================================
           SEARCH FILTER
        ========================================================= */

        function filterMessages(keyword) {

            const term = keyword.toLowerCase().trim();

            if (!term) {
                renderMessages(messagesCache);
                return;
            }

            const filtered = messagesCache.filter(msg => {

                if (msg.is_deleted_for_everyone) {
                    return false;
                }

                const content =
                    String(msg.content || '').toLowerCase();

                const sender =
                    String(msg.sender_username || '').toLowerCase();

                const type =
                    String(msg.message_type || 'text').toLowerCase();

                return (
                    content.includes(term) ||
                    sender.includes(term) ||
                    type.includes(term)
                );
            });

            renderMessages(filtered);
        }


        /* =========================================================
           APPEND MESSAGE
        ========================================================= */

        function appendMessageToDOM(msg, scrollToBottom = true) {

            const container =
                document.getElementById('chat-messages');

            const isMe =
                msg.sender_username === currentUser.username;

            const wrapper = document.createElement('div');

            wrapper.className =
                `flex flex-col ${
                    isMe ? 'items-end' : 'items-start'
                } space-y-1 message-row relative transition-transform duration-200 select-none`;

            if (msg.id) {
                wrapper.setAttribute('data-id', msg.id);
            }

            const isSelected =
                msg.id && selectedMessageIds.has(msg.id);

            const rowFlex = document.createElement('div');

            rowFlex.className =
                `flex items-center gap-2 max-w-[85%] ${
                    isMe ? 'flex-row-reverse' : 'flex-row'
                }`;

            /* MULTI SELECT CHECKBOX */

            const checkboxEl = document.createElement('div');

            checkboxEl.className =
                `w-5 h-5 rounded-full border border-slate-600 flex items-center justify-center text-xs transition-all flex-shrink-0 ${
                    isMultiSelectMode ? 'flex' : 'hidden'
                } ${
                    isSelected
                        ? 'bg-indigo-600 border-indigo-500 text-white'
                        : 'bg-slate-900'
                }`;

            checkboxEl.innerHTML =
                isSelected ? '✓' : '';

            rowFlex.appendChild(checkboxEl);

            if (isSelected) {
                wrapper.classList.add(
                    'bg-indigo-950/30',
                    'p-2',
                    'rounded-xl'
                );
            }


            /* LONG PRESS */

            let pressTimer = null;

            const startPress = () => {

                pressTimer = setTimeout(() => {

                    if (isMultiSelectMode) {

                        if (msg.id) {
                            toggleMessageSelection(msg.id);
                        }

                    } else {

                        openMessageOptions(msg);

                    }

                }, 600);
            };

            const cancelPress = () => {

                if (pressTimer) {
                    clearTimeout(pressTimer);
                }

            };

            wrapper.addEventListener(
                'touchstart',
                startPress
            );

            wrapper.addEventListener(
                'touchend',
                cancelPress
            );

            wrapper.addEventListener(
                'touchmove',
                cancelPress
            );

            wrapper.addEventListener(
                'mousedown',
                startPress
            );

            wrapper.addEventListener(
                'mouseup',
                cancelPress
            );

            wrapper.addEventListener(
                'mouseleave',
                cancelPress
            );


            /* MULTI SELECT CLICK */

            wrapper.addEventListener('click', e => {

                if (
                    isMultiSelectMode &&
                    msg.id
                ) {

                    toggleMessageSelection(msg.id);

                    e.stopPropagation();
                }

            });


            /* RIGHT CLICK */

            wrapper.oncontextmenu = e => {

                e.preventDefault();

                if (msg.id && !isMultiSelectMode) {
                    openMessageOptions(msg);
                }

            };


            /* SWIPE TO REPLY */

            let touchStartX = 0;
            let touchCurrentX = 0;

            wrapper.addEventListener(
                'touchstart',
                e => {

                    if (isMultiSelectMode) {
                        return;
                    }

                    touchStartX =
                        e.touches[0].clientX;

                },
                { passive: true }
            );

            wrapper.addEventListener(
                'touchmove',
                e => {

                    if (isMultiSelectMode) {
                        return;
                    }

                    touchCurrentX =
                        e.touches[0].clientX;

                    const diff =
                        touchCurrentX - touchStartX;

                    if (diff > 0 && diff < 100) {
                        wrapper.style.transform =
                            `translateX(${diff}px)`;
                    }

                },
                { passive: true }
            );

            wrapper.addEventListener(
                'touchend',
                () => {

                    if (isMultiSelectMode) {
                        return;
                    }

                    const diff =
                        touchCurrentX - touchStartX;

                    wrapper.style.transform =
                        'translateX(0px)';

                    if (diff > 60) {
                        setReplyTarget(msg);
                    }

                    touchStartX = 0;
                    touchCurrentX = 0;

                }
            );


            /* MESSAGE BUBBLE */

            const bubble = document.createElement('div');

            bubble.className =
                `flex-1 px-3 py-2 rounded-2xl text-sm ${
                    isMe
                        ? 'bg-indigo-600 text-white rounded-br-none'
                        : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'
                }`;


            /* REPLY PREVIEW */

            if (msg.reply_to) {

                const replySnippet =
                    document.createElement('div');

                replySnippet.className =
                    `mb-1 p-1.5 rounded text-xs border-l-2 ${
                        isMe
                            ? 'bg-indigo-700/50 border-indigo-300 text-indigo-100'
                            : 'bg-slate-900/60 border-indigo-500 text-slate-300'
                    }`;

                const senderSpan =
                    document.createElement('span');

                senderSpan.className =
                    'font-bold block text-[10px] opacity-90';

                senderSpan.textContent =
                    msg.reply_to.sender || 'Message';

                const contentSpan =
                    document.createElement('span');

                contentSpan.className =
                    'truncate block';

                contentSpan.textContent =
                    msg.reply_to.content || '';

                replySnippet.appendChild(senderSpan);
                replySnippet.appendChild(contentSpan);

                bubble.appendChild(replySnippet);
            }


            /* MESSAGE CONTENT */

            const contentBody =
                document.createElement('div');

            const type =
                msg.message_type || 'text';


            if (type === 'image') {

                const image =
                    document.createElement('img');

                image.src = msg.content;

                image.className =
                    'rounded-xl max-h-60 w-full object-cover cursor-pointer';

                image.onclick = () => {

                    if (!isMultiSelectMode) {
                        window.open(
                            msg.content,
                            '_blank'
                        );
                    }

                };

                contentBody.appendChild(image);


            } else if (type === 'video') {

                const video =
                    document.createElement('video');

                video.src = msg.content;

                video.controls = true;

                video.className =
                    'rounded-xl max-h-60 w-full';

                contentBody.appendChild(video);


            } else if (type === 'audio') {

                const audioId =
                    'audio_' +
                    Math.random()
                        .toString(36)
                        .substring(2, 9);

                contentBody.innerHTML = `
                    <div class="flex items-center gap-2.5 py-1 px-1 min-w-[220px]" data-audio-container>

                        <button
                            type="button"
                            onclick="if(!isMultiSelectMode) toggleAudioPlay('${audioId}', this)"
                            class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-xs font-bold transition-all flex-shrink-0 cursor-pointer">
                            ▶
                        </button>

                        <audio
                            id="${audioId}"
                            src="${msg.content}"
                            preload="metadata">
                        </audio>

                        <div class="flex flex-col flex-1 gap-1">

                            <div class="flex justify-between items-center text-[10px] opacity-80">

                                <span class="audio-current-time">
                                    0:00
                                </span>

                                <button
                                    type="button"
                                    onclick="if(!isMultiSelectMode) toggleAudioSpeed('${audioId}', this)"
                                    class="bg-white/10 hover:bg-white/20 px-1.5 py-0.5 rounded font-mono text-[9px] cursor-pointer">
                                    1x
                                </button>

                            </div>

                            <input
                                type="range"
                                value="0"
                                max="100"
                                step="0.1"
                                oninput="seekAudio('${audioId}', this.value)"
                                class="audio-range w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white">

                        </div>
                    </div>
                `;

                setTimeout(() => {

                    const audioEl =
                        document.getElementById(audioId);

                    if (!audioEl) return;

                    const c =
                        audioEl.closest(
                            '[data-audio-container]'
                        );

                    const rangeEl =
                        c.querySelector('.audio-range');

                    const timeEl =
                        c.querySelector(
                            '.audio-current-time'
                        );

                    audioEl.addEventListener(
                        'loadedmetadata',
                        () => {
                            timeEl.textContent =
                                formatAudioTime(
                                    audioEl.duration
                                );
                        }
                    );

                    audioEl.addEventListener(
                        'timeupdate',
                        () => {

                            if (!audioEl.duration) {
                                return;
                            }

                            rangeEl.value =
                                (
                                    audioEl.currentTime /
                                    audioEl.duration
                                ) * 100;

                            timeEl.textContent =
                                formatAudioTime(
                                    audioEl.currentTime
                                );
                        }
                    );

                    audioEl.addEventListener(
                        'ended',
                        () => {

                            c.querySelector(
                                'button'
                            ).textContent = '▶';

                            audioEl.currentTime = 0;

                        }
                    );

                }, 50);


            } else if (type === 'file') {

                const link =
                    document.createElement('a');

                link.href = msg.content;

                link.download = 'file';

                link.className =
                    'flex items-center gap-2 underline text-xs font-semibold py-1';

                link.textContent =
                    '📁 File Attachment';

                contentBody.appendChild(link);


            } else {

                contentBody.textContent =
                    msg.content || '';

            }

            bubble.appendChild(contentBody);

            rowFlex.appendChild(bubble);


            /* TIME */

            const metaRow =
                document.createElement('div');

            metaRow.className =
                `flex items-center gap-1 px-1 text-[10px] text-slate-400 ${
                    isMe ? 'mr-7' : 'ml-7'

            const timeSpan =

            metaRow.appendChild(timeSpan);


            if (isMe) {

                const tickSpan =
                    document.createElement('span');

                tickSpan.className =
                    'font-bold text-xs text-slate-500';

                tickSpan.textContent = '✓';

                metaRow.appendChild(tickSpan);

            wrapper.appendChild(metaRow);

            container.appendChild(wrapper);


            if (scrollToBottom) {
                container.scrollTop =

        /* =========================================================
           MULTI SELECT
        ========================================================= */

        function enterMultiSelectMode(msg) {

            isMultiSelectMode = true;

            selectedMessageIds.clear();

            if (msg && msg.id) {
                selectedMessageIds.add(msg.id);
            }

            const bar =
                document.getElementById(
                    'multi-select-bar'
                );

            bar.classList.remove('hidden');
            bar.classList.add('flex');

            updateMultiSelectUI();

            renderMessages(messagesCache);
        }


        function exitMultiSelectMode() {

            isMultiSelectMode = false;

            selectedMessageIds.clear();

            const bar =
                document.getElementById(
                    'multi-select-bar'
                );

            bar.classList.remove('flex');
            bar.classList.add('hidden');

            renderMessages(messagesCache);
        }


        function toggleMessageSelection(msgId) {

            if (selectedMessageIds.has(msgId)) {
                selectedMessageIds.delete(msgId);
            } else {
                selectedMessageIds.add(msgId);
            }

            if (selectedMessageIds.size === 0) {
                exitMultiSelectMode();
                return;
            }

            updateMultiSelectUI();

            renderMessages(messagesCache);
        }


        function updateMultiSelectUI() {

            document.getElementById(
                'selected-count-text'
            ).textContent =
                `${selectedMessageIds.size} selected`;
        }


        /* =========================================================
           MULTI SELECT ACTIONS
        ========================================================= */

        function handleMultiSelectAction(actionType) {

            if (selectedMessageIds.size === 0) {
                return;
            }

            const selectedMsgs =
                messagesCache.filter(
                    m => selectedMessageIds.has(m.id)
                );


            /* FORWARD */

            if (actionType === 'forward') {

                const firstMsg =
                    selectedMsgs[0];

                if (firstMsg) {

                    localStorage.setItem(
                        'chatlite_forward_payload',
                        JSON.stringify({
                            content: firstMsg.content,
                            type:
                                firstMsg.message_type ||
                                'text'
                        })
                    );

                    window.location.href =
                        'chatlist.html?forward=true';
                }

                exitMultiSelectMode();

                return;
            }


            /* DELETE FOR ME */

            if (actionType === 'me') {

                let hiddenForMe =
                    getHiddenForMe();

                selectedMessageIds.forEach(id => {

                    if (!hiddenForMe.includes(id)) {
                        hiddenForMe.push(id);
                    }

                });

                saveHiddenForMe(hiddenForMe);

                exitMultiSelectMode();

                renderMessages(messagesCache);

                showUndoBanner(
                    10,
                    () => fetchMessages()
                );

                return;
            }


            /* DELETE FOR EVERYONE */

            if (actionType === 'everyone') {

                const now =
                    new Date().getTime();

                const validIds = [];

                selectedMsgs.forEach(msg => {

                    const isSender =
                        msg.sender_username ===
                        currentUser.username;

                    const diffHours =
                        (
                            now -
                            new Date(
                                msg.created_at
                            ).getTime()
                        ) /
                        (1000 * 60 * 60);

                    if (
                        isSender &&
                        diffHours <= 3
                    ) {
                        validIds.push(msg.id);
                    }

                });

                exitMultiSelectMode();

                selectedMsgs.forEach(msg => {

                    if (validIds.includes(msg.id)) {
                        msg.is_deleted_for_everyone = true;
                    }

                });

                renderMessages(messagesCache);

                showUndoBanner(
                    10,
                    async () => {

                        if (validIds.length > 0) {

                            const { error } =
                                await supabaseClient
                                    .from(
                                        'private_messages'
                                    )
                                    .update({
                                        is_deleted_for_everyone: true,
                                        content: '[Message deleted]',
                                        message_type: 'text'
                                    })
                                    .in(
                                        'id',
                                        validIds
                                    );

                            if (error) {
                                console.error(
                                    'Delete for everyone error:',
                                    error
                                );
                            }
                        }

                        fetchMessages();
                    }
                );
            }
        }

                copyBtn.textContent =

                    } catch (e) {

                };

                closeMessageOptions();

                localStorage.setItem(
                    'chatlite_forward_payload',
                    JSON.stringify({

                    })
                );

                window.location.href =
                    'chatlist.html?forward=true';

            actionsContainer.appendChild(

            /* DELETE FOR ME */

            ) {

        /* =========================================================
           DELETE MESSAGE
        ========================================================= */

        function executeDeleteMessage(msg, scope) {

            undoTargetMessage = {
                msg,
                scope
            };


            if (scope === 'me') {

                let hiddenForMe =
                    getHiddenForMe();

                if (!hiddenForMe.includes(msg.id)) {
                    hiddenForMe.push(msg.id);
                }

                saveHiddenForMe(
                    hiddenForMe
                );

            } else {

                msg.is_deleted_for_everyone =
                    true;
            }


            renderMessages(
                messagesCache
            );


            showUndoBanner(
                10,
                async () => {

                    if (
                        scope === 'everyone' &&
                        msg.id
                    ) {

                        const { error } =
                            await supabaseClient
                                .from(
                                    'private_messages'
                                )
                                .update({
                                    is_deleted_for_everyone: true,
                                    content: '[Message deleted]',
                                    message_type: 'text'
                                })
                                .eq(
                                    'id',
                                    msg.id
                                );

                        if (error) {
                            console.error(
                                'Delete for everyone error:',
                                error
                            );
                        }
                    }

                    await fetchMessages();
                }
            );
        }


        /* =========================================================
           UNDO
        ========================================================= */

        function showUndoBanner(
            seconds,
            onComplete
        ) {

            const banner =
                document.getElementById(
                    'undo-banner'
                );

            const countdownEl =
                document.getElementById(
                    'undo-countdown'
                );

            banner.classList.remove('hidden');
            banner.classList.add('flex');

            let timeLeft = seconds;

            countdownEl.textContent =
                timeLeft;

            if (pendingDeleteTimer) {
                clearInterval(
                    pendingDeleteTimer
                );
            }

            pendingDeleteTimer =
                setInterval(() => {

                    timeLeft--;

                    countdownEl.textContent =
                        timeLeft;

                    if (timeLeft <= 0) {

                        clearInterval(
                            pendingDeleteTimer
                        );

                        banner.classList.remove(
                            'flex'
                        );

                        banner.classList.add(
                            'hidden'
                        );

                        if (onComplete) {
                            onComplete();
                        }
                    }

                }, 1000);
        }


        function triggerUndoAction() {

            if (pendingDeleteTimer) {
                clearInterval(
                    pendingDeleteTimer
                );
            }

            const banner =
                document.getElementById(
                    'undo-banner'
                );

            banner.classList.remove(
                'flex'
            );

            banner.classList.add(
                'hidden'
            );


            if (!undoTargetMessage) {
                return;
            }

            const {
                msg,
                scope
            } = undoTargetMessage;


            if (scope === 'me') {

                let hiddenForMe =
                    getHiddenForMe();

                hiddenForMe =
                    hiddenForMe.filter(
                        id => id !== msg.id
                    );

                saveHiddenForMe(
                    hiddenForMe
                );

            } else {

                msg.is_deleted_for_everyone =
                    false;
            }


            renderMessages(
                messagesCache
            );

            undoTargetMessage = null;
        }


        /* =========================================================
           AUDIO
        ========================================================= */

        function toggleAudioPlay(
            audioId,
            btn
        ) {

            const audio =
                document.getElementById(
                    audioId
                );

            if (!audio) {
                return;
            }

            if (audio.paused) {

                audio.play();

                btn.textContent =
                    '⏸';

            } else {

                audio.pause();

                btn.textContent =
                    '▶';
            }
        }


        function seekAudio(
            audioId,
            value
        ) {

            const audio =
                document.getElementById(
                    audioId
                );

            if (
                !audio ||
                !audio.duration
            ) {
                return;
            }

            audio.currentTime =
                (value / 100) *
                audio.duration;
        }


        function toggleAudioSpeed(
            audioId,
            speedBtn
        ) {

            const audio =
                document.getElementById(
                    audioId
                );

            if (!audio) {
                return;
            }

            let nextRate =
                audio.playbackRate === 1
                    ? 1.5
                    : audio.playbackRate === 1.5
                        ? 2
                        : 1;

            audio.playbackRate =
                nextRate;

            speedBtn.textContent =
                nextRate + 'x';
        }


        function formatAudioTime(secs) {

            if (isNaN(secs)) {
                return '0:00';
            }

            const mins =
                Math.floor(secs / 60);

            const rSecs =
                Math.floor(secs % 60);

            return `${mins}:${
                rSecs < 10 ? '0' : ''
            }${rSecs}`;
        }


        /* =========================================================
           FILE / MEDIA STAGING
        ========================================================= */

        function stageFileSelected(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();

            const progressBar =
                document.getElementById(
                    'upload-progress-bar'
                );

            const statusText =
                document.getElementById(
                    'upload-status-text'
                );

            document
                .getElementById(
                    'media-preview-bar'
                )
                .classList.remove(
                    'hidden'
                );

            document
                .getElementById(
                    'media-preview-bar'
                )
                .classList.add(
                    'flex'
                );

            progressBar.style.width =
                '10%';

            statusText.textContent =
                'Reading file stream...';


            reader.onprogress = data => {

                if (data.lengthComputable) {

                    const percent =
                        Math.round(
                            (data.loaded /
                                data.total) *
                            90
                        );

                    progressBar.style.width =
                        percent + '%';
                }
            };


            reader.onload = function(e) {

                progressBar.style.width =
                    '100%';

                statusText.textContent =
                    'Ready! Hit the Send button to dispatch.';

                let type = 'file';

                if (
                    file.type.startsWith(
                        'image/'
                    )
                ) {
                    type = 'image';

                } else if (
                    file.type.startsWith(
                        'video/'
                    )
                ) {
                    type = 'video';

                } else if (
                    file.type.startsWith(
                        'audio/'
                    )
                ) {
                    type = 'audio';
                }


                stagedPayload = {
                    content:
                        e.target.result,
                    type: type
                };


                const previewContainer =
                    document.getElementById(
                        'preview-container'
                    );


                if (type === 'image') {

                    const img =
                        document.createElement(
                            'img'
                        );

                    img.src =
                        e.target.result;

                    img.className =
                        'max-h-20 rounded object-contain';

                    previewContainer.innerHTML =
                        '';

                    previewContainer.appendChild(
                        img
                    );


                } else if (type === 'video') {

                    const video =
                        document.createElement(
                            'video'
                        );

                    video.src =
                        e.target.result;

                    video.className =
                        'max-h-20 rounded';

                    video.controls =
                        true;

                    previewContainer.innerHTML =
                        '';

                    previewContainer.appendChild(
                        video
                    );


                } else {

                    previewContainer.textContent =
                        `Staged File: ${file.name}`;
                }
            };


            reader.readAsDataURL(file);
        }

        /* =========================================================
           VOICE RECORDING
        ========================================================= */

        async function startVoiceRecording() {

            try {

                const stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            audio: true
                        });

                mediaRecorder =
                    new MediaRecorder(
                        stream
                    );

                audioChunks = [];

                mediaRecorder.ondataavailable =
                    e => {
                        audioChunks.push(
                            e.data
                        );
                    };

                mediaRecorder.onstop =
                    () => {

                        recordedBlob =
                            new Blob(
                                audioChunks,
                                {
                                    type:
                                        'audio/webm'
                                }
                            );
                    };


                mediaRecorder.start();

                isRecording = true;

                isPaused = false;

                recordedBlob = null;


                document
                    .getElementById(
                        'message-input'
                    )
                    .classList.add(
                        'hidden'
                    );

                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.add(
                        'flex'
                    );

                document
                    .getElementById(
                        'mic-btn'
                    )
                    .classList.add(
                        'hidden'
                    );


                recordingSeconds = 0;

                document
                    .getElementById(
                        'recording-timer'
                    )
                    .textContent =
                    '0:00';


                recordingTimerInterval =
                    setInterval(() => {

                        if (!isPaused) {

                            recordingSeconds++;

                            const m =
                                Math.floor(
                                    recordingSeconds /
                                    60
                                );

                            const s =
                                recordingSeconds %
                                60;

                            document
                                .getElementById(
                                    'recording-timer'
                                )
                                .textContent =
                                `${m}:${
                                    s < 10
                                        ? '0'
                                        : ''
                                }${s}`;
                        }

                    }, 1000);

            } catch (err) {

                console.error(
                    'Microphone error:',
                    err
                );

                alert(
                    'Microphone access denied or unavailable.'
                );
            }
        }


        function togglePauseRecording() {

            if (!mediaRecorder) {
                return;
            }

            const btn =
                document.getElementById(
                    'pause-rec-btn'
                );

            if (!isPaused) {

                mediaRecorder.pause();

                isPaused = true;

                btn.textContent =
                    '▶ Resume';

            } else {

                mediaRecorder.resume();

                isPaused = false;

                btn.textContent =
                    '⏸ Pause';
            }
        }


        function stopRecordingOnly() {

            if (
                mediaRecorder &&
                (
                    isRecording ||
                    isPaused
                )
            ) {

                if (
                    mediaRecorder.state !==
                    'inactive'
                ) {
                    mediaRecorder.stop();
                }

                isRecording = false;

                isPaused = false;

                clearInterval(
                    recordingTimerInterval
                );


                if (mediaRecorder.stream) {

                    mediaRecorder.stream
                        .getTracks()
                        .forEach(track =>
                            track.stop()
                        );
                }


                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.add(
                        'hidden'
                    );

                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.remove(
                        'flex'
                    );

                document
                    .getElementById(
                        'message-input'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'mic-btn'
                    )
                    .classList.remove(
                        'hidden'
                    );


                document
                    .getElementById(
                        'media-preview-bar'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'media-preview-bar'
                    )
                    .classList.add(
                        'flex'
                    );

                document
                    .getElementById(
                        'preview-container'
                    )
                    .textContent =
                    `Voice Note Recorded (${recordingSeconds}s). Ready to Send.`;

                document
                    .getElementById(
                        'upload-progress-bar'
                    )
                    .style.width =
                    '100%';

                document
                    .getElementById(
                        'upload-status-text'
                    )
                    .textContent =
                    'Hit the Send button to dispatch voice note.';
            }
        }


        function cancelRecording() {

            if (
                mediaRecorder &&
                (
                    isRecording ||
                    isPaused
                )
            ) {

                if (
                    mediaRecorder.state !==
                    'inactive'
                ) {
                    mediaRecorder.stop();
                }

                if (mediaRecorder.stream) {

                    mediaRecorder.stream
                        .getTracks()
                        .forEach(track =>
                            track.stop()
                        );
                }
            }

            resetRecordingUI();

            clearStagedMedia();
        }


        function resetRecordingUI() {

            clearInterval(
                recordingTimerInterval
            );

            isRecording = false;

            isPaused = false;

            document
                .getElementById(
                    'recording-ui'
                )
                .classList.add(
                    'hidden'
                );

            document
                .getElementById(
                    'recording-ui'
                )
                .classList.remove(
                    'flex'
                );

            document
                .getElementById(
                    'message-input'
                )
                .classList.remove(
                    'hidden'
                );

            document
                .getElementById(
                    'mic-btn'
                )
                .classList.remove(
                    'hidden'
                );
        }


        /* =========================================================
           SEND FORM
        ========================================================= */

        async function handleFormSubmit(e) {

            e.preventDefault();

            if (isRecording) {

                stopRecordingOnly();

                return;
            }


            let replyMeta = null;


            if (replyingToMessage) {

                const repType =
                    replyingToMessage.message_type ||
                    'text';

                replyMeta = {

                    sender:
                        replyingToMessage.sender_username ===
                        currentUser.username
                            ? 'You'
                            : `@${replyingToMessage.sender_username}`,

                    content:
                        repType === 'text'
                            ? replyingToMessage.content
                            : `[${repType}]`
                };
            }


            /* VOICE */

            if (recordedBlob) {

                const blobToSend =
                    recordedBlob;

                recordedBlob = null;

                const reader =
                    new FileReader();

                reader.readAsDataURL(
                    blobToSend
                );

                reader.onloadend =
                    async () => {

                        await sendPayloadToSupabase(
                            reader.result,
                            'audio',
                            replyMeta
                        );

                        resetRecordingUI();

                        clearStagedMedia();

                        cancelReply();
                    };

                return;
            }


            /* ATTACHMENT */

            if (stagedPayload) {

                const payloadToSend =
                    stagedPayload;

                stagedPayload = null;

                await sendPayloadToSupabase(
                    payloadToSend.content,
                    payloadToSend.type,
                    replyMeta
                );

                clearStagedMedia();

                cancelReply();

                return;
            }


            /* TEXT */

            const input =
                document.getElementById(
                    'message-input'
                );

            const content =
                input.value.trim();

            if (!content) {
                return;
            }

            input.value = '';

            await sendPayloadToSupabase(
                content,
                'text',
                replyMeta
            );

            cancelReply();
        }


        /* =========================================================
           SEND PRIVATE MESSAGE
        ========================================================= */

        async function sendPayloadToSupabase(
            content,
            type,
            replyMeta = null
        ) {

            const payload = {

                sender_username:
                    currentUser.username,

                receiver_username:
                    targetUsername,

                content:
                    content,

                message_type:
                    type || 'text',

                reply_to:
                    replyMeta,

                created_at:
                    new Date().toISOString()
            };


            const {
                data,
                error
            } = await supabaseClient
                .from('private_messages')
                .insert([payload])
                .select();


            if (error) {

                console.error(
                    'PRIVATE MESSAGE INSERT ERROR:',
                    JSON.stringify(
                        error,
                        null,
                        2
                    )
                );

                alert(
                    'Failed to send message: ' +
                    error.message
                );

                return;
            }


            if (data && data.length > 0) {

                const newMessage =
                    data[0];

                if (
                    !messagesCache.some(
                        m => m.id ===
                        newMessage.id
                    )
                ) {

                    messagesCache.push(
                        newMessage
                    );

                    messagesCache.sort(
                        (a, b) =>
                            new Date(
                                a.created_at
                            ).getTime() -
                            new Date(
                                b.created_at
                            ).getTime()
                    );

                    renderMessages(
                        messagesCache
                    );
                }
            }
        }


        /* =========================================================
           MEDIA GALLERY
        ========================================================= */

        function openMediaGallery(
            typeFilter
        ) {

            const modal =
                document.getElementById(
                    'media-gallery-modal'
                );

            const grid =
                document.getElementById(
                    'gallery-content-grid'
                );

            const title =
                document.getElementById(
                    'gallery-title'
                );

            modal.classList.remove(
                'hidden'
            );

            modal.classList.add(
                'flex'
            );

            grid.innerHTML = '';

            title.textContent =
                `Private ${typeFilter.toUpperCase()} Gallery`;


            const matching =
                messagesCache.filter(
                    m => {

                        if (
                            m.is_deleted_for_everyone
                        ) {
                            return false;
                        }

                        const mType =
                            m.message_type ||
                            'text';

                        if (
                            typeFilter === 'image' &&
                            mType === 'image'
                        ) {
                            return true;
                        }

                        if (
                            typeFilter === 'video' &&
                            mType === 'video'
                        ) {
                            return true;
                        }

                        if (
                            typeFilter === 'file' &&
                            (
                                mType === 'file' ||
                                mType === 'audio'
                            )
                        ) {
                            return true;
                        }

                        return false;
                    }
                );


            if (matching.length === 0) {

                grid.innerHTML =
                    `<span class="text-xs text-slate-500 col-span-2 text-center py-6">
                        No ${typeFilter}s found in this conversation.
                    </span>`;

                return;
            }


            matching.forEach(m => {

                const card =
                    document.createElement(
                        'div'
                    );

                card.className =
                    'bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col items-center justify-center gap-2';

                const mType =
                    m.message_type ||
                    'text';


                if (mType === 'image') {

                    const img =
                        document.createElement(
                            'img'
                        );

                    img.src =
                        m.content;

                    img.className =
                        'h-24 w-full object-cover rounded cursor-pointer';

                    img.onclick = () =>
                        window.open(
                            m.content,
                            '_blank'
                        );

                    card.appendChild(
                        img
                    );


                } else if (mType === 'video') {

                    const video =
                        document.createElement(
                            'video'
                        );

                    video.src =
                        m.content;

                    video.className =
                        'h-24 w-full rounded object-cover';

                    video.controls =
                        true;

                    card.appendChild(
                        video
                    );


                } else {

                    const link =
                        document.createElement(
                            'a'
                        );

                    link.href =
                        m.content;

                    link.download =
                        'file';

                    link.className =
                        'text-xs text-indigo-400 underline font-semibold py-4';

                    link.textContent =
                        `Download ${mType}`;

                    card.appendChild(
                        link
                    );
                }


                grid.appendChild(
                    card
                );
            });
        }


        function closeMediaGallery() {

            document
                .getElementById(
                    'media-gallery-modal'
                )
                .classList.add(
                    'hidden'
                );

            document
                .getElementById(
                    'media-gallery-modal'
                )
                .classList.remove(
                    'flex'
                );
        }


        /* =========================================================
           REALTIME PRIVATE MESSAGES
        ========================================================= */

        function subscribeToMessages() {

            if (messageSubscription) {

                supabaseClient.removeChannel(
                    messageSubscription
                );

                messageSubscription = null;
            }


            const me =
                currentUser.username;

            const other =
                targetUsername;


            messageSubscription =
                supabaseClient
                    .channel(
                        `private_messages_${me}_${other}`
                    )

                    /* Messages I send */

                    .on(
                        'postgres_changes',
                        {
                            event: 'INSERT',
                            schema: 'public',
                            table: 'private_messages',
                            filter:
                                `sender_username=eq.${me}`
                        },
                        handleRealtimeMessage
                    )

                    /* Messages they send */

                    .on(
                        'postgres_changes',
                        {
                            event: 'INSERT',
                            schema: 'public',
                            table: 'private_messages',
                            filter:
                                `sender_username=eq.${other}`
                        },
                        handleRealtimeMessage
                    )

                    /* Updates such as delete-for-everyone */

                    .on(
                        'postgres_changes',
                        {
                            event: 'UPDATE',
                            schema: 'public',
                            table: 'private_messages',
                            filter:
                                `sender_username=eq.${me}`
                        },
                        handleRealtimeUpdate
                    )

                    .on(
                        'postgres_changes',
                        {
                            event: 'UPDATE',
                            schema: 'public',
                            table: 'private_messages',
                            filter:
                                `sender_username=eq.${other}`
                        },
                        handleRealtimeUpdate
                    )

                    .subscribe(
                        status => {
                            console.log(
                                'Private chat realtime status:',
                                status
                            );
                        }
                    );
        }


        function handleRealtimeMessage(
            payload
        ) {

            const newMsg =
                payload.new;

            if (!newMsg) {
                return;
            }

            const belongsToConversation =
                (
                    newMsg.sender_username ===
                    currentUser.username &&
                    newMsg.receiver_username ===
                    targetUsername
                ) ||
                (
                    newMsg.sender_username ===
                    targetUsername &&
                    newMsg.receiver_username ===
                    currentUser.username
                );


            if (!belongsToConversation) {
                return;
            }


            if (
                !messagesCache.some(
                    m => m.id ===
                    newMsg.id
                )
            ) {

                messagesCache.push(
                    newMsg
                );

                messagesCache.sort(
                    (a, b) =>
                        new Date(
                            a.created_at
                        ).getTime() -
                        new Date(
                            b.created_at
                        ).getTime()
                );

                renderMessages(
                    messagesCache
                );
            }
        }


        function handleRealtimeUpdate(
            payload
        ) {

            const updated =
                payload.new;

            if (!updated) {
                return;
            }

            const index =
                messagesCache.findIndex(
                    m => m.id ===
                    updated.id
                );

            if (index !== -1) {

                messagesCache[index] =
                    updated;

                renderMessages(
                    messagesCache
                );
            }
        }


        /* =========================================================
           CLEANUP
        ========================================================= */

        window.addEventListener(
            'beforeunload',
            () => {

                if (messageSubscription) {

                    supabaseClient
                        .removeChannel(
                            messageSubscription
                        );

                    messageSubscription =
                        null;
                }

                if (recordingTimerInterval) {

                    clearInterval(
                        recordingTimerInterval
                    );
                }
            }
        );


        /* =========================================================
           START PRIVATE CHAT
        ========================================================= */

        fetchMessages();

        subscribeToMessages();

    </script>
