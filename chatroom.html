            if (matching.length === 0) {

                grid.innerHTML =
                    `<span class="text-xs text-slate-500 col-span-2 text-center py-6">No ${typeFilter}s found in this chat.</span>`;

                return;
            }


            matching.forEach(m => {

                const card =
                    document.createElement('div');


                card.className =
                    'bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col items-center justify-center gap-2';


                const mType =
                    m.message_type ||
                    'text';


                if (mType === 'image') {

                    card.innerHTML =
                        `<img src="${m.content}" class="h-24 w-full object-cover rounded cursor-pointer">`;


                    const img =
                        card.querySelector('img');


                    img.onclick = () =>
                        window.open(
                            m.content,
                            '_blank'
                        );


                } else if (mType === 'video') {

                    card.innerHTML =
                        `<video src="${m.content}" class="h-24 w-full rounded object-cover" controls></video>`;

                } else {

                    card.innerHTML =
                        `<a href="${m.content}" download class="text-xs text-indigo-400 underline font-semibold py-4">Download ${mType}</a>`;
                }


                grid.appendChild(card);
            });
        }


        function closeMediaGallery() {

            const modal =
                document.getElementById(
                    'media-gallery-modal'
                );


            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }


        /* =========================================================
           REALTIME
        ========================================================= */

        function subscribeToMessages() {

            if (messageSubscription) {

                supabaseClient.removeChannel(
                    messageSubscription
                );

                messageSubscription =
                    null;
            }


            if (!navigator.onLine) {
                return;
            }


            messageSubscription =
                supabaseClient
                    .channel(
                        `private_messages_${currentUser.username}_${targetUsername}`
                    )
                    .on(
                        'postgres_changes',
                        {
                            event: 'INSERT',
                            schema: 'public',
                            table: 'messages'
                        },
                        payload => {

                            const newMsg =
                                payload.new;


                            if (
                                (
                                    newMsg.sender_username ===
                                    targetUsername &&
                                    newMsg.receiver_username ===
                                    currentUser.username
                                ) ||
                                (
                                    newMsg.sender_username ===
                                    currentUser.username &&
                                    newMsg.receiver_username ===
                                    targetUsername
                                )
                            ) {

                                fetchMessages();
                            }
                        }
                    )
                    .subscribe();
        }


        /* =========================================================
           START
        ========================================================= */

        fetchMessages();

        subscribeToMessages();

    </script>
