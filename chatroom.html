        /*
         * DELETE
         */
        function executeDeleteMessage(
            msg,
            scope
        ) {

            undoTargetMessage = {
                msg,
                scope
            };

            if (scope === 'me') {

                const key =
                    `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`;

                let hiddenForMe = [];

                try {
                    hiddenForMe =
                        JSON.parse(
                            localStorage.getItem(key) ||
                            '[]'
                        );
                } catch (e) {}

                if (
                    !hiddenForMe.includes(
                        msg.id
                    )
                ) {
                    hiddenForMe.push(
                        msg.id
                    );
                }

                localStorage.setItem(
                    key,
                    JSON.stringify(hiddenForMe)
                );

            } else {

                msg.is_deleted_for_everyone =
                    true;
            }

            renderMessages(
                messagesCache
            );

            showUndoBanner(
                10,
                async () => {

                    if (
                        scope === 'everyone' &&
                        msg.id
                    ) {

                        const {
                            error
                        } =
                            await supabaseClient
                                .from('messages')
                                .update({
                                    is_deleted_for_everyone:
                                        true,
                                    content:
                                        '[Message deleted]',
                                    message_type:
                                        'text'
                                })
                                .eq(
                                    'id',
                                    msg.id
                                );

                        if (error) {
                            console.error(
                                'Delete error:',
                                error
                            );
                        }
                    }

                    await fetchMessages();
                }
            );
        }

        function showUndoBanner(
            seconds,
            onComplete
        ) {

            const banner =
                document.getElementById(
                    'undo-banner'
                );

            const countdownEl =
                document.getElementById(
                    'undo-countdown'
                );

            banner.classList.remove(
                'hidden'
            );

            banner.classList.add(
                'flex'
            );

            let timeLeft = seconds;

            countdownEl.textContent =
                timeLeft;

            if (pendingDeleteTimer) {
                clearInterval(
                    pendingDeleteTimer
                );
            }

            pendingDeleteTimer =
                setInterval(
                    async () => {

                        timeLeft--;

                        countdownEl.textContent =
                            timeLeft;

                        if (
                            timeLeft <= 0
                        ) {

                            clearInterval(
                                pendingDeleteTimer
                            );

                            pendingDeleteTimer =
                                null;

                            banner.classList.remove(
                                'flex'
                            );

                            banner.classList.add(
                                'hidden'
                            );

                            if (onComplete) {
                                await onComplete();
                            }
                        }

                    },
                    1000
                );
        }

        function triggerUndoAction() {

            if (pendingDeleteTimer) {
                clearInterval(
                    pendingDeleteTimer
                );

                pendingDeleteTimer =
                    null;
            }

            const banner =
                document.getElementById(
                    'undo-banner'
                );

            banner.classList.remove(
                'flex'
            );

            banner.classList.add(
                'hidden'
            );

            if (!undoTargetMessage) {
                return;
            }

            const {
                msg,
                scope
            } = undoTargetMessage;

            if (scope === 'me') {

                const key =
                    `chatlite_deleted_for_me_${currentUser.username}_${targetUsername}`;

                let hiddenForMe = [];

                try {
                    hiddenForMe =
                        JSON.parse(
                            localStorage.getItem(key) ||
                            '[]'
                        );
                } catch (e) {}

                hiddenForMe =
                    hiddenForMe.filter(
                        id =>
                            id !== msg.id
                    );

                localStorage.setItem(
                    key,
                    JSON.stringify(
                        hiddenForMe
                    )
                );

            } else {

                msg.is_deleted_for_everyone =
                    false;
            }

            renderMessages(
                messagesCache
            );

            undoTargetMessage =
                null;
        }

        /*
         * AUDIO
         */
        function toggleAudioPlay(
            audioId,
            btn
        ) {

            const audio =
                document.getElementById(
                    audioId
                );

            if (!audio) return;

            if (audio.paused) {

                audio.play()
                    .catch(err =>
                        console.warn(
                            'Audio play failed:',
                            err
                        )
                    );

                btn.textContent =
                    '⏸';

            } else {

                audio.pause();

                btn.textContent =
                    '▶';
            }
        }

        function seekAudio(
            audioId,
            value
        ) {

            const audio =
                document.getElementById(
                    audioId
                );

            if (
                !audio ||
                !audio.duration
            ) {
                return;
            }

            audio.currentTime =
                (
                    value / 100
                ) *
                audio.duration;
        }

        function toggleAudioSpeed(
            audioId,
            speedBtn
        ) {

            const audio =
                document.getElementById(
                    audioId
                );

            if (!audio) return;

            let nextRate =
                audio.playbackRate === 1
                    ? 1.5
                    : audio.playbackRate === 1.5
                        ? 2
                        : 1;

            audio.playbackRate =
                nextRate;

            speedBtn.textContent =
                nextRate + 'x';
        }

        function formatAudioTime(
            secs
        ) {

            if (isNaN(secs)) {
                return '0:00';
            }

            const mins =
                Math.floor(
                    secs / 60
                );

            const rSecs =
                Math.floor(
                    secs % 60
                );

            return `${mins}:${
                rSecs < 10
                    ? '0'
                    : ''
            }${rSecs}`;
        }

        /*
         * FILE STAGING
         */
        function stageFileSelected(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();

            const progressBar =
                document.getElementById(
                    'upload-progress-bar'
                );

            const statusText =
                document.getElementById(
                    'upload-status-text'
                );

            const previewBar =
                document.getElementById(
                    'media-preview-bar'
                );

            previewBar.classList.remove(
                'hidden'
            );

            previewBar.classList.add(
                'flex'
            );

            progressBar.style.width =
                '10%';

            statusText.textContent =
                'Reading file stream...';

            reader.onprogress =
                data => {

                    if (
                        data.lengthComputable
                    ) {

                        const percent =
                            Math.round(
                                (
                                    data.loaded /
                                    data.total
                                ) * 90
                            );

                        progressBar.style.width =
                            percent + '%';
                    }
                };

            reader.onload =
                function(e) {

                    progressBar.style.width =
                        '100%';

                    statusText.textContent =
                        'Ready! Hit the Send button to dispatch.';

                    let type = 'file';

                    if (
                        file.type.startsWith(
                            'image/'
                        )
                    ) {
                        type = 'image';
                    } else if (
                        file.type.startsWith(
                            'video/'
                        )
                    ) {
                        type = 'video';
                    } else if (
                        file.type.startsWith(
                            'audio/'
                        )
                    ) {
                        type = 'audio';
                    }

                    stagedPayload = {
                        content:
                            e.target.result,
                        type
                    };

                    const previewContainer =
                        document.getElementById(
                            'preview-container'
                        );

                    previewContainer.innerHTML =
                        '';

                    if (type === 'image') {

                        const img =
                            document.createElement(
                                'img'
                            );

                        img.src =
                            e.target.result;

                        img.className =
                            'max-h-20 rounded object-contain';

                        previewContainer.appendChild(
                            img
                        );

                    } else if (
                        type === 'video'
                    ) {

                        const video =
                            document.createElement(
                                'video'
                            );

                        video.src =
                            e.target.result;

                        video.className =
                            'max-h-20 rounded';

                        video.controls =
                            true;

                        previewContainer.appendChild(
                            video
                        );

                    } else {

                        const span =
                            document.createElement(
                                'span'
                            );

                        span.className =
                            'font-semibold';

                        span.textContent =
                            `Staged File: ${file.name}`;

                        previewContainer.appendChild(
                            span
                        );
                    }
                };

            reader.onerror =
                () => {

                    statusText.textContent =
                        'Could not read this file.';

                    progressBar.style.width =
                        '0%';
                };

            reader.readAsDataURL(
                file
            );
        }

        function clearStagedMedia() {

            stagedPayload = null;

            recordedBlob = null;

            const bar =
                document.getElementById(
                    'media-preview-bar'
                );

            bar.classList.add(
                'hidden'
            );

            bar.classList.remove(
                'flex'
            );

            document.getElementById(
                'upload-progress-bar'
            ).style.width =
                '0%';

            document.getElementById(
                'media-file-input'
            ).value = '';

            document.getElementById(
                'camera-photo-input'
            ).value = '';

            document.getElementById(
                'camera-video-input'
            ).value = '';
        }

        /*
         * VOICE RECORDING
         */
        async function startVoiceRecording() {

            try {

                const stream =
                    await navigator.mediaDevices
                        .getUserMedia({
                            audio: true
                        });

                mediaRecorder =
                    new MediaRecorder(
                        stream
                    );

                audioChunks = [];

                mediaRecorder.ondataavailable =
                    e => {

                        if (e.data.size > 0) {
                            audioChunks.push(
                                e.data
                            );
                        }
                    };

                mediaRecorder.onstop =
                    () => {

                        recordedBlob =
                            new Blob(
                                audioChunks,
                                {
                                    type:
                                        'audio/webm'
                                }
                            );
                    };

                mediaRecorder.start();

                isRecording = true;
                isPaused = false;

                recordedBlob = null;

                document
                    .getElementById(
                        'message-input'
                    )
                    .classList.add(
                        'hidden'
                    );

                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.add(
                        'flex'
                    );

                document
                    .getElementById(
                        'mic-btn'
                    )
                    .classList.add(
                        'hidden'
                    );

                recordingSeconds = 0;

                document
                    .getElementById(
                        'recording-timer'
                    )
                    .textContent =
                    '0:00';

                recordingTimerInterval =
                    setInterval(
                        () => {

                            if (!isPaused) {

                                recordingSeconds++;

                                const m =
                                    Math.floor(
                                        recordingSeconds /
                                        60
                                    );

                                const s =
                                    recordingSeconds %
                                    60;

                                document
                                    .getElementById(
                                        'recording-timer'
                                    )
                                    .textContent =
                                    `${m}:${
                                        s < 10
                                            ? '0'
                                            : ''
                                    }${s}`;
                            }

                        },
                        1000
                    );

            } catch (err) {

                console.error(
                    'Microphone error:',
                    err
                );

                alert(
                    'Microphone access denied or unavailable.'
                );
            }
        }

        function togglePauseRecording() {

            if (!mediaRecorder) {
                return;
            }

            const btn =
                document.getElementById(
                    'pause-rec-btn'
                );

            if (!isPaused) {

                mediaRecorder.pause();

                isPaused = true;

                btn.textContent =
                    '▶ Resume';

            } else {

                mediaRecorder.resume();

                isPaused = false;

                btn.textContent =
                    '⏸ Pause';
            }
        }

        function stopRecordingOnly() {

            if (
                mediaRecorder &&
                (
                    isRecording ||
                    isPaused
                )
            ) {

                if (
                    mediaRecorder.state !==
                    'inactive'
                ) {
                    mediaRecorder.stop();
                }

                isRecording = false;
                isPaused = false;

                clearInterval(
                    recordingTimerInterval
                );

                if (mediaRecorder.stream) {

                    mediaRecorder.stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );
                }

                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.add(
                        'hidden'
                    );

                document
                    .getElementById(
                        'recording-ui'
                    )
                    .classList.remove(
                        'flex'
                    );

                document
                    .getElementById(
                        'message-input'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'mic-btn'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'media-preview-bar'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'media-preview-bar'
                    )
                    .classList.add(
                        'flex'
                    );

                document
                    .getElementById(
                        'preview-container'
                    )
                    .innerHTML =
                    `<span class="text-indigo-400 font-bold text-xs">
                        Voice Note Recorded (${recordingSeconds}s). Ready to Send.
                    </span>`;

                document
                    .getElementById(
                        'upload-progress-bar'
                    )
                    .style.width =
                    '100%';

                document
                    .getElementById(
                        'upload-status-text'
                    )
                    .textContent =
                    'Hit the Send button to dispatch voice note.';
            }
        }

        function cancelRecording() {

            if (
                mediaRecorder &&
                (
                    isRecording ||
                    isPaused
                )
            ) {

                if (
                    mediaRecorder.state !==
                    'inactive'
                ) {
                    mediaRecorder.stop();
                }

                if (mediaRecorder.stream) {

                    mediaRecorder.stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );
                }
            }

            resetRecordingUI();

            clearStagedMedia();
        }

        function resetRecordingUI() {

            clearInterval(
                recordingTimerInterval
            );

            isRecording = false;
            isPaused = false;

            document
                .getElementById(
                    'recording-ui'
                )
                .classList.add(
                    'hidden'
                );

            document
                .getElementById(
                    'recording-ui'
                )
                .classList.remove(
                    'flex'
                );

            document
                .getElementById(
                    'message-input'
                )
                .classList.remove(
                    'hidden'
                );

            document
                .getElementById(
                    'mic-btn'
                )
                .classList.remove(
                    'hidden'
                );
        }

        /*
         * FORM SUBMIT
         */
        async function handleFormSubmit(e) {

            e.preventDefault();

            if (isRecording) {
                stopRecordingOnly();
                return;
            }

            let replyMeta = null;

            if (replyingToMessage) {

                const repType =
                    replyingToMessage.message_type ||
                    'text';

                replyMeta = {
                    sender:
                        replyingToMessage.sender_username ===
                        currentUser.username
                            ? 'You'
                            : targetName,

                    content:
                        repType === 'text'
                            ? replyingToMessage.content
                            : `[${repType}]`
                };
            }

            if (recordedBlob) {

                const blobToSend =
                    recordedBlob;

                recordedBlob = null;

                const reader =
                    new FileReader();

                reader.readAsDataURL(
                    blobToSend
                );

                reader.onloadend =
                    async () => {

                        await sendPayloadToSupabase(
                            reader.result,
                            'audio',
                            replyMeta
                        );

                        resetRecordingUI();

                        clearStagedMedia();

                        cancelReply();
                    };

                return;
            }

            if (stagedPayload) {

                const payloadToSend =
                    stagedPayload;

                stagedPayload = null;

                await sendPayloadToSupabase(
                    payloadToSend.content,
                    payloadToSend.type,
                    replyMeta
                );

                clearStagedMedia();

                cancelReply();

                return;
            }

            const input =
                document.getElementById(
                    'message-input'
                );

            const content =
                input.value.trim();

            if (!content) {
                return;
            }

            input.value = '';

            await sendPayloadToSupabase(
                content,
                'text',
                replyMeta
            );

            cancelReply();
        }

        /*
         * SAFE DATABASE INSERT
         *
         * The important change:
         * - We do not use .select() on the INSERT.
         * - We don't automatically treat a 400 as "offline".
         * - We first attempt the normal messages schema.
         * - If optional fields are rejected, we retry
         *   using the core message fields.
         */
        async function insertMessageSafely(item) {

            const fullPayload = {
                sender_username:
                    item.sender_username,

                receiver_username:
                    item.receiver_username,

                content:
                    item.content,

                message_type:
                    item.message_type || 'text',

                reply_to:
                    item.reply_to || null,

                is_read:
                    item.is_read === true,

                created_at:
                    item.created_at ||
                    new Date().toISOString()
            };

            /*
             * FIRST ATTEMPT
             */
            let result =
                await supabaseClient
                    .from('messages')
                    .insert([
                        fullPayload
                    ]);

            if (!result.error) {

                /*
                 * Fetch the conversation again instead
                 * of depending on INSERT...SELECT.
                 */
                await fetchMessages();

                const latest =
                    messagesCache
                        .filter(
                            m =>
                                m.sender_username ===
                                    item.sender_username &&
                                m.receiver_username ===
                                    item.receiver_username &&
                                m.content ===
                                    item.content
                        )
                        .sort(
                            (a, b) =>
                                new Date(
                                    b.created_at || 0
                                ) -
                                new Date(
                                    a.created_at || 0
                                )
                        )[0];

                return {
                    success: true,
                    message: latest || {
                        ...fullPayload,
                        is_offline_pending:
                            false
                    }
                };
            }

            console.warn(
                'Normal message insert failed:',
                result.error
            );

            /*
             * FALLBACK
             *
             * If one of the optional fields is the
             * problem, try only the core fields that
             * are required to deliver a message.
             */
            const corePayload = {
                sender_username:
                    item.sender_username,

                receiver_username:
                    item.receiver_username,

                content:
                    item.content
            };

            const fallbackResult =
                await supabaseClient
                    .from('messages')
                    .insert([
                        corePayload
                    ]);

            if (!fallbackResult.error) {

                await fetchMessages();

                const latest =
                    messagesCache
                        .filter(
                            m =>
                                m.sender_username ===
                                    item.sender_username &&
                                m.receiver_username ===
                                    item.receiver_username &&
                                m.content ===
                                    item.content
                        )
                        .sort(
                            (a, b) =>
                                new Date(
                                    b.created_at || 0
                                ) -
                                new Date(
                                    a.created_at || 0
                                )
                        )[0];

                return {
                    success: true,
                    message: latest || {
                        ...corePayload,
                        message_type:
                            'text',
                        is_read:
                            false,
                        created_at:
                            new Date().toISOString(),
                        is_offline_pending:
                            false
                    }
                };
            }

            console.error(
                'MESSAGE INSERT FAILED:',
                fallbackResult.error
            );

            return {
                success: false,
                error:
                    fallbackResult.error
            };
        }

        /*
         * SEND
         */
        async function sendPayloadToSupabase(
            content,
            type,
            replyMeta = null
        ) {

            const payload = {
                sender_username:
                    currentUser.username,

                receiver_username:
                    targetUsername,

                content:
                    content,

                message_type:
                    type || 'text',

                reply_to:
                    replyMeta || null,

                is_read:
                    false,

                created_at:
                    new Date().toISOString()
            };

            /*
             * TRUE OFFLINE CONDITION
             */
            if (!navigator.onLine) {

                const offlineQueue =
                    loadOfflineQueue();

                offlineQueue.push({
                    ...payload,
                    is_offline_pending:
                        true
                });

                saveOfflineQueue(
                    offlineQueue
                );

                renderMessages(
                    messagesCache
                );

                return;
            }

            /*
             * ONLINE:
             * Try to actually deliver the message.
             */
            const result =
                await insertMessageSafely(
                    payload
                );

            if (result.success) {

                /*
                 * fetchMessages() has already
                 * refreshed the cache.
                 */
                renderMessages(
                    messagesCache
                );

                return;
            }

            /*
             * IMPORTANT:
             *
             * A database error is NOT the same
             * thing as being offline.
             *
             * Therefore we do not put it into
             * the offline queue automatically.
             */
            console.error(
                'Message could not be delivered:',
                result.error
            );

            alert(
                'The message could not be delivered. Please try again.'
            );
        }

        /*
         * MEDIA GALLERY
         */
        function openMediaGallery(
            typeFilter
        ) {

            const modal =
                document.getElementById(
                    'media-gallery-modal'
                );

            const grid =
                document.getElementById(
                    'gallery-content-grid'
                );

            const title =
                document.getElementById(
                    'gallery-title'
                );

            modal.classList.remove(
                'hidden'
            );

            modal.classList.add(
                'flex'
            );

            grid.innerHTML = '';

            title.textContent =
                `${typeFilter.toUpperCase()} Gallery`;

            const matching =
                messagesCache.filter(
                    m => {

                        if (
                            m.is_deleted_for_everyone
                        ) {
                            return false;
                        }

                        const mType =
                            m.message_type ||
                            'text';

                        if (
                            typeFilter === 'image' &&
                            mType === 'image'
                        ) {
                            return true;
                        }

                        if (
                            typeFilter === 'video' &&
                            mType === 'video'
                        ) {
                            return true;
                        }

                        if (
                            typeFilter === 'file' &&
                            (
                                mType === 'file' ||
                                mType === 'audio'
                            )
                        ) {
                            return true;
                        }

                        return false;
                    }
                );

            if (
                matching.length === 0
            ) {

                grid.innerHTML =
                    `<span class="text-xs text-slate-500 col-span-2 text-center py-6">
                        No ${typeFilter}s found in this chat.
                    </span>`;

                return;
            }

            matching.forEach(
                m => {

                    const card =
                        document.createElement(
                            'div'
                        );

                    card.className =
                        'bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col items-center justify-center gap-2';

                    const mType =
                        m.message_type ||
                        'text';

                    if (
                        mType === 'image'
                    ) {

                        const image =
                            document.createElement(
                                'img'
                            );

                        image.src =
                            m.content;

                        image.className =
                            'h-24 w-full object-cover rounded cursor-pointer';

                        image.onclick =
                            () =>
                                window.open(
                                    m.content
                                );

                        card.appendChild(
                            image
                        );

                    } else if (
                        mType === 'video'
                    ) {

                        const video =
                            document.createElement(
                                'video'
                            );

                        video.src =
                            m.content;

                        video.className =
                            'h-24 w-full rounded object-cover';

                        video.controls =
                            true;

                        card.appendChild(
                            video
                        );

                    } else {

                        const link =
                            document.createElement(
                                'a'
                            );

                        link.href =
                            m.content;

                        link.download =
                            '';

                        link.className =
                            'text-xs text-indigo-400 underline font-semibold py-4';

                        link.textContent =
                            `Download ${mType}`;

                        card.appendChild(
                            link
                        );
                    }

                    grid.appendChild(
                        card
                    );
                }
            );
        }

        function closeMediaGallery() {

            const modal =
                document.getElementById(
                    'media-gallery-modal'
                );

            modal.classList.remove(
                'flex'
            );

            modal.classList.add(
                'hidden'
            );
        }

        /*
         * REALTIME
         */
        function subscribeToMessages() {

            if (messageSubscription) {

                supabaseClient.removeChannel(
                    messageSubscription
                );

                messageSubscription =
                    null;
            }

            messageSubscription =
                supabaseClient
                    .channel(
                        `private-chat-${currentUser.username}-${targetUsername}`
                    )
                    .on(
                        'postgres_changes',
                        {
                            event:
                                'INSERT',

                            schema:
                                'public',

                            table:
                                'messages'
                        },
                        payload => {

                            const newMsg =
                                payload.new;

                            const belongsToConversation =
                                (
                                    newMsg.sender_username ===
                                        targetUsername &&
                                    newMsg.receiver_username ===
                                        currentUser.username
                                ) ||
                                (
                                    newMsg.sender_username ===
                                        currentUser.username &&
                                    newMsg.receiver_username ===
                                        targetUsername
                                );

                            if (
                                belongsToConversation
                            ) {
                                fetchMessages();
                            }
                        }
                    )
                    .subscribe(
                        status => {

                            console.log(
                                'Messages realtime status:',
                                status
                            );
                        }
                    );
        }

        /*
         * INITIAL LOAD
         */
        fetchMessages();

        subscribeToMessages();

        /*
         * CLEANUP
         */
        window.addEventListener(
            'beforeunload',
            () => {

                if (
                    messageSubscription
                ) {

                    supabaseClient.removeChannel(
                        messageSubscription
                    );

                    messageSubscription =
                        null;
                }
            }
        );
    </script>
