<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Conversation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative overflow-hidden shadow-2xl bg-slate-900 border-x border-slate-800 h-screen">
        <!-- Header -->
        <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900 z-10">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='chatlist.html'" class="text-slate-400 hover:text-white text-sm cursor-pointer">&larr;</button>
                <div class="w-9 h-9 rounded-full bg-indigo-600/30 border border-indigo-500/30 flex items-center justify-center font-bold text-indigo-400 text-sm overflow-hidden" id="active-chat-avatar">U</div>
                <div>
                    <h3 class="font-bold text-sm" id="active-chat-name">Username</h3>
                    <span class="text-[10px] text-slate-400" id="active-chat-gender">Gender</span>
                </div>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-950 flex flex-col">
            <!-- Messages load here -->
        </div>

        <!-- Hidden File Inputs for Gallery, Documents, and Camera -->
        <input type="file" id="media-file-input" class="hidden" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt" onchange="handleFileSelected(event)">
        <input type="file" id="camera-photo-input" class="hidden" accept="image/*" capture="environment" onchange="handleFileSelected(event)">
        <input type="file" id="camera-video-input" class="hidden" accept="video/*" capture="environment" onchange="handleFileSelected(event)">

        <!-- Attachment Options Popup Menu -->
        <div id="attachment-menu" class="hidden absolute bottom-16 left-3 bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-2 z-30 flex flex-col gap-1 w-48 backdrop-blur-md">
            <button onclick="document.getElementById('media-file-input').click(); toggleAttachmentMenu();" class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📁 File
            </button>
            <button onclick="document.getElementById('camera-photo-input').click(); toggleAttachmentMenu();" class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📷 Take Photo
            </button>
            <button onclick="document.getElementById('camera-video-input').click(); toggleAttachmentMenu();" class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl transition-all cursor-pointer">
                📹 Record Video Note
            </button>
        </div>

        <!-- Bottom Input Bar -->
        <form id="chat-form" onsubmit="handleFormSubmit(event)" class="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2 relative">
            <button type="button" id="attach-btn" onclick="toggleAttachmentMenu()" class="p-2 text-slate-400 hover:text-indigo-400 transition-colors text-lg font-bold cursor-pointer" title="Attach Media">
                +
            </button>
            
            <!-- Standard Text Input -->
            <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-white">
            
            <!-- Live Recording Indicator UI (Hidden by default) -->
            <div id="recording-ui" class="hidden flex-1 items-center justify-between px-3 py-2 bg-slate-950 border border-red-500/50 rounded-xl">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="recording-timer" class="text-xs font-semibold text-red-400">0:00</span>
                </div>
                <button type="button" onclick="cancelRecording()" class="text-xs text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded-lg">Cancel</button>
            </div>

            <button type="button" id="mic-btn" onclick="startVoiceRecording()" class="p-2 text-slate-400 hover:text-red-400 transition-colors cursor-pointer" title="Record Voice Note">
                🎤
            </button>
            
            <button type="submit" id="send-btn" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl text-sm transition-all cursor-pointer text-white">Send</button>
        </form>
    </div>

    <script src="supabase.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('chatlite_user'));
        const urlParams = new URLSearchParams(window.location.search);
        const targetUsername = urlParams.get('to');
        const targetName = urlParams.get('name');
        const targetGender = urlParams.get('gender');

        if (!currentUser || !targetUsername) {
            window.location.href = 'chatlist.html';
        }

        document.getElementById('active-chat-name').textContent = targetName;
        document.getElementById('active-chat-gender').textContent = `@${targetUsername} • ${targetGender}`;
        document.getElementById('active-chat-avatar').textContent = targetName.charAt(0).toUpperCase();

        let messageSubscription = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingTimerInterval = null;
        let recordingSeconds = 0;

        function toggleAttachmentMenu() {
            const menu = document.getElementById('attachment-menu');
            menu.classList.toggle('hidden');
        }

        async function fetchMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('*')
                .or(`and(sender_username.eq.${currentUser.username},receiver_username.eq.${targetUsername}),and(sender_username.eq.${targetUsername},receiver_username.eq.${currentUser.username})`)
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Error fetching messages:', error);
                return;
            }

            if (messages) {
                messages.forEach(msg => appendMessageToDOM(msg));
                container.scrollTop = container.scrollHeight;
            }
        }

        function appendMessageToDOM(msg) {
            const container = document.getElementById('chat-messages');
            const isMe = msg.sender_username === currentUser.username;

            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[80%] px-3 py-2 rounded-2xl text-sm ${
                isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'
            }`;

            const type = msg.message_type || 'text';
            if (type === 'image') {
                bubble.innerHTML = `<img src="${msg.content}" class="rounded-xl max-h-60 w-full object-cover cursor-pointer" onclick="window.open('${msg.content}')">`;
            } else if (type === 'video') {
                bubble.innerHTML = `<video src="${msg.content}" controls class="rounded-xl max-h-60 w-full"></video>`;
            } else if (type === 'audio') {
                // Compact Custom Styled Voice Note Bubble
                bubble.innerHTML = `
                    <div class="flex items-center gap-3 py-1 px-1 min-w-[160px]">
                        <button onclick="const audio = this.nextElementSibling; if(audio.paused){audio.play(); this.textContent='⏸';}else{audio.pause(); this.textContent='▶';}" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-xs font-bold transition-all flex-shrink-0 cursor-pointer">▶</button>
                        <audio src="${msg.content}" class="hidden"></audio>
                        <div class="flex flex-col flex-1">
                            <span class="text-[11px] font-medium tracking-wide opacity-90">Voice Note</span>
                            <div class="w-full bg-white/20 h-1 rounded-full mt-1 overflow-hidden">
                                <div class="bg-white h-full w-full opacity-60"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (type === 'file') {
                bubble.innerHTML = `<a href="${msg.content}" download="file" class="flex items-center gap-2 underline text-xs font-semibold py-1">📁 File Attachment</a>`;
            } else {
                bubble.textContent = msg.content;
            }

            const time = document.createElement('span');
            time.className = 'text-[10px] text-slate-500 px-1';
            time.textContent = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            wrapper.appendChild(bubble);
            wrapper.appendChild(time);
            container.appendChild(wrapper);
        }

        async function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result;
                let type = 'file';
                if (file.type.startsWith('image/')) type = 'image';
                else if (file.type.startsWith('video/')) type = 'video';
                else if (file.type.startsWith('audio/')) type = 'audio';

                await sendMediaPayload(base64Data, type);
            };
            reader.readAsDataURL(file);
        }

        async function sendMediaPayload(content, type) {
            const payload = {
                sender_username: currentUser.username,
                receiver_username: targetUsername,
                content: content,
                message_type: type
            };

            let { error } = await supabaseClient.from('messages').insert([payload]);

            if (error && error.message.includes('message_type')) {
                const fallbackPayload = {
                    sender_username: currentUser.username,
                    receiver_username: targetUsername,
                    content: content
                };
                const retry = await supabaseClient.from('messages').insert([fallbackPayload]);
                error = retry.error;
            }

            if (error) {
                alert('Failed to send media: ' + error.message);
            }
        }

        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.start();
                isRecording = true;

                // UI Adjustments for Recording Mode
                document.getElementById('message-input').classList.add('hidden');
                document.getElementById('recording-ui').classList.remove('hidden');
                document.getElementById('recording-ui').classList.add('flex');
                
                // Change Mic button to a stop/square symbol or highlight it red
                const micBtn = document.getElementById('mic-btn');
                micBtn.innerHTML = '⏹';
                micBtn.setAttribute('onclick', 'stopAndSendVoiceRecording()');
                micBtn.classList.add('text-red-500', 'animate-pulse');

                recordingSeconds = 0;
                document.getElementById('recording-timer').textContent = '0:00';
                recordingTimerInterval = setInterval(() => {
                    recordingSeconds++;
                    const mins = Math.floor(recordingSeconds / 60);
                    const secs = recordingSeconds % 60;
                    document.getElementById('recording-timer').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);

            } catch (err) {
                alert('Microphone access denied or unavailable.');
            }
        }

        function cancelRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.ondataavailable = null; // Discard data
            }
            resetRecordingUI();
        }

        function stopAndSendVoiceRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        await sendMediaPayload(reader.result, 'audio');
                    };
                };
                mediaRecorder.stop();
                isRecording = false;
            }
            resetRecordingUI();
        }

        function resetRecordingUI() {
            clearInterval(recordingTimerInterval);
            isRecording = false;

            document.getElementById('recording-ui').classList.add('hidden');
            document.getElementById('recording-ui').classList.remove('flex');
            document.getElementById('message-input').classList.remove('hidden');

            const micBtn = document.getElementById('mic-btn');
            micBtn.innerHTML = '🎤';
            micBtn.setAttribute('onclick', 'startVoiceRecording()');
            micBtn.classList.remove('text-red-500', 'animate-pulse');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            // If currently recording, hitting send button acts as "Stop & Send Voice Note"
            if (isRecording) {
                stopAndSendVoiceRecording();
                return;
            }

            // Normal Text Message Send Flow
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content) return;

            const payload = {
                sender_username: currentUser.username,
                receiver_username: targetUsername,
                content: content,
                message_type: 'text'
            };

            let { error } = await supabaseClient.from('messages').insert([payload]);

            if (error && error.message.includes('message_type')) {
                const fallbackPayload = {
                    sender_username: currentUser.username,
                    receiver_username: targetUsername,
                    content: content
                };
                const retry = await supabaseClient.from('messages').insert([fallbackPayload]);
                error = retry.error;
            }

            if (error) {
                alert('Failed to send message: ' + error.message);
                return;
            }

            input.value = '';
        }

        function subscribeToMessages() {
            messageSubscription = supabaseClient
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    const msg = payload.new;
                    if (
                        (msg.sender_username === currentUser.username && msg.receiver_username === targetUsername) ||
                        (msg.sender_username === targetUsername && msg.receiver_username === currentUser.username)
                    ) {
                        appendMessageToDOM(msg);
                        const container = document.getElementById('chat-messages');
                        container.scrollTop = container.scrollHeight;
                    }
                })
                .subscribe();
        }

        fetchMessages();
        subscribeToMessages();
    </script>
</body>
</html>
