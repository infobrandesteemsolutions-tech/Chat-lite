<style>
  html,
  body {
    height: 100%;
    margin: 0;
    background: #f1f5f9;
    font-family: Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* =========================================
     MAIN CHAT WIDTH
     ========================================= */

  header,
  #search-bar,
  #reply-preview,
  #media-preview,
  #recording-bar,
  #message-form {
    width: 100%;
  }

  header {
    flex-shrink: 0;
  }

  /*
   * Keeps the actual chat comfortably narrow
   * on large screens.
   */
  .chat-width {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  /* =========================================
     MESSAGE AREA
     ========================================= */

  #messages {
    scrollbar-width: thin;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 18px 14px 24px;
  }

  .message-bubble {
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  /*
   * Prevent very long desktop bubbles.
   */
  #messages .message-bubble {
    max-width: min(78%, 520px);
  }

  .message-image,
  .message-video {
    max-width: 280px;
    max-height: 340px;
    border-radius: 14px;
    object-fit: cover;
    display: block;
  }

  .message-audio {
    width: 240px;
    max-width: 100%;
  }

  /* =========================================
     HEADER
     ========================================= */

  header {
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(10px);
  }

  header > div,
  header > button {
    flex-shrink: 0;
  }

  #target-name {
    font-size: 15px;
  }

  #target-info {
    font-size: 11px;
  }

  #target-avatar {
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
  }

  /* =========================================
     SEARCH
     ========================================= */

  #search-bar {
    background: white;
  }

  #search-bar > input {
    max-width: 760px;
    margin: 0 auto;
    display: block;
  }

  /* =========================================
     REPLY PREVIEW
     ========================================= */

  #reply-preview {
    background: white;
  }

  #reply-preview > div {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  .reply-quote {
    border-left: 3px solid #6366f1;
    background: rgba(99, 102, 241, 0.08);
  }

  /* =========================================
     MEDIA PREVIEW
     ========================================= */

  #media-preview {
    background: white;
  }

  #media-preview > div {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  /* =========================================
     ATTACHMENT MENU
     ========================================= */

  #attachment-menu {
    position: relative;
    background: transparent;
    border: 0;
    padding: 8px 12px 10px;
  }

  #attachment-menu > div {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;

    display: flex;
    justify-content: center;
    gap: 10px;

    padding: 12px;

    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 18px;

    box-shadow:
      0 8px 25px rgba(15, 23, 42, 0.10);
  }

  /*
   * Turn the four-column grid into four
   * compact attachment buttons.
   */
  #attachment-menu button {
    flex: 1;
    min-width: 0;
    max-width: 130px;
    height: 68px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 4px;

    padding: 8px;

    border-radius: 14px;

    background: #f8fafc;
    border: 1px solid #e2e8f0;

    transition:
      transform 0.15s ease,
      background 0.15s ease;
  }

  #attachment-menu button:hover {
    background: #f1f5f9;
    transform: translateY(-1px);
  }

  #attachment-menu button:active {
    transform: scale(0.96);
  }

  #attachment-menu button span:first-child {
    font-size: 22px;
    line-height: 1;
  }

  #attachment-menu button span:last-child {
    font-size: 11px;
    color: #475569;
  }

  /* =========================================
     RECORDING
     ========================================= */

  #recording-bar {
    background: #fff;
  }

  #recording-bar > div {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  .recording-pulse {
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.45;
    }
  }

  /* =========================================
     COMPOSER
     ========================================= */

  #message-form {
    background: rgba(255, 255, 255, 0.98);
    padding: 10px 12px;
    gap: 8px;
  }

  #message-form > * {
    flex-shrink: 0;
  }

  /*
   * Center composer on desktop.
   */
  #message-form {
    display: flex;
    justify-content: center;
  }

  #message-form > input {
    width: 100%;
    max-width: 620px;
  }

  /*
   * + / microphone / send buttons
   */
  #message-form button {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;
  }

  /*
   * Attachment + button
   */
  #message-form button:first-child {
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    color: #334155;

    font-size: 25px;
    font-weight: 300;

    line-height: 1;

    transition:
      background 0.15s ease,
      transform 0.15s ease;
  }

  #message-form button:first-child:hover {
    background: #e2e8f0;
  }

  #message-form button:first-child:active {
    transform: scale(0.94);
  }

  /*
   * Microphone button
   */
  #mic-button {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    font-size: 18px;
  }

  /*
   * Send button
   */
  #message-form button[type="submit"] {
    background: #4f46e5;
    box-shadow: 0 3px 10px rgba(79, 70, 229, 0.22);
    font-size: 17px;
  }

  #message-form button[type="submit"]:active {
    transform: scale(0.94);
  }

  /*
   * Message input
   */
  #message-input {
    height: 42px;
    min-height: 42px;
    border-color: #e2e8f0;
    background: #f8fafc;
    font-size: 14px;
  }

  #message-input:focus {
    background: white;
  }

  /* =========================================
     MESSAGE OPTIONS
     ========================================= */

  .message-options {
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.18);
  }

  /* =========================================
     UNDO
     ========================================= */

  #undo-banner {
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
  }

  /* =========================================
     MEDIA GALLERY
     ========================================= */

  #media-gallery img,
  #media-gallery video {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
  }

  /* =========================================
     MOBILE
     ========================================= */

  @media (max-width: 640px) {

    #messages {
      padding-left: 10px;
      padding-right: 10px;
    }

    #messages .message-bubble {
      max-width: 84%;
    }

    .message-image,
    .message-video {
      max-width: 240px;
      max-height: 300px;
    }

    #attachment-menu {
      padding: 7px 8px 9px;
    }

    #attachment-menu > div {
      gap: 6px;
      padding: 9px;
      border-radius: 16px;
    }

    #attachment-menu button {
      height: 62px;
      padding: 6px 3px;
      border-radius: 12px;
    }

    #attachment-menu button span:first-child {
      font-size: 20px;
    }

    #attachment-menu button span:last-child {
      font-size: 10px;
    }

    #message-form {
      padding:
        8px
        max(8px, env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
    }

    #message-form button {
      width: 40px;
      height: 40px;
      min-width: 40px;
    }

    #message-input {
      height: 40px;
      min-height: 40px;
      padding-left: 15px;
      padding-right: 15px;
    }
  }

  /* =========================================
     VERY SMALL PHONES
     ========================================= */

  @media (max-width: 380px) {

    #message-form {
      gap: 5px;
    }

    #message-form button {
      width: 38px;
      height: 38px;
      min-width: 38px;
    }

    #message-input {
      padding-left: 12px;
      padding-right: 12px;
    }

    #attachment-menu button {
      height: 58px;
    }
  }
</style>
