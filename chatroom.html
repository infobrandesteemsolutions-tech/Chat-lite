<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html, body {
    height: 100%;
    height: 100dvh;
    margin: 0;
    background: #f1f5f9;
    font-family: Arial, sans-serif;
    overflow: hidden;
}
* { box-sizing: border-box; }
.app-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    background: #ffffff;
}
#messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #f8fafc;
}
.message-bubble {
    word-break: break-word;
    overflow-wrap: anywhere;
    max-width: min(85%, 520px);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}
.message-image, .message-video {
    max-width: 260px;
    max-height: 320px;
    border-radius: 12px;
    object-fit: cover;
    display: block;
}
.message-audio { width: 240px; max-width: 100%; }
.recording-pulse { animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.status-dot { transition: opacity .2s; }
</style>
</head>
<body>

<div class="app-container">
    <!-- HEADER -->
    <header class="bg-white border-b px-4 py-3 flex items-center gap-3 shrink-0">
        <button onclick="goBack()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-xl">←</button>
        <div id="target-avatar" class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">?</div>
        <div class="flex-1 min-w-0">
            <div id="target-name" class="font-semibold truncate text-sm">Chat</div>
            <div id="target-info" class="text-xs text-slate-500 truncate"></div>
        </div>
        <button onclick="toggleSearch()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-sm">🔍</button>
    </header>

    <!-- SEARCH -->
    <div id="search-bar" class="hidden bg-white border-b px-4 py-2 shrink-0">
        <input id="search-input" type="text" placeholder="Search messages..." class="w-full border rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-200" oninput="renderMessages()">
    </div>

    <!-- CONNECTION STATUS -->
    <div id="status-bar" class="hidden text-center text-xs py-1 shrink-0"></div>

    <!-- MESSAGES -->
    <main id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></main>

    <div id="loading-message" class="text-center text-xs text-slate-400 py-2 shrink-0">Loading messages...</div>

    <!-- REPLY PREVIEW (kept minimal, no-op UI removed from old build) -->

    <!-- MEDIA PREVIEW -->
    <div id="media-preview" class="hidden bg-slate-50 border-t px-4 py-2 shrink-0">
        <div class="flex items-center gap-3">
            <div id="media-preview-content" class="w-12 h-12 rounded-lg bg-slate-200 overflow-hidden flex items-center justify-center"></div>
            <div class="flex-1 min-w-0">
                <div class="font-medium text-xs truncate" id="media-file-name"></div>
                <div class="text-[10px] text-slate-400" id="media-file-type"></div>
            </div>
            <button onclick="cancelMedia()" class="w-7 h-7 rounded-full hover:bg-slate-200 text-xs">✕</button>
        </div>
    </div>

    <!-- RECORDING BAR -->
    <div id="recording-bar" class="hidden bg-red-50 border-t px-4 py-3 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-red-500 recording-pulse"></div>
            <div class="flex-1">
                <div class="font-semibold text-xs text-red-600">Recording voice note...</div>
                <div id="recording-time" class="text-[10px] text-slate-500">00:00</div>
            </div>
            <button onclick="stopRecording()" class="px-3 py-1.5 rounded-lg bg-red-500 text-white text-xs">Stop & Send</button>
        </div>
    </div>

    <!-- COMPOSER -->
    <form id="message-form" class="bg-white border-t px-4 py-3 flex items-center gap-2 shrink-0">
        <button type="button" onclick="openImagePicker()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-lg shrink-0">📎</button>
        <input id="message-input" type="text" autocomplete="off" placeholder="Type a message..." class="flex-1 min-w-0 border rounded-full px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-200 bg-slate-50">
        <button type="button" onclick="startRecording()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-lg shrink-0">🎙️</button>
        <button type="submit" id="send-btn" class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center shrink-0">➤</button>
    </form>
</div>

<input id="image-input" type="file" accept="image/*,video/*,.pdf,.doc,.docx" class="hidden" onchange="stageSelectedFile(this.files[0])">

<script>
// ======================================================================
// CONFIG — fill these in with your project's values
// ======================================================================
const SUPABASE_URL = 'https://qclfxoyxnihuttlemzmi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-jLY8uajMI_u_mxQHHUAsA_Q5d5FWVG';
const MEDIA_BUCKET = 'chat-media'; // Supabase Storage bucket name

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ======================================================================
// STATE
// ======================================================================
const params = new URLSearchParams(window.location.search);
const targetUserId = params.get('to') || '';           // the OTHER user's auth UUID
const targetName = decodeURIComponent(params.get('name') || 'Chat');

let currentUser = null;         // Supabase auth user object
let messagesCache = [];
let messageChannel = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordingSeconds = 0;
let recordingTimer = null;
let stagedFile = null;          // { file, type } — uploaded lazily on send

document.addEventListener('DOMContentLoaded', initChat);

// ======================================================================
// INIT
// ======================================================================
async function initChat() {
    if (!targetUserId) {
        alert('No conversation target specified.');
        window.location.href = 'chatlist.html';
        return;
    }

    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
    if (sessionError || !session || !session.user) {
        window.location.href = 'index.html';
        return;
    }
    currentUser = session.user;

    // Keep chat in sync if the session changes/expires mid-use
    supabaseClient.auth.onAuthStateChange((_event, newSession) => {
        if (!newSession) window.location.href = 'index.html';
    });

    setupHeader();
    document.getElementById('message-form').addEventListener('submit', handleSend);

    await fetchMessages();
    subscribeToMessages();
}

function setupHeader() {
    document.getElementById('target-name').textContent = targetName;
    document.getElementById('target-avatar').textContent = (targetName || '?').charAt(0).toUpperCase();
}

function goBack() {
    window.location.href = 'chatlist.html';
}

function toggleSearch() {
    document.getElementById('search-bar').classList.toggle('hidden');
}

function showStatus(text, kind) {
    const bar = document.getElementById('status-bar');
    if (!text) { bar.classList.add('hidden'); return; }
    bar.textContent = text;
    bar.className = 'text-center text-xs py-1 shrink-0 ' +
        (kind === 'error' ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-600');
}

// ======================================================================
// MEDIA STAGING (image/video/file picker)
// ======================================================================
function openImagePicker() {
    document.getElementById('image-input').click();
}

function stageSelectedFile(file) {
    if (!file) return;
    let type = 'file';
    if (file.type.startsWith('image/')) type = 'image';
    else if (file.type.startsWith('video/')) type = 'video';

    stagedFile = { file, type };
    showMediaPreview(file, type);
}

function showMediaPreview(file, type) {
    const preview = document.getElementById('media-preview');
    document.getElementById('media-file-name').textContent = file.name;
    document.getElementById('media-file-type').textContent = type.toUpperCase();

    const contentBox = document.getElementById('media-preview-content');
    contentBox.innerHTML = '';
    if (type === 'image') {
        const img = document.createElement('img');
        img.className = 'w-full h-full object-cover';
        img.src = URL.createObjectURL(file);
        contentBox.appendChild(img);
    } else {
        contentBox.textContent = '📄';
    }
    preview.classList.remove('hidden');
}

function cancelMedia() {
    stagedFile = null;
    document.getElementById('media-preview').classList.add('hidden');
}

// ======================================================================
// AUDIO RECORDING
// ======================================================================
async function startRecording() {
    if (isRecording) return;
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            stream.getTracks().forEach(t => t.stop());
            isRecording = false;
            clearInterval(recordingTimer);
            document.getElementById('recording-bar').classList.add('hidden');

            const file = new File([blob], `voice-${Date.now()}.webm`, { type: 'audio/webm' });
            await sendMessage({ type: 'audio', file });
        };

        mediaRecorder.start();
        isRecording = true;
        recordingSeconds = 0;
        document.getElementById('recording-bar').classList.remove('hidden');
        recordingTimer = setInterval(() => {
            recordingSeconds++;
            const m = Math.floor(recordingSeconds / 60).toString().padStart(2, '0');
            const s = (recordingSeconds % 60).toString().padStart(2, '0');
            document.getElementById('recording-time').textContent = `${m}:${s}`;
        }, 1000);
    } catch (err) {
        alert('Microphone access is blocked or unavailable.');
    }
}

function stopRecording() {
    if (mediaRecorder && isRecording) mediaRecorder.stop();
}

// ======================================================================
// SEND
// ======================================================================
async function handleSend(e) {
    e.preventDefault();

    if (stagedFile) {
        const { file, type } = stagedFile;
        cancelMedia();
        await sendMessage({ type, file });
        return;
    }

    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    await sendMessage({ type: 'text', text });
}

async function sendMessage({ type, text, file }) {
    const sendBtn = document.getElementById('send-btn');
    sendBtn.disabled = true;

    const tempId = 'temp_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const optimistic = {
        id: tempId,
        sender_id: currentUser.id,
        receiver_id: targetUserId,
        type,
        text: text || null,
        media_url: file ? URL.createObjectURL(file) : null, // local preview only
        created_at: new Date().toISOString(),
        _pending: true
    };
    messagesCache.push(optimistic);
    renderMessages();

    try {
        let mediaUrl = null;

        if (file) {
            const path = `${currentUser.id}/${Date.now()}-${file.name}`;
            const { error: uploadError } = await supabaseClient
                .storage
                .from(MEDIA_BUCKET)
                .upload(path, file);
            if (uploadError) throw uploadError;

            const { data: publicUrlData } = supabaseClient
                .storage
                .from(MEDIA_BUCKET)
                .getPublicUrl(path);
            mediaUrl = publicUrlData.publicUrl;
        }

        const row = {
            sender_id: currentUser.id,
            receiver_id: targetUserId,
            type,
            text: text || null,
            media_url: mediaUrl
        };

        const { data, error } = await supabaseClient
            .from('messages')
            .insert(row)
            .select()
            .single();

        if (error) throw error;

        reconcileMessage(tempId, data);
        showStatus('');
    } catch (err) {
        console.error(err);
        messagesCache = messagesCache.filter(m => m.id !== tempId);
        renderMessages();
        showStatus('Message failed to send: ' + (err.message || 'unknown error'), 'error');
    } finally {
        sendBtn.disabled = false;
    }
}

function reconcileMessage(tempId, realRow) {
    const idx = messagesCache.findIndex(m => m.id === tempId);
    if (idx !== -1) {
        messagesCache[idx] = realRow;
    } else if (!messagesCache.some(m => m.id === realRow.id)) {
        messagesCache.push(realRow);
    }
    renderMessages();
}

// ======================================================================
// FETCH (initial load / manual refresh only — NOT called after each send)
// ======================================================================
async function fetchMessages() {
    const loadingEl = document.getElementById('loading-message');
    loadingEl.classList.remove('hidden');

    const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${targetUserId}),` +
            `and(sender_id.eq.${targetUserId},receiver_id.eq.${currentUser.id})`
        )
        .order('created_at', { ascending: true });

    loadingEl.classList.add('hidden');

    if (error) {
        console.error('fetchMessages error:', error);
        showStatus('Could not load messages: ' + error.message, 'error');
        return;
    }

    messagesCache = data || [];
    renderMessages();
}

// ======================================================================
// RENDER
// ======================================================================
function renderMessages() {
    const container = document.getElementById('messages');
    const search = (document.getElementById('search-input')?.value || '').toLowerCase();
    container.innerHTML = '';

    if (!messagesCache.length) {
        container.innerHTML = `<div class="text-center text-slate-400 text-xs py-8">No messages here yet. Say hello!</div>`;
        return;
    }

    messagesCache.forEach(msg => {
        const textVal = msg.type === 'text' ? (msg.text || '') : '';
        if (search && !textVal.toLowerCase().includes(search)) return;

        const isMine = msg.sender_id === currentUser.id;
        const wrapper = document.createElement('div');
        wrapper.className = `flex ${isMine ? 'justify-end' : 'justify-start'}`;

        const bubble = document.createElement('div');
        bubble.className = `message-bubble rounded-2xl px-3.5 py-2 text-sm ${
            isMine ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-white border text-slate-800 rounded-bl-sm'
        } ${msg._pending ? 'opacity-60' : ''}`;

        if (msg.type === 'image') {
            const img = document.createElement('img');
            img.src = msg.media_url;
            img.className = 'message-image mb-1';
            bubble.appendChild(img);
        } else if (msg.type === 'audio') {
            const aud = document.createElement('audio');
            aud.src = msg.media_url;
            aud.controls = true;
            aud.className = 'message-audio mb-1';
            bubble.appendChild(aud);
        } else if (msg.type === 'video') {
            const vid = document.createElement('video');
            vid.src = msg.media_url;
            vid.controls = true;
            vid.className = 'message-video mb-1';
            bubble.appendChild(vid);
        } else {
            const t = document.createElement('div');
            t.textContent = msg.text || '';
            bubble.appendChild(t);
        }

        const time = document.createElement('div');
        time.className = `text-[9px] mt-1 text-right ${isMine ? 'text-indigo-200' : 'text-slate-400'}`;
        time.textContent = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        bubble.appendChild(time);

        wrapper.appendChild(bubble);
        container.appendChild(wrapper);
    });

    container.scrollTop = container.scrollHeight;
}

// ======================================================================
// REALTIME
// ======================================================================
function subscribeToMessages() {
    if (messageChannel) supabaseClient.removeChannel(messageChannel);

    messageChannel = supabaseClient
        .channel(`messages:${currentUser.id}:${targetUserId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
            const m = payload.new;
            const relevant =
                (m.sender_id === currentUser.id && m.receiver_id === targetUserId) ||
                (m.sender_id === targetUserId && m.receiver_id === currentUser.id);
            if (relevant && !messagesCache.some(row => row.id === m.id)) {
                messagesCache.push(m);
                renderMessages();
            }
        })
        .subscribe(status => {
            if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                showStatus('Live updates disconnected — messages will still send.', 'error');
            } else if (status === 'SUBSCRIBED') {
                showStatus('');
            }
        });
}
</script>
</body>
</html>
