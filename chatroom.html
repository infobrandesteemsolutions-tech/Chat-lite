<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Lite - Chat</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

<div class="w-full max-w-md mx-auto h-screen flex flex-col bg-slate-900 shadow-2xl border-x border-slate-800">

    <!-- HEADER -->
    <div class="p-3 border-b border-slate-800 bg-slate-900 flex items-center gap-3">

        <button
            onclick="goBack()"
            class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xl text-slate-300">
            ←
        </button>

        <div
            id="target-avatar"
            class="w-10 h-10 rounded-full bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center font-bold text-indigo-400 overflow-hidden">
        </div>

        <div class="flex-1 min-w-0">

            <h2
                id="target-name"
                class="font-bold text-sm text-white truncate">
                Loading...
            </h2>

            <p
                id="target-info"
                class="text-xs text-slate-400 truncate">
            </p>

        </div>

        <button
            onclick="toggleSearch()"
            class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center">
            🔍
        </button>

    </div>


    <!-- SEARCH -->
    <div
        id="search-container"
        class="hidden px-3 py-2 bg-slate-950 border-b border-slate-800">

        <input
            id="search-input"
            type="text"
            placeholder="Search messages..."
            oninput="searchMessages()"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none focus:border-indigo-500">
    </div>


    <!-- MESSAGES -->
    <div
        id="chat-messages"
        class="flex-1 overflow-y-auto p-3 space-y-3 bg-slate-950">

        <div
            id="loading-message"
            class="text-center text-slate-500 text-sm py-8">
            Loading messages...
        </div>

    </div>


    <!-- REPLY BAR -->
    <div
        id="reply-bar"
        class="hidden px-3 py-2 bg-slate-800 border-t border-slate-700">

        <div class="flex items-center gap-2">

            <div class="w-1 h-10 bg-indigo-500 rounded-full"></div>

            <div class="flex-1 min-w-0">

                <p
                    id="reply-name"
                    class="text-xs font-semibold text-indigo-400">
                </p>

                <p
                    id="reply-content"
                    class="text-xs text-slate-300 truncate">
                </p>

            </div>

            <button
                onclick="cancelReply()"
                class="text-slate-400 hover:text-white text-xl">
                ×
            </button>

        </div>

    </div>


    <!-- INPUT -->
    <div class="p-2 border-t border-slate-800 bg-slate-900">

        <form
            onsubmit="sendMessage(event)"
            class="flex items-end gap-2">

            <textarea
                id="message-input"
                rows="1"
                placeholder="Type a message..."
                oninput="autoResize(this)"
                class="flex-1 resize-none bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white outline-none focus:border-indigo-500 max-h-32"></textarea>

            <button
                type="submit"
                class="w-11 h-11 rounded-full bg-indigo-600 hover:bg-indigo-500 flex items-center justify-center text-white shadow-lg">
                ➤
            </button>

        </form>

    </div>

</div>


<!-- CONTEXT MENU -->
<div
    id="context-menu"
    class="hidden fixed z-50 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden">

    <button
        onclick="replyToSelected()"
        class="block w-full text-left px-5 py-3 text-sm hover:bg-slate-700">
        ↩ Reply
    </button>

    <button
        onclick="deleteSelectedForMe()"
        class="block w-full text-left px-5 py-3 text-sm hover:bg-slate-700 text-red-400">
        Delete for me
    </button>

</div>


<script>

/* =========================================================
   CHAT STATE
========================================================= */

let currentUser = null;
let targetUsername = '';
let targetName = '';
let targetGender = '';

let messagesCache = [];
let selectedMessage = null;
let activeReplyMessage = null;
let realtimeChannel = null;


/* =========================================================
   GET CHAT USER FROM URL
========================================================= */

const params = new URLSearchParams(
    window.location.search
);


/*
   chatlist.html opens:

   chatroom.html?to=username&name=name&gender=gender
*/

targetUsername =
    params.get('to') ||
    params.get('username') ||
    '';


targetName =
    params.get('name') ||
    targetUsername ||
    'Chat';


targetGender =
    params.get('gender') ||
    '';


/*
   Decode URL values safely.
*/

try {
    targetUsername = decodeURIComponent(targetUsername);
} catch (e) {}

try {
    targetName = decodeURIComponent(targetName);
} catch (e) {}

try {
    targetGender = decodeURIComponent(targetGender);
} catch (e) {}


/* =========================================================
   CACHE KEYS
========================================================= */

function getCacheKey() {

    return `chatlite_cache_${currentUser.username}_${targetUsername}`;
}


function getOfflineQueueKey() {

    return `chatlite_offline_queue_${currentUser.username}_${targetUsername}`;
}


/* =========================================================
   INITIALIZE
========================================================= */

async function initChat() {

    /*
       IMPORTANT:
       Your chatlist.html stores the logged-in user
       under "chatlite_user".

       We MUST use that exact key.
    */

    const storedUser =
        localStorage.getItem('chatlite_user');


    if (!storedUser) {

        window.location.href =
            'index.html';

        return;
    }


    try {

        currentUser =
            JSON.parse(storedUser);

    } catch (error) {

        console.error(
            'Invalid stored user:',
            error
        );

        localStorage.removeItem(
            'chatlite_user'
        );

        window.location.href =
            'index.html';

        return;
    }


    /*
       Verify the stored user has a username.
    */

    if (
        !currentUser ||
        !currentUser.username
    ) {

        localStorage.removeItem(
            'chatlite_user'
        );

        window.location.href =
            'index.html';

        return;
    }


    /*
       Make sure we actually have a target.
    */

    if (!targetUsername) {

        alert(
            'No chat user was selected.'
        );

        goBack();

        return;
    }


    /*
       Update header.
    */

    document.getElementById(
        'target-name'
    ).textContent =
        targetName || targetUsername;


    document.getElementById(
        'target-info'
    ).textContent =
        '@' +
        targetUsername +
        (
            targetGender
                ? ' • ' + targetGender
                : ''
        );


    document.getElementById(
        'target-avatar'
    ).textContent =
        (
            targetName ||
            targetUsername ||
            'U'
        )
        .charAt(0)
        .toUpperCase();


    /*
       Load local messages first.
    */

    loadLocalCache();

    renderMessages(
        messagesCache
    );


    /*
       Then get messages from Supabase.
    */

    await fetchMessages();


    /*
       Start realtime listener.
    */

    setupRealtime();
}


/* =========================================================
   LOCAL CACHE
========================================================= */

function loadLocalCache() {

    try {

        const saved =
            localStorage.getItem(
                getCacheKey()
            );


        if (saved) {

            messagesCache =
                JSON.parse(saved);

        } else {

            messagesCache = [];
        }

    } catch (error) {

        console.error(
            'Could not load message cache:',
            error
        );

        messagesCache = [];
    }
}


function saveLocalCache() {

    try {

        localStorage.setItem(
            getCacheKey(),
            JSON.stringify(messagesCache)
        );

    } catch (error) {

        console.error(
            'Could not save message cache:',
            error
        );
    }
}


/* =========================================================
   OFFLINE QUEUE
========================================================= */

function getOfflineQueue() {

    try {

        return JSON.parse(
            localStorage.getItem(
                getOfflineQueueKey()
            ) || '[]'
        );

    } catch (error) {

        return [];
    }
}


function saveOfflineQueue(queue) {

    localStorage.setItem(
        getOfflineQueueKey(),
        JSON.stringify(queue)
    );
}


function queueOfflineMessage(message) {

    const queue =
        getOfflineQueue();

    queue.push(message);

    saveOfflineQueue(queue);
}


/* =========================================================
   FETCH MESSAGES
========================================================= */

async function fetchMessages() {

    /*
       NEVER wipe local messages while offline.
    */

    if (!navigator.onLine) {

        renderMessages(
            messagesCache
        );

        return;
    }


    if (
        !currentUser ||
        !currentUser.username ||
        !targetUsername
    ) {
        return;
    }


    /*
       Fetch sent messages.
    */

    const sentResult =
        await supabaseClient
            .from('messages')
            .select('*')
            .eq(
                'sender_username',
                currentUser.username
            )
            .eq(
                'receiver_username',
                targetUsername
            );


    if (sentResult.error) {

        console.error(
            'Error fetching sent messages:',
            sentResult.error
        );

        /*
           Keep existing local messages.
        */

        renderMessages(
            messagesCache
        );

        return;
    }


    /*
       Fetch received messages.
    */

    const receivedResult =
        await supabaseClient
            .from('messages')
            .select('*')
            .eq(
                'sender_username',
                targetUsername
            )
            .eq(
                'receiver_username',
                currentUser.username
            );


    if (receivedResult.error) {

        console.error(
            'Error fetching received messages:',
            receivedResult.error
        );

        renderMessages(
            messagesCache
        );

        return;
    }


    const dbMessages = [
        ...(sentResult.data || []),
        ...(receivedResult.data || [])
    ];


    /*
       Sort database messages.
    */

    dbMessages.sort(
        (a, b) =>
            new Date(a.created_at || 0) -
            new Date(b.created_at || 0)
    );


    /*
       Find local messages which have not yet
       been confirmed by Supabase.
    */

    const pendingLocalMessages =
        messagesCache.filter(
            message =>
                message.is_pending === true ||
                message.is_offline_pending === true
        );


    const mergedMessages = [
        ...dbMessages
    ];


    /*
       Keep pending local messages unless we can
       find their database copy.
    */

    for (
        const localMessage
        of pendingLocalMessages
    ) {

        const matchingDbMessage =
            dbMessages.some(
                dbMessage => {

                    if (
                        dbMessage.sender_username !==
                        localMessage.sender_username
                    ) {
                        return false;
                    }


                    if (
                        dbMessage.receiver_username !==
                        localMessage.receiver_username
                    ) {
                        return false;
                    }


                    if (
                        dbMessage.content !==
                        localMessage.content
                    ) {
                        return false;
                    }


                    /*
                       If timestamps exist, use them
                       to make the match safer.
                    */

                    if (
                        dbMessage.created_at &&
                        localMessage.created_at
                    ) {

                        const dbTime =
                            new Date(
                                dbMessage.created_at
                            ).getTime();


                        const localTime =
                            new Date(
                                localMessage.created_at
                            ).getTime();


                        return (
                            Math.abs(
                                dbTime -
                                localTime
                            ) <= 30000
                        );
                    }


                    return true;
                }
            );


        /*
           If the database does NOT contain it yet,
           keep the local copy visible.
        */

        if (!matchingDbMessage) {

            mergedMessages.push(
                localMessage
            );
        }
    }


    /*
       Sort everything.
    */

    mergedMessages.sort(
        (a, b) =>
            new Date(a.created_at || 0) -
            new Date(b.created_at || 0)
    );


    messagesCache =
        mergedMessages;


    saveLocalCache();


    renderMessages(
        messagesCache
    );
}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(messages) {

    const container =
        document.getElementById(
            'chat-messages'
        );


    if (!container) {
        return;
    }


    container.innerHTML = '';


    if (
        !messages ||
        messages.length === 0
    ) {

        container.innerHTML = `

            <div class="text-center text-slate-500 text-sm py-8">
                No messages yet.
            </div>

        `;

        return;
    }


    const searchInput =
        document.getElementById(
            'search-input'
        );


    const searchText =
        searchInput
            ? searchInput.value
                .trim()
                .toLowerCase()
            : '';


    let visibleMessages =
        messages;


    if (searchText) {

        visibleMessages =
            messages.filter(
                message =>
                    String(
                        message.content || ''
                    )
                    .toLowerCase()
                    .includes(searchText)
            );
    }


    visibleMessages.forEach(
        message => {

            /*
               Local "delete for me".
            */

            if (
                message.local_deleted === true
            ) {
                return;
            }


            /*
               Support old schema if these fields exist.
            */

            if (
                message.is_deleted_for_everyone === true
            ) {
                return;
            }


            const isMe =
                message.sender_username ===
                currentUser.username;


            const wrapper =
                document.createElement('div');


            wrapper.className =
                'flex flex-col ' +
                (
                    isMe
                        ? 'items-end'
                        : 'items-start'
                );


            /*
               Bubble
            */

            const bubble =
                document.createElement('div');


            bubble.className =
                'max-w-[75%] px-4 py-2.5 rounded-2xl text-sm ' +
                (
                    isMe
                        ? 'bg-indigo-600 text-white rounded-br-none'
                        : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'
                );


            /*
               Reply display.
            */

            if (message.reply_to) {

                const replyBox =
                    document.createElement('div');


                replyBox.className =
                    'mb-2 px-2 py-1.5 rounded bg-black/10 border-l-2 border-white/30 text-xs';


                let replyText =
                    'Reply';


                if (
                    typeof message.reply_to ===
                    'string'
                ) {

                    replyText =
                        message.reply_to;

                } else if (
                    message.reply_to.content
                ) {

                    replyText =
                        message.reply_to.content;
                }


                replyBox.textContent =
                    replyText;


                bubble.appendChild(
                    replyBox
                );
            }


            /*
               Message text.
            */

            const messageText =
                document.createElement('div');


            messageText.textContent =
                message.content || '';


            messageText.className =
                'whitespace-pre-wrap break-words';


            bubble.appendChild(
                messageText
            );


            /*
               Time.
            */

            const time =
                document.createElement('div');


            time.className =
                'text-[10px] mt-1 ' +
                (
                    isMe
                        ? 'text-indigo-200'
                        : 'text-slate-500'
                );


            if (message.created_at) {

                const date =
                    new Date(
                        message.created_at
                    );


                if (
                    !isNaN(
                        date.getTime()
                    )
                ) {

                    time.textContent =
                        date.toLocaleTimeString(
                            [],
                            {
                                hour: '2-digit',
                                minute: '2-digit'
                            }
                        );
                }
            }


            /*
               Pending clock.
            */

            if (
                message.is_pending === true ||
                message.is_offline_pending === true
            ) {

                const pending =
                    document.createElement('span');


                pending.className =
                    'ml-1';


                pending.textContent =
                    '◷';


                time.appendChild(
                    pending
                );
            }


            bubble.appendChild(
                time
            );


            wrapper.appendChild(
                bubble
            );


            /*
               Right click reply/delete menu.
            */

            bubble.addEventListener(
                'contextmenu',
                event => {

                    event.preventDefault();

                    selectedMessage =
                        message;


                    showContextMenu(
                        event.clientX,
                        event.clientY
                    );
                }
            );


            /*
               Double click = reply.
            */

            bubble.addEventListener(
                'dblclick',
                () => {

                    selectedMessage =
                        message;

                    replyToSelected();
                }
            );


            container.appendChild(
                wrapper
            );
        }
    );


    /*
       Scroll to bottom.
    */

    container.scrollTop =
        container.scrollHeight;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(event) {

    if (event) {
        event.preventDefault();
    }


    const input =
        document.getElementById(
            'message-input'
        );


    const content =
        input.value.trim();


    if (!content) {
        return;
    }


    if (
        !currentUser ||
        !currentUser.username ||
        !targetUsername
    ) {

        alert(
            'Chat session is not ready.'
        );

        return;
    }


    /*
       Create local pending copy FIRST.
    */

    const localMessage = {

        sender_username:
            currentUser.username,

        receiver_username:
            targetUsername,

        content:
            content,

        created_at:
            new Date().toISOString(),

        is_pending:
            true,

        is_offline_pending:
            false,

        reply_to:
            activeReplyMessage
                ? {
                    sender_username:
                        activeReplyMessage.sender_username,

                    content:
                        activeReplyMessage.content
                }
                : null
    };


    messagesCache.push(
        localMessage
    );


    saveLocalCache();


    renderMessages(
        messagesCache
    );


    cancelReply();


    /*
       Clear input immediately.
    */

    input.value = '';

    autoResize(input);


    /*
       OFFLINE
    */

    if (!navigator.onLine) {

        localMessage.is_offline_pending =
            true;


        queueOfflineMessage(
            localMessage
        );


        saveLocalCache();


        renderMessages(
            messagesCache
        );


        return;
    }


    /*
       IMPORTANT:
       Only use columns confirmed to exist
       in your old messages table.
    */

    const payload = {

        sender_username:
            currentUser.username,

        receiver_username:
            targetUsername,

        content:
            content
    };


    const { error } =
        await supabaseClient
            .from('messages')
            .insert([
                payload
            ]);


    if (error) {

        console.error(
            'Message insert error:',
            error
        );


        /*
           Keep the message visible.
        */

        localMessage.is_pending =
            true;

        localMessage.is_offline_pending =
            true;


        queueOfflineMessage(
            localMessage
        );


        saveLocalCache();


        renderMessages(
            messagesCache
        );


        return;
    }


    /*
       INSERT SUCCEEDED.

       Do NOT remove local message immediately.
       We wait for fetchMessages() to confirm
       the database copy exists.
    */

    localMessage.is_pending =
        true;


    localMessage.is_offline_pending =
        false;


    saveLocalCache();


    renderMessages(
        messagesCache
    );


    /*
       Fetch shortly after the insert.
    */

    setTimeout(
        async () => {

            await fetchMessages();

        },
        300
    );
}


/* =========================================================
   FLUSH OFFLINE QUEUE
========================================================= */

async function flushOfflineQueue() {

    if (!navigator.onLine) {
        return;
    }


    const queue =
        getOfflineQueue();


    if (!queue.length) {
        return;
    }


    const remaining = [];


    for (
        const message
        of queue
    ) {

        const payload = {

            sender_username:
                message.sender_username,

            receiver_username:
                message.receiver_username,

            content:
                message.content
        };


        const { error } =
            await supabaseClient
                .from('messages')
                .insert([
                    payload
                ]);


        if (error) {

            console.error(
                'Offline message failed:',
                error
            );


            remaining.push(
                message
            );

        } else {

            /*
               Remove only the local copy that
               was successfully uploaded.
            */

            messagesCache =
                messagesCache.filter(
                    localMessage =>
                        localMessage !==
                        message
                );
        }
    }


    saveOfflineQueue(
        remaining
    );


    saveLocalCache();


    await fetchMessages();
}


/* =========================================================
   REALTIME
========================================================= */

function setupRealtime() {

    if (
        !supabaseClient ||
        !currentUser ||
        !targetUsername
    ) {
        return;
    }


    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );
    }


    realtimeChannel =
        supabaseClient
            .channel(
                'private-chat-' +
                currentUser.username +
                '-' +
                targetUsername
            )
            .on(
                'postgres_changes',
                {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages'
                },
                payload => {

                    const message =
                        payload.new;


                    const belongsToChat =
                        (
                            message.sender_username ===
                            currentUser.username &&
                            message.receiver_username ===
                            targetUsername
                        )
                        ||
                        (
                            message.sender_username ===
                            targetUsername &&
                            message.receiver_username ===
                            currentUser.username
                        );


                    if (
                        !belongsToChat
                    ) {
                        return;
                    }


                    /*
                       Fetch the conversation again.
                       This lets the pending local copy
                       be replaced by the database copy.
                    */

                    fetchMessages();
                }
            )
            .subscribe();
}


/* =========================================================
   REPLY
========================================================= */

function replyToSelected() {

    if (!selectedMessage) {
        return;
    }


    activeReplyMessage =
        selectedMessage;


    document.getElementById(
        'reply-name'
    ).textContent =
        selectedMessage.sender_username ||
        'Message';


    document.getElementById(
        'reply-content'
    ).textContent =
        selectedMessage.content ||
        '[Message]';


    document.getElementById(
        'reply-bar'
    ).classList.remove(
        'hidden'
    );


    document.getElementById(
        'message-input'
    ).focus();


    hideContextMenu();
}


function cancelReply() {

    activeReplyMessage =
        null;


    document.getElementById(
        'reply-bar'
    ).classList.add(
        'hidden'
    );
}


/* =========================================================
   CONTEXT MENU
========================================================= */

function showContextMenu(x, y) {

    const menu =
        document.getElementById(
            'context-menu'
        );


    menu.style.left =
        x + 'px';


    menu.style.top =
        y + 'px';


    menu.classList.remove(
        'hidden'
    );
}


function hideContextMenu() {

    document.getElementById(
        'context-menu'
    ).classList.add(
        'hidden'
    );
}


document.addEventListener(
    'click',
    event => {

        if (
            !event.target.closest(
                '#context-menu'
            )
        ) {

            hideContextMenu();
        }
    }
);


/* =========================================================
   DELETE FOR ME
========================================================= */

function deleteSelectedForMe() {

    if (!selectedMessage) {
        return;
    }


    const index =
        messagesCache.indexOf(
            selectedMessage
        );


    if (index !== -1) {

        messagesCache[index].local_deleted =
            true;


        saveLocalCache();


        renderMessages(
            messagesCache
        );
    }


    selectedMessage =
        null;


    hideContextMenu();
}


/* =========================================================
   SEARCH
========================================================= */

function toggleSearch() {

    const search =
        document.getElementById(
            'search-container'
        );


    search.classList.toggle(
        'hidden'
    );


    if (
        !search.classList.contains(
            'hidden'
        )
    ) {

        document.getElementById(
            'search-input'
        ).focus();

    } else {

        document.getElementById(
            'search-input'
        ).value = '';


        renderMessages(
            messagesCache
        );
    }
}


function searchMessages() {

    renderMessages(
        messagesCache
    );
}


/* =========================================================
   INPUT RESIZE
========================================================= */

function autoResize(textarea) {

    textarea.style.height =
        'auto';


    textarea.style.height =
        Math.min(
            textarea.scrollHeight,
            128
        ) + 'px';
}


/* =========================================================
   NAVIGATION
========================================================= */

function goBack() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel =
            null;
    }


    window.location.href =
        'chatlist.html';
}


/* =========================================================
   ONLINE EVENT
========================================================= */

window.addEventListener(
    'online',
    async () => {

        await flushOfflineQueue();

        await fetchMessages();
    }
);


/* =========================================================
   START CHAT
========================================================= */

initChat();

</script>
