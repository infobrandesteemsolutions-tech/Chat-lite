<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Lite</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.chat-container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: white;
}

.chat-header {
    height: 60px;
    background: #075e54;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
}

.back-btn {
    border: none;
    background: transparent;
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.profile-info {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.profile-name {
    font-size: 17px;
    font-weight: bold;
}

.profile-username {
    font-size: 12px;
    opacity: .8;
}

.header-btn {
    border: none;
    background: transparent;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.search-bar {
    display: none;
    padding: 8px;
    background: #eee;
}

.search-bar input {
    width: 100%;
    border: none;
    padding: 9px 12px;
    border-radius: 18px;
    outline: none;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background: #e5ddd5;
}

.message-row {
    display: flex;
    margin-bottom: 7px;
}

.message-row.sent {
    justify-content: flex-end;
}

.message-row.received {
    justify-content: flex-start;
}

.message-bubble {
    max-width: 78%;
    padding: 8px 10px;
    border-radius: 9px;
    position: relative;
    word-wrap: break-word;
}

.sent .message-bubble {
    background: #dcf8c6;
}

.received .message-bubble {
    background: white;
}

.message-text {
    white-space: pre-wrap;
    font-size: 15px;
}

.message-time {
    font-size: 10px;
    color: #777;
    text-align: right;
    margin-top: 3px;
}

.pending-icon {
    font-size: 11px;
    margin-left: 3px;
}

.reply-preview {
    display: none;
    background: #f0f0f0;
    border-left: 4px solid #075e54;
    padding: 7px 10px;
    align-items: center;
}

.reply-preview-content {
    flex: 1;
}

.reply-preview-name {
    font-weight: bold;
    font-size: 12px;
    color: #075e54;
}

.reply-preview-text {
    font-size: 12px;
    color: #555;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.reply-close {
    border: none;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
}

.input-area {
    background: #f0f0f0;
    padding: 7px;
    display: flex;
    align-items: flex-end;
    gap: 6px;
}

.input-area textarea {
    flex: 1;
    resize: none;
    border: none;
    border-radius: 20px;
    padding: 10px 14px;
    outline: none;
    max-height: 110px;
    font-family: Arial, sans-serif;
}

.send-btn,
.attach-btn,
.mic-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
}

.send-btn {
    background: #075e54;
    color: white;
}

.attach-btn,
.mic-btn {
    background: #ddd;
}

.context-menu {
    display: none;
    position: fixed;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    z-index: 1000;
    overflow: hidden;
}

.context-menu button {
    display: block;
    width: 160px;
    padding: 12px;
    border: none;
    background: white;
    text-align: left;
    cursor: pointer;
}

.context-menu button:hover {
    background: #eee;
}

.media-input {
    display: none;
}

.empty-chat {
    text-align: center;
    color: #777;
    margin-top: 40px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        <button class="back-btn" onclick="goBack()">‹</button>

        <div class="profile-info">
            <div class="profile-name" id="targetName">Chat</div>
            <div class="profile-username" id="targetUsernameDisplay"></div>
        </div>

        <button class="header-btn" onclick="toggleSearch()">🔍</button>
    </div>

    <div class="search-bar" id="searchBar">
        <input
            type="text"
            id="searchInput"
            placeholder="Search messages..."
            oninput="searchMessages()"
        >
    </div>

    <div class="messages" id="messages"></div>

    <div class="reply-preview" id="replyPreview">
        <div class="reply-preview-content">
            <div class="reply-preview-name" id="replyPreviewName"></div>
            <div class="reply-preview-text" id="replyPreviewText"></div>
        </div>
        <button class="reply-close" onclick="cancelReply()">×</button>
    </div>

    <div class="input-area">
        <button class="attach-btn" onclick="document.getElementById('mediaInput').click()">📎</button>

        <input
            type="file"
            id="mediaInput"
            class="media-input"
            accept="image/*,video/*"
            onchange="handleMediaSelected(event)"
        >

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message"
            oninput="autoResize(this)"
            onkeydown="handleEnter(event)"
        ></textarea>

        <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>

        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

</div>

<div class="context-menu" id="contextMenu">
    <button onclick="replyToSelected()">↩ Reply</button>
    <button onclick="deleteSelectedForMe()">Delete for me</button>
</div>

<script>

let currentUser = null;
let targetUsername = '';
let targetName = '';
let targetGender = '';

let messagesCache = [];
let selectedMessage = null;
let activeReplyMessage = null;
let stagedMedia = null;
let mediaRecorder = null;
let audioChunks = [];
let realtimeChannel = null;

const params = new URLSearchParams(window.location.search);

targetUsername =
    params.get('username') ||
    params.get('user') ||
    params.get('target') ||
    '';

targetName =
    params.get('name') ||
    targetUsername ||
    'Chat';

targetGender =
    params.get('gender') ||
    '';

const cacheKey = () =>
    `chatlite_cache_${currentUser?.username}_${targetUsername}`;

const offlineQueueKey = () =>
    `chatlite_offline_queue_${currentUser?.username}_${targetUsername}`;


/* =========================
   INITIALIZATION
========================= */

async function initChat() {

    currentUser = JSON.parse(
        localStorage.getItem('currentUser') ||
        localStorage.getItem('user')
    );

    if (!currentUser || !currentUser.username) {
        alert('Please login first.');
        window.location.href = 'index.html';
        return;
    }

    document.getElementById('targetName').textContent =
        targetName || targetUsername;

    document.getElementById('targetUsernameDisplay').textContent =
        '@' + targetUsername;

    loadLocalCache();

    renderMessages(messagesCache);

    await fetchMessages();

    setupRealtime();

    window.addEventListener('online', async () => {
        await flushOfflineQueue();
        await fetchMessages();
    });
}


/* =========================
   LOCAL CACHE
========================= */

function loadLocalCache() {

    try {

        const saved =
            localStorage.getItem(cacheKey());

        if (saved) {
            messagesCache = JSON.parse(saved);
        }

    } catch (error) {

        console.error('Could not load local cache:', error);
        messagesCache = [];
    }
}


function saveLocalCache(messages = messagesCache) {

    try {

        localStorage.setItem(
            cacheKey(),
            JSON.stringify(messages)
        );

    } catch (error) {

        console.error('Could not save local cache:', error);
    }
}


/* =========================
   OFFLINE QUEUE
========================= */

function getOfflineQueue() {

    try {

        return JSON.parse(
            localStorage.getItem(offlineQueueKey()) || '[]'
        );

    } catch (error) {

        return [];
    }
}


function saveOfflineQueue(queue) {

    localStorage.setItem(
        offlineQueueKey(),
        JSON.stringify(queue)
    );
}


function queueOfflineMessage(message) {

    const queue = getOfflineQueue();

    queue.push(message);

    saveOfflineQueue(queue);
}


/* =========================
   FETCH MESSAGES
========================= */

async function fetchMessages() {

    /*
       If offline, NEVER replace the local cache.
       This is important because the local pending
       message must remain visible.
    */

    if (!navigator.onLine) {

        renderMessages(messagesCache);
        return;
    }

    const sentResult = await supabaseClient
        .from('messages')
        .select('*')
        .eq('sender_username', currentUser.username)
        .eq('receiver_username', targetUsername);

    const receivedResult = await supabaseClient
        .from('messages')
        .select('*')
        .eq('sender_username', targetUsername)
        .eq('receiver_username', currentUser.username);

    if (sentResult.error) {

        console.error(
            'Could not fetch sent messages:',
            sentResult.error
        );

        renderMessages(messagesCache);
        return;
    }

    if (receivedResult.error) {

        console.error(
            'Could not fetch received messages:',
            receivedResult.error
        );

        renderMessages(messagesCache);
        return;
    }

    const dbMessages = [
        ...(sentResult.data || []),
        ...(receivedResult.data || [])
    ];

    /*
       Sort database messages.
    */

    dbMessages.sort((a, b) => {

        return new Date(a.created_at || 0) -
               new Date(b.created_at || 0);

    });


    /*
       IMPORTANT FIX:
       Keep local messages that have not yet been
       confirmed by the database.
    */

    const localPendingMessages =
        messagesCache.filter(message =>
            message.is_offline_pending === true ||
            message.is_pending === true
        );


    const mergedMessages = [...dbMessages];


    for (const localMessage of localPendingMessages) {

        const alreadyExists = dbMessages.some(dbMessage => {

            if (
                dbMessage.sender_username !==
                localMessage.sender_username
            ) {
                return false;
            }

            if (
                dbMessage.receiver_username !==
                localMessage.receiver_username
            ) {
                return false;
            }

            if (
                dbMessage.content !==
                localMessage.content
            ) {
                return false;
            }


            /*
               If both have created_at,
               compare their timestamps.
            */

            if (
                dbMessage.created_at &&
                localMessage.created_at
            ) {

                const dbTime =
                    new Date(dbMessage.created_at).getTime();

                const localTime =
                    new Date(localMessage.created_at).getTime();

                /*
                   Allow up to 30 seconds difference.
                */

                if (
                    Math.abs(dbTime - localTime) <= 30000
                ) {
                    return true;
                }

            }

            /*
               If the table does not expose created_at,
               content + sender/receiver is enough to
               prevent the local message disappearing.
            */

            return !dbMessage.created_at;

        });


        if (!alreadyExists) {

            mergedMessages.push(localMessage);

        }
    }


    /*
       Sort again after adding local pending messages.
    */

    mergedMessages.sort((a, b) => {

        return new Date(a.created_at || 0) -
               new Date(b.created_at || 0);

    });


    messagesCache = mergedMessages;

    saveLocalCache(messagesCache);

    renderMessages(messagesCache);
}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(messages) {

    const container =
        document.getElementById('messages');

    container.innerHTML = '';


    if (!messages || messages.length === 0) {

        container.innerHTML =
            '<div class="empty-chat">No messages yet.</div>';

        return;
    }


    const searchText =
        document.getElementById('searchInput')?.value
        ?.toLowerCase() || '';


    let visibleMessages = messages;


    if (searchText) {

        visibleMessages =
            messages.filter(message =>
                String(message.content || '')
                    .toLowerCase()
                    .includes(searchText)
            );
    }


    if (visibleMessages.length === 0) {

        container.innerHTML =
            '<div class="empty-chat">No matching messages.</div>';

        return;
    }


    visibleMessages.forEach(message => {

        /*
           Do not display locally deleted messages.
        */

        if (message.local_deleted === true) {
            return;
        }

        /*
           If the old table has this field, respect it.
           Otherwise it is simply ignored.
        */

        if (message.is_deleted_for_everyone === true) {
            return;
        }


        const isSent =
            message.sender_username ===
            currentUser.username;


        const row =
            document.createElement('div');

        row.className =
            'message-row ' +
            (isSent ? 'sent' : 'received');


        const bubble =
            document.createElement('div');

        bubble.className =
            'message-bubble';


        /*
           Reply preview
        */

        if (message.reply_to) {

            const replyBox =
                document.createElement('div');

            replyBox.style.background = '#eee';
            replyBox.style.padding = '5px';
            replyBox.style.marginBottom = '5px';
            replyBox.style.borderLeft =
                '3px solid #075e54';
            replyBox.style.fontSize = '11px';

            replyBox.textContent =
                typeof message.reply_to === 'string'
                    ? message.reply_to
                    : (
                        message.reply_to.message ||
                        'Reply'
                    );

            bubble.appendChild(replyBox);
        }


        /*
           Message content
        */

        const text =
            document.createElement('div');

        text.className = 'message-text';

        text.textContent =
            message.content || '';

        bubble.appendChild(text);


        /*
           Time
        */

        const time =
            document.createElement('div');

        time.className = 'message-time';


        if (message.created_at) {

            const date =
                new Date(message.created_at);

            if (!isNaN(date.getTime())) {

                time.textContent =
                    date.toLocaleTimeString([], {
                        hour: '2-digit',
                        minute: '2-digit'
                    });

            }

        }


        /*
           Pending indicator
        */

        if (
            message.is_pending === true ||
            message.is_offline_pending === true
        ) {

            const pending =
                document.createElement('span');

            pending.className =
                'pending-icon';

            pending.textContent = '◷';

            time.appendChild(pending);
        }


        bubble.appendChild(time);

        row.appendChild(bubble);


        /*
           Long press / right click
        */

        bubble.addEventListener(
            'contextmenu',
            event => {

                event.preventDefault();

                selectedMessage = message;

                showContextMenu(
                    event.clientX,
                    event.clientY
                );
            }
        );


        row.addEventListener(
            'dblclick',
            () => {

                selectedMessage = message;

                replyToSelected();
            }
        );


        container.appendChild(row);
    });


    container.scrollTop =
        container.scrollHeight;
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById('messageInput');

    const content =
        input.value.trim();


    if (!content && !stagedMedia) {
        return;
    }


    if (stagedMedia) {

        await sendPayloadToSupabase(
            stagedMedia.url,
            stagedMedia.type
        );

        stagedMedia = null;

        input.value = '';

        autoResize(input);

        return;
    }


    await sendPayloadToSupabase(
        content,
        'text'
    );

    input.value = '';

    autoResize(input);
}


/* =========================
   SEND TO SUPABASE
========================= */

async function sendPayloadToSupabase(
    content,
    type = 'text'
) {

    /*
       Reply information remains LOCAL only
       because the old messages table does not
       have the reply_to column.
    */

    const replyMeta =
        activeReplyMessage
            ? {
                sender_username:
                    activeReplyMessage.sender_username,

                content:
                    activeReplyMessage.content
              }
            : null;


    /*
       Create the local message first.
       This makes sending feel instant.
    */

    const now =
        new Date().toISOString();


    const localMessage = {

        sender_username:
            currentUser.username,

        receiver_username:
            targetUsername,

        content:
            content,

        created_at:
            now,

        message_type:
            type,

        reply_to:
            replyMeta,

        is_read:
            false,

        is_pending:
            true,

        is_offline_pending:
            false
    };


    messagesCache.push(
        localMessage
    );

    saveLocalCache(
        messagesCache
    );

    renderMessages(
        messagesCache
    );

    cancelReply();


    /*
       If offline, keep it locally and queue it.
    */

    if (!navigator.onLine) {

        localMessage.is_offline_pending = true;

        queueOfflineMessage(
            localMessage
        );

        saveLocalCache(
            messagesCache
        );

        renderMessages(
            messagesCache
        );

        return;
    }


    /*
       IMPORTANT:
       Only send columns that are actually known
       to exist in the old messages table.
    */

    const payload = {

        sender_username:
            currentUser.username,

        receiver_username:
            targetUsername,

        content:
            content
    };


    const { error } =
        await supabaseClient
            .from('messages')
            .insert([payload]);


    if (error) {

        console.error(
            'Message insert failed:',
            error
        );


        /*
           Keep the message visible and mark it
           as pending/offline.
        */

        localMessage.is_pending = true;
        localMessage.is_offline_pending = true;

        queueOfflineMessage(
            localMessage
        );

        saveLocalCache(
            messagesCache
        );

        renderMessages(
            messagesCache
        );

        return;
    }


    /*
       Insert succeeded.
       DO NOT remove the local message yet.
    */

    localMessage.is_pending = true;
    localMessage.is_offline_pending = false;

    saveLocalCache(
        messagesCache
    );

    renderMessages(
        messagesCache
    );


    /*
       Give Supabase a moment to expose the new row,
       then fetch it.
    */

    setTimeout(async () => {

        await fetchMessages();

        /*
           If the database copy is now present,
           fetchMessages() will replace the pending
           local copy naturally.

           If it is not yet visible, the local copy
           remains on screen.
        */

    }, 300);
}


/* =========================
   OFFLINE QUEUE
========================= */

async function flushOfflineQueue() {

    if (!navigator.onLine) {
        return;
    }


    const queue =
        getOfflineQueue();


    if (!queue.length) {
        return;
    }


    const remaining = [];


    for (const message of queue) {

        const payload = {

            sender_username:
                message.sender_username,

            receiver_username:
                message.receiver_username,

            content:
                message.content
        };


        const { error } =
            await supabaseClient
                .from('messages')
                .insert([payload]);


        if (error) {

            console.error(
                'Offline message failed:',
                error
            );

            remaining.push(message);

        } else {

            /*
               Remove the local pending copy only
               after successful database insertion.
            */

            messagesCache =
                messagesCache.filter(
                    local =>
                        local !== message
                );
        }
    }


    saveOfflineQueue(
        remaining
    );

    saveLocalCache(
        messagesCache
    );

    renderMessages(
        messagesCache
    );
}


/* =========================
   REALTIME
========================= */

function setupRealtime() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );
    }


    realtimeChannel =
        supabaseClient
            .channel(
                'private-chat-' +
                currentUser.username +
                '-' +
                targetUsername
            )
            .on(
                'postgres_changes',
                {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages'
                },
                payload => {

                    const message =
                        payload.new;


                    const belongsToThisChat =
                        (
                            message.sender_username ===
                                currentUser.username &&
                            message.receiver_username ===
                                targetUsername
                        ) ||
                        (
                            message.sender_username ===
                                targetUsername &&
                            message.receiver_username ===
                                currentUser.username
                        );


                    if (!belongsToThisChat) {
                        return;
                    }


                    fetchMessages();
                }
            )
            .subscribe();
}


/* =========================
   REPLY
========================= */

function replyToSelected() {

    if (!selectedMessage) {
        return;
    }


    activeReplyMessage =
        selectedMessage;


    document.getElementById(
        'replyPreviewName'
    ).textContent =
        selectedMessage.sender_username ||
        'Message';


    document.getElementById(
        'replyPreviewText'
    ).textContent =
        selectedMessage.content ||
        '[Media]';


    document.getElementById(
        'replyPreview'
    ).style.display =
        'flex';


    document.getElementById(
        'messageInput'
    ).focus();


    hideContextMenu();
}


function cancelReply() {

    activeReplyMessage = null;

    document.getElementById(
        'replyPreview'
    ).style.display =
        'none';
}


/* =========================
   CONTEXT MENU
========================= */

function showContextMenu(x, y) {

    const menu =
        document.getElementById(
            'contextMenu'
        );

    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
}


function hideContextMenu() {

    document.getElementById(
        'contextMenu'
    ).style.display =
        'none';
}


document.addEventListener(
    'click',
    event => {

        if (
            !event.target.closest(
                '#contextMenu'
            )
        ) {

            hideContextMenu();
        }
    }
);


/* =========================
   DELETE FOR ME
========================= */

function deleteSelectedForMe() {

    if (!selectedMessage) {
        return;
    }


    const index =
        messagesCache.indexOf(
            selectedMessage
        );


    if (index !== -1) {

        /*
           Mark local copy as deleted.
           This does NOT change the database.
        */

        messagesCache[index].local_deleted =
            true;

        saveLocalCache(
            messagesCache
        );

        renderMessages(
            messagesCache
        );
    }


    selectedMessage = null;

    hideContextMenu();
}


/* =========================
   SEARCH
========================= */

function toggleSearch() {

    const bar =
        document.getElementById(
            'searchBar'
        );

    if (bar.style.display === 'block') {

        bar.style.display = 'none';

        document.getElementById(
            'searchInput'
        ).value = '';

        renderMessages(
            messagesCache
        );

    } else {

        bar.style.display = 'block';

        document.getElementById(
            'searchInput'
        ).focus();
    }
}


function searchMessages() {

    renderMessages(
        messagesCache
    );
}


/* =========================
   MEDIA
========================= */

function handleMediaSelected(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    /*
       The old messages table only stores content,
       so keep media staged locally.
    */

    const reader =
        new FileReader();


    reader.onload = () => {

        stagedMedia = {

            url:
                reader.result,

            type:
                file.type.startsWith('video/')
                    ? 'video'
                    : 'image'
        };


        document.getElementById(
            'messageInput'
        ).value =
            `[${stagedMedia.type}]`;
    };


    reader.readAsDataURL(file);
}


/* =========================
   VOICE
========================= */

async function toggleRecording() {

    if (mediaRecorder &&
        mediaRecorder.state === 'recording') {

        mediaRecorder.stop();

        return;
    }


    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        alert(
            'Voice recording is not supported here.'
        );

        return;
    }


    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });


        audioChunks = [];


        mediaRecorder =
            new MediaRecorder(stream);


        mediaRecorder.ondataavailable =
            event => {

                if (event.data.size > 0) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            () => {

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                'audio/webm'
                        }
                    );


                /*
                   Audio is not persisted to the old
                   messages table. This keeps recording
                   from interfering with normal text send.
                */

                stream
                    .getTracks()
                    .forEach(track =>
                        track.stop()
                    );


                alert(
                    'Voice message recording completed. Audio upload is not enabled yet.'
                );
            };


        mediaRecorder.start();

    } catch (error) {

        console.error(
            'Microphone error:',
            error
        );

        alert(
            'Could not access microphone.'
        );
    }
}

   INPUT
========================= */

function autoResize(textarea) {

    textarea.style.height =
        'auto';

    textarea.style.height =
        Math.min(
            textarea.scrollHeight,
            110
        ) + 'px';
}


function handleEnter(event) {

    if (
        event.key === 'Enter' &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}

function goBack() {

    window.location.href =
        'chatlist.html';
}
