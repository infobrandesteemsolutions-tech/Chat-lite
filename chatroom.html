<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Private Conversation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col font-sans overflow-hidden m-0">

<div class="flex-1 flex flex-col w-full max-w-md mx-auto relative shadow-2xl bg-slate-900 border-x border-slate-800 h-full overflow-hidden">

    <!-- HEADER -->
    <div class="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-900 z-20 flex-shrink-0">

        <div class="flex items-center gap-2.5 overflow-hidden">

            <button
                onclick="window.location.href='chatlist.html'"
                class="text-slate-400 hover:text-white text-sm cursor-pointer px-1">
                &larr;
            </button>

            <div
                class="w-8 h-8 rounded-full bg-indigo-600/30 border border-indigo-500/30 flex items-center justify-center font-bold text-indigo-400 text-xs flex-shrink-0 overflow-hidden"
                id="active-chat-avatar">
                U
            </div>

            <div class="overflow-hidden">
                <h3 class="font-bold text-xs truncate" id="active-chat-name">
                    Private Chat
                </h3>

                <span
                    class="text-[9px] text-slate-400 truncate block"
                    id="active-chat-members">
                    @username
                </span>
            </div>

        </div>

        <div class="flex items-center gap-1 flex-shrink-0">

            <button
                onclick="toggleSearchBox()"
                class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer">
                🔍
            </button>

            <button
                onclick="openMediaGallery('file')"
                class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer">
                📁
            </button>

            <button
                onclick="openMediaGallery('image')"
                class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer">
                🖼️
            </button>

            <button
                onclick="openMediaGallery('video')"
                class="p-1.5 text-slate-400 hover:text-white text-xs bg-slate-800/60 rounded-lg cursor-pointer">
                🎬
            </button>

        </div>
    </div>


    <!-- SEARCH -->
    <div
        id="search-container"
        class="hidden p-2 bg-slate-950 border-b border-slate-800 flex items-center gap-2 z-20 flex-shrink-0">

        <input
            type="text"
            id="search-keyword-input"
            placeholder="Search this conversation..."
            oninput="filterMessages(this.value)"
            class="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-500">

        <button
            onclick="toggleSearchBox()"
            class="text-slate-400 hover:text-white text-xs px-2 py-1 bg-slate-800 rounded-lg cursor-pointer">
            Close
        </button>

    </div>


    <!-- MESSAGES -->
    <div
        id="chat-messages"
        class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3 bg-slate-950 flex flex-col">
    </div>


    <!-- MULTI SELECT -->
    <div
        id="multi-select-bar"
        class="hidden absolute bottom-0 left-0 right-0 bg-slate-900 border-t border-indigo-500/50 p-3 shadow-2xl z-40 items-center justify-between">

        <span
            id="selected-count-text"
            class="text-xs font-semibold text-indigo-300">
            0 selected
        </span>

        <div class="flex items-center gap-1.5">

            <button
                type="button"
                onclick="handleMultiSelectAction('everyone')"
                class="px-2.5 py-1.5 bg-red-600/70 hover:bg-red-600 text-white text-[11px] font-bold rounded-lg">
                Delete for everyone
            </button>

            <button
                type="button"
                onclick="handleMultiSelectAction('me')"
                class="px-2.5 py-1.5 bg-red-900/70 hover:bg-red-900 text-white text-[11px] font-bold rounded-lg">
                Only me
            </button>

            <button
                type="button"
                onclick="handleMultiSelectAction('forward')"
                class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold rounded-lg">
                Forward
            </button>

            <button
                type="button"
                onclick="exitMultiSelectMode()"
                class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold rounded-lg">
                &times;
            </button>

        </div>
    </div>


    <!-- UNDO -->
    <div
        id="undo-banner"
        class="hidden absolute bottom-20 left-4 right-4 bg-slate-800 border border-indigo-500/50 rounded-xl p-3 shadow-2xl z-50 items-center justify-between">

        <span
            id="undo-text"
            class="text-xs text-slate-200">
            Message deleted.
        </span>

        <button
            type="button"
            onclick="triggerUndoAction()"
            class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg">
            Undo (<span id="undo-countdown">10</span>s)
        </button>

    </div>


    <!-- MESSAGE OPTIONS -->
    <div
        id="message-options-modal"
        class="hidden absolute inset-0 bg-slate-950/70 z-50 items-center justify-center p-4">

        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-3 shadow-2xl flex flex-col gap-2">

            <div class="text-xs font-bold text-slate-400 pb-2 border-b border-slate-800 flex justify-between items-center">

                <span>Message Options</span>

                <button
                    onclick="closeMessageOptions()"
                    class="text-slate-400 hover:text-white text-base">
                    &times;
                </button>

            </div>

            <div
                id="message-options-actions"
                class="flex flex-col gap-1.5">
            </div>

        </div>
    </div>


    <!-- REPLY PREVIEW -->
    <div
        id="reply-preview-bar"
        class="hidden p-2.5 bg-slate-900 border-t border-slate-800 items-center justify-between z-20 flex-shrink-0">

        <div class="flex flex-col border-l-2 border-indigo-500 pl-2 overflow-hidden">

            <span
                class="text-[10px] font-bold text-indigo-400"
                id="reply-target-sender">
                Replying to...
            </span>

            <span
                class="text-xs text-slate-300 truncate"
                id="reply-target-content">
                Message content...
            </span>

        </div>

        <button
            type="button"
            onclick="cancelReply()"
            class="text-slate-400 hover:text-white text-base px-2">
            &times;
        </button>

    </div>


    <!-- MEDIA PREVIEW -->
    <div
        id="media-preview-bar"
        class="hidden p-2.5 bg-slate-950 border-t border-slate-800 flex-col gap-1.5 z-20 flex-shrink-0">

        <div class="flex items-center justify-between">

            <span class="text-xs font-semibold text-indigo-400">
                Staged Media Preview
            </span>

            <button
                type="button"
                onclick="clearStagedMedia()"
                class="text-[11px] text-slate-400 hover:text-white px-2 py-0.5 bg-slate-800 rounded">
                Discard
            </button>

        </div>

        <div
            id="preview-container"
            class="max-h-24 overflow-hidden rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center p-1.5 text-xs text-slate-300">
        </div>

        <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div
                id="upload-progress-bar"
                class="bg-indigo-600 h-full w-0 transition-all duration-300">
            </div>
        </div>

        <span
            class="text-[10px] text-slate-400 text-center"
            id="upload-status-text">
            Ready.
        </span>

    </div>


    <!-- FILE INPUTS -->
    <input
        type="file"
        id="media-file-input"
        class="hidden"
        accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"
        onchange="stageFileSelected(event)">

    <input
        type="file"
        id="camera-photo-input"
        class="hidden"
        accept="image/*"
        capture="environment"
        onchange="stageFileSelected(event)">

    <input
        type="file"
        id="camera-video-input"
        class="hidden"
        accept="video/*"
        capture="environment"
        onchange="stageFileSelected(event)">


    <!-- ATTACHMENT MENU -->
    <div
        id="attachment-menu"
        class="hidden absolute bottom-16 left-3 bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-2 z-30 flex flex-col gap-1 w-48">

        <button
            type="button"
            onclick="document.getElementById('media-file-input').click(); toggleAttachmentMenu();"
            class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl">
            📁 File / Document
        </button>

        <button
            type="button"
            onclick="document.getElementById('camera-photo-input').click(); toggleAttachmentMenu();"
            class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl">
            📷 Take Photo
        </button>

        <button
            type="button"
            onclick="document.getElementById('camera-video-input').click(); toggleAttachmentMenu();"
            class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700/80 rounded-xl">
            📹 Record Video Note
        </button>

    </div>


    <!-- MEDIA GALLERY -->
    <div
        id="media-gallery-modal"
        class="hidden absolute inset-0 bg-slate-950/90 z-40 flex-col p-4">

        <div class="flex justify-between items-center pb-3 border-b border-slate-800">

            <h3
                class="font-bold text-sm text-white"
                id="gallery-title">
                Private Media
            </h3>

            <button
                onclick="closeMediaGallery()"
                class="text-xs text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded-lg">
                Close
            </button>

        </div>

        <div
            id="gallery-content-grid"
            class="flex-1 overflow-y-auto grid grid-cols-2 gap-2 pt-3">
        </div>

    </div>


    <!-- INPUT -->
    <form
        id="chat-form"
        onsubmit="handleFormSubmit(event)"
        class="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2 relative z-25 flex-shrink-0">

        <button
            type="button"
            onclick="toggleAttachmentMenu()"
            class="p-2 text-slate-400 hover:text-indigo-400 text-lg font-bold flex-shrink-0">
            +
        </button>

        <input
            type="text"
            id="message-input"
            placeholder="Type a message..."
            class="flex-1 px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-white min-w-0">

        <div
            id="recording-ui"
            class="hidden flex-1 items-center justify-between px-3 py-2 bg-slate-950 border border-red-500/50 rounded-xl min-w-0">

            <div class="flex items-center gap-2">

                <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>

                <span
                    id="recording-timer"
                    class="text-xs font-semibold text-red-400">
                    0:00
                </span>

            </div>

            <div class="flex items-center gap-1">

                <button
                    type="button"
                    id="pause-rec-btn"
                    onclick="togglePauseRecording()"
                    class="text-[11px] text-slate-300 px-2 py-1 bg-slate-800 rounded-lg">
                    ⏸ Pause
                </button>

                <button
                    type="button"
                    onclick="stopRecordingOnly()"
                    class="text-[11px] text-white px-2 py-1 bg-red-600 rounded-lg font-bold">
                    ⏹ Stop
                </button>

                <button
                    type="button"
                    onclick="cancelRecording()"
                    class="text-[11px] text-slate-400 px-2 py-1 bg-slate-800 rounded-lg">
                    Discard
                </button>

            </div>
        </div>

        <button
            type="button"
            id="mic-btn"
            onclick="startVoiceRecording()"
            class="p-2 text-slate-400 hover:text-red-400 flex-shrink-0">
            🎤
        </button>

        <button
            type="submit"
            class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl text-sm text-white flex-shrink-0">
            Send
        </button>

    </form>

</div>


<script src="supabase.js"></script>

<script>

/* =========================================================
   USER + TARGET
========================================================= */

const currentUser =
    JSON.parse(localStorage.getItem('chatlite_user'));

const urlParams =
    new URLSearchParams(window.location.search);

const targetUsername =
    urlParams.get('to');

const targetName =
    urlParams.get('name') ||
    targetUsername ||
    'Private Chat';

const targetGender =
    urlParams.get('gender') || '';


if (!currentUser) {
    window.location.href = 'index.html';
    throw new Error('No logged-in user.');
}

if (!targetUsername) {
    window.location.href = 'chatlist.html';
    throw new Error('No private chat recipient supplied.');
}


/* =========================================================
   HEADER
========================================================= */

document.getElementById('active-chat-name').textContent =
    targetName;

document.getElementById('active-chat-members').textContent =
    `@${targetUsername}`;

document.getElementById('active-chat-avatar').textContent =
    targetName.charAt(0).toUpperCase();


/* =========================================================
   STATE
========================================================= */

let messageSubscription = null;
let messagesCache = [];

let mediaRecorder = null;
let audioChunks = [];
let recordedBlob = null;

let stagedPayload = null;

let isRecording = false;
let isPaused = false;

let recordingTimerInterval = null;
let recordingSeconds = 0;

let replyingToMessage = null;

let isMultiSelectMode = false;
let selectedMessageIds = new Set();

let pendingDeleteTimer = null;
let undoTargetMessage = null;


/* =========================================================
   IMPORTANT:
   YOUR TABLE ONLY HAS 4 COLUMNS.
   We store extra message information inside content.
========================================================= */

const MESSAGE_PREFIX = '__CHATLITE_PRIVATE_V1__';


function makeStoredContent(content, type = 'text', reply = null) {

    return MESSAGE_PREFIX + JSON.stringify({
        content: content,
        type: type || 'text',
        reply: reply,
        createdAt: new Date().toISOString()
    });
}


function decodeStoredContent(rawContent, fallbackCreatedAt = null) {

    if (
        typeof rawContent !== 'string' ||
        !rawContent.startsWith(MESSAGE_PREFIX)
    ) {
        return {
            content: rawContent || '',
            type: 'text',
            reply: null,
            createdAt:
                fallbackCreatedAt ||
                new Date().toISOString(),
            deleted: false
        };
    }

    try {

        const data =
            JSON.parse(
                rawContent.substring(
                    MESSAGE_PREFIX.length
                )
            );

        return {
            content: data.content || '',
            type: data.type || 'text',
            reply: data.reply || null,
            createdAt:
                data.createdAt ||
                fallbackCreatedAt ||
                new Date().toISOString(),
            deleted: false
        };

    } catch (e) {

        console.error(
            'Could not decode private message:',
            e
        );

        return {
            content: rawContent,
            type: 'text',
            reply: null,
            createdAt:
                fallbackCreatedAt ||
                new Date().toISOString(),
            deleted: false
        };
    }
}


function normalizeMessage(row, index = 0) {

    const decoded =
        decodeStoredContent(
            row.content,
            null
        );

    return {
        id:
            row.id ||
            `local_${row.sender_username}_${index}_${btoa(
                String(row.content || '')
            ).substring(0, 12)}`,

        sender_username:
            row.sender_username,

        receiver_username:
            row.receiver_username,

        content:
            decoded.content,

        message_type:
            decoded.type,

        reply_to:
            decoded.reply,

        created_at:
            decoded.createdAt,

        is_deleted_for_everyone:
            false,

        _raw_content:
            row.content
    };
}


/* =========================================================
   DELETE FOR ME
========================================================= */

function getPrivateDeleteKey() {

    return `chatlite_private_deleted_for_me_${currentUser.username}_${targetUsername}`;
}


function getHiddenForMe() {

    try {

        return JSON.parse(
            localStorage.getItem(
                getPrivateDeleteKey()
            ) || '[]'
        );

    } catch (e) {

        return [];
    }
}


function saveHiddenForMe(ids) {

    localStorage.setItem(
        getPrivateDeleteKey(),
        JSON.stringify(ids)
    );
}


/* =========================================================
   ATTACHMENT MENU
========================================================= */

function toggleAttachmentMenu() {

    document
        .getElementById('attachment-menu')
        .classList.toggle('hidden');
}


/* =========================================================
   SEARCH
========================================================= */

function toggleSearchBox() {

    const searchBar =
        document.getElementById(
            'search-container'
        );

    searchBar.classList.toggle(
        'hidden'
    );

    if (
        !searchBar.classList.contains(
            'hidden'
        )
    ) {

        document
            .getElementById(
                'search-keyword-input'
            )
            .focus();

    } else {

        filterMessages('');
    }
}


/* =========================================================
   FETCH PRIVATE MESSAGES
========================================================= */

async function fetchMessages() {

    const me =
        currentUser.username;

    const other =
        targetUsername;


    const [
        sentResult,
        receivedResult
    ] = await Promise.all([

        supabaseClient
            .from('private_messages')
            .select('*')
            .eq('sender_username', me),

        supabaseClient
            .from('private_messages')
            .select('*')
            .eq('sender_username', other)
    ]);


    if (sentResult.error) {

        console.error(
            'Error fetching sent private messages:',
            sentResult.error
        );

        return;
    }


    if (receivedResult.error) {

        console.error(
            'Error fetching received private messages:',
            receivedResult.error
        );

        return;
    }


    const sentRows =
        (sentResult.data || [])
            .filter(
                row =>
                    row.receiver_username ===
                    other
            );


    const receivedRows =
        (receivedResult.data || [])
            .filter(
                row =>
                    row.receiver_username ===
                    me
            );


    const combinedRows = [
        ...sentRows,
        ...receivedRows
    ];


    messagesCache =
        combinedRows.map(
            (row, index) =>
                normalizeMessage(
                    row,
                    index
                )
        );


    messagesCache.sort(
        (a, b) =>
            new Date(
                a.created_at
            ).getTime() -
            new Date(
                b.created_at
            ).getTime()
    );


    renderMessages(
        messagesCache
    );
}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(messages) {

    const container =
        document.getElementById(
            'chat-messages'
        );

    container.innerHTML = '';

    const hiddenForMe =
        getHiddenForMe();


    const filtered =
        messages.filter(
            msg =>
                !hiddenForMe.includes(
                    msg.id
                ) &&
                !msg.is_deleted_for_everyone
        );


    filtered.forEach(
        msg =>
            appendMessageToDOM(
                msg,
                false
            )
    );


    container.scrollTop =
        container.scrollHeight;
}


/* =========================================================
   SEARCH FILTER
========================================================= */

function filterMessages(keyword) {

    const term =
        keyword
            .toLowerCase()
            .trim();


    if (!term) {

        renderMessages(
            messagesCache
        );

        return;
    }


    const filtered =
        messagesCache.filter(
            msg => {

                const content =
                    String(
                        msg.content || ''
                    ).toLowerCase();

                const sender =
                    String(
                        msg.sender_username || ''
                    ).toLowerCase();

                const type =
                    String(
                        msg.message_type ||
                        'text'
                    ).toLowerCase();

                return (
                    content.includes(term) ||
                    sender.includes(term) ||
                    type.includes(term)
                );
            }
        );


    renderMessages(
        filtered
    );
}


/* =========================================================
   APPEND MESSAGE
========================================================= */

function appendMessageToDOM(
    msg,
    scrollToBottom = true
) {

    const container =
        document.getElementById(
            'chat-messages'
        );


    const isMe =
        msg.sender_username ===
        currentUser.username;


    const wrapper =
        document.createElement(
            'div'
        );


    wrapper.className =
        `flex flex-col ${
            isMe
                ? 'items-end'
                : 'items-start'
        } space-y-1 message-row relative transition-transform duration-200 select-none`;


    wrapper.setAttribute(
        'data-id',
        msg.id
    );


    const isSelected =
        selectedMessageIds.has(
            msg.id
        );


    const rowFlex =
        document.createElement(
            'div'
        );


    rowFlex.className =
        `flex items-center gap-2 max-w-[85%] ${
            isMe
                ? 'flex-row-reverse'
                : 'flex-row'
        }`;


    const checkboxEl =
        document.createElement(
            'div'
        );


    checkboxEl.className =
        `w-5 h-5 rounded-full border border-slate-600 flex items-center justify-center text-xs ${
            isMultiSelectMode
                ? 'flex'
                : 'hidden'
        } ${
            isSelected
                ? 'bg-indigo-600 border-indigo-500 text-white'
                : 'bg-slate-900'
        }`;


    checkboxEl.innerHTML =
        isSelected
            ? '✓'
            : '';


    rowFlex.appendChild(
        checkboxEl
    );


    if (isSelected) {

        wrapper.classList.add(
            'bg-indigo-950/30',
            'p-2',
            'rounded-xl'
        );
    }


    let pressTimer = null;


    const startPress = () => {

        pressTimer =
            setTimeout(() => {

                if (
                    isMultiSelectMode
                ) {

                    toggleMessageSelection(
                        msg.id
                    );

                } else {

                    openMessageOptions(
                        msg
                    );
                }

            }, 600);
    };


    const cancelPress = () => {

        if (pressTimer) {

            clearTimeout(
                pressTimer
            );
        }
    };


    wrapper.addEventListener(
        'touchstart',
        startPress
    );

    wrapper.addEventListener(
        'touchend',
        cancelPress
    );

    wrapper.addEventListener(
        'touchmove',
        cancelPress
    );

    wrapper.addEventListener(
        'mousedown',
        startPress
    );

    wrapper.addEventListener(
        'mouseup',
        cancelPress
    );

    wrapper.addEventListener(
        'mouseleave',
        cancelPress
    );


    wrapper.addEventListener(
        'click',
        e => {

            if (
                isMultiSelectMode
            ) {

                toggleMessageSelection(
                    msg.id
                );

                e.stopPropagation();
            }
        }
    );


    wrapper.oncontextmenu =
        e => {

            e.preventDefault();

            if (
                !isMultiSelectMode
            ) {

                openMessageOptions(
                    msg
                );
            }
        };


    /* SWIPE REPLY */

    let touchStartX = 0;
    let touchCurrentX = 0;


    wrapper.addEventListener(
        'touchstart',
        e => {

            if (
                isMultiSelectMode
            ) {
                return;
            }

            touchStartX =
                e.touches[0].clientX;
        },
        {
            passive: true
        }
    );


    wrapper.addEventListener(
        'touchmove',
        e => {

            if (
                isMultiSelectMode
            ) {
                return;
            }

            touchCurrentX =
                e.touches[0].clientX;

            const diff =
                touchCurrentX -
                touchStartX;

            if (
                diff > 0 &&
                diff < 100
            ) {

                wrapper.style.transform =
                    `translateX(${diff}px)`;
            }
        },
        {
            passive: true
        }
    );


    wrapper.addEventListener(
        'touchend',
        () => {

            if (
                isMultiSelectMode
            ) {
                return;
            }

            const diff =
                touchCurrentX -
                touchStartX;

            wrapper.style.transform =
                'translateX(0px)';

            if (
                diff > 60
            ) {

                setReplyTarget(
                    msg
                );
            }

            touchStartX = 0;
            touchCurrentX = 0;
        }
    );


    /* BUBBLE */

    const bubble =
        document.createElement(
            'div'
        );


    bubble.className =
        `flex-1 px-3 py-2 rounded-2xl text-sm ${
            isMe
                ? 'bg-indigo-600 text-white rounded-br-none'
                : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'
        }`;


    /* REPLY */

    if (
        msg.reply_to
    ) {

        const replySnippet =
            document.createElement(
                'div'
            );


        replySnippet.className =
            `mb-1 p-1.5 rounded text-xs border-l-2 ${
                isMe
                    ? 'bg-indigo-700/50 border-indigo-300 text-indigo-100'
                    : 'bg-slate-900/60 border-indigo-500 text-slate-300'
            }`;


        const senderSpan =
            document.createElement(
                'span'
            );

        senderSpan.className =
            'font-bold block text-[10px]';

        senderSpan.textContent =
            msg.reply_to.sender ||
            'Message';


        const contentSpan =
            document.createElement(
                'span'
            );

        contentSpan.className =
            'truncate block';

        contentSpan.textContent =
            msg.reply_to.content ||
            '';


        replySnippet.appendChild(
            senderSpan
        );

        replySnippet.appendChild(
            contentSpan
        );

        bubble.appendChild(
            replySnippet
        );
    }


    /* CONTENT */

    const contentBody =
        document.createElement(
            'div'
        );


    const type =
        msg.message_type ||
        'text';


    if (
        type === 'image'
    ) {

        const image =
            document.createElement(
                'img'
            );

        image.src =
            msg.content;

        image.className =
            'rounded-xl max-h-60 w-full object-cover cursor-pointer';

        image.onclick =
            () => {

                if (
                    !isMultiSelectMode
                ) {

                    window.open(
                        msg.content,
                        '_blank'
                    );
                }
            };

        contentBody.appendChild(
            image
        );


    } else if (
        type === 'video'
    ) {

        const video =
            document.createElement(
                'video'
            );

        video.src =
            msg.content;

        video.controls =
            true;

        video.className =
            'rounded-xl max-h-60 w-full';

        contentBody.appendChild(
            video
        );


    } else if (
        type === 'audio'
    ) {

        const audioId =
            'audio_' +
            Math.random()
                .toString(36)
                .substring(2, 9);


        contentBody.innerHTML = `
            <div class="flex items-center gap-2.5 py-1 px-1 min-w-[220px]" data-audio-container>

                <button
                    type="button"
                    onclick="toggleAudioPlay('${audioId}', this)"
                    class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold">
                    ▶
                </button>

                <audio
                    id="${audioId}"
                    src="${msg.content}"
                    preload="metadata">
                </audio>

                <div class="flex flex-col flex-1 gap-1">

                    <div class="flex justify-between items-center text-[10px]">

                        <span class="audio-current-time">
                            0:00
                        </span>

                        <button
                            type="button"
                            onclick="toggleAudioSpeed('${audioId}', this)"
                            class="bg-white/10 px-1.5 py-0.5 rounded font-mono text-[9px]">
                            1x
                        </button>

                    </div>

                    <input
                        type="range"
                        value="0"
                        max="100"
                        step="0.1"
                        oninput="seekAudio('${audioId}', this.value)"
                        class="audio-range w-full h-1">

                </div>
            </div>
        `;


        setTimeout(
            () => {

                const audioEl =
                    document.getElementById(
                        audioId
                    );

                if (!audioEl) {
                    return;
                }

                const c =
                    audioEl.closest(
                        '[data-audio-container]'
                    );

                const rangeEl =
                    c.querySelector(
                        '.audio-range'
                    );

                const timeEl =
                    c.querySelector(
                        '.audio-current-time'
                    );


                audioEl.addEventListener(
                    'loadedmetadata',
                    () => {

                        timeEl.textContent =
                            formatAudioTime(
                                audioEl.duration
                            );
                    }
                );


                audioEl.addEventListener(
                    'timeupdate',
                    () => {

                        if (
                            !audioEl.duration
                        ) {
                            return;
                        }

                        rangeEl.value =
                            (
                                audioEl.currentTime /
                                audioEl.duration
                            ) * 100;

                        timeEl.textContent =
                            formatAudioTime(
                                audioEl.currentTime
                            );
                    }
                );


                audioEl.addEventListener(
                    'ended',
                    () => {

                        c.querySelector(
                            'button'
                        ).textContent =
                            '▶';

                        audioEl.currentTime =
                            0;
                    }
                );

            },
            50
        );


    } else if (
        type === 'file'
    ) {

        const link =
            document.createElement(
                'a'
            );

        link.href =
            msg.content;

        link.download =
            'file';

        link.className =
            'flex items-center gap-2 underline text-xs font-semibold py-1';

        link.textContent =
            '📁 File Attachment';

        contentBody.appendChild(
            link
        );


    } else {

        contentBody.textContent =
            msg.content || '';
    }


    bubble.appendChild(
        contentBody
    );

    rowFlex.appendChild(
        bubble
    );


    /* TIME */

    const metaRow =
        document.createElement(
            'div'
        );

    metaRow.className =
        `flex items-center gap-1 px-1 text-[10px] text-slate-400 ${
            isMe
                ? 'mr-7'
                : 'ml-7'
        }`;


    const timeSpan =
        document.createElement(
            'span'
        );


    timeSpan.textContent =
        new Date(
            msg.created_at
        ).toLocaleTimeString(
            [],
            {
                hour: '2-digit',
                minute: '2-digit'
            }
        );


    metaRow.appendChild(
        timeSpan
    );


    if (isMe) {

        const tickSpan =
            document.createElement(
                'span'
            );

        tickSpan.textContent =
            '✓';

        metaRow.appendChild(
            tickSpan
        );
    }


    wrapper.appendChild(
        rowFlex
    );

    wrapper.appendChild(
        metaRow
    );

    container.appendChild(
        wrapper
    );


    if (
        scrollToBottom
    ) {

        container.scrollTop =
            container.scrollHeight;
    }
}


/* =========================================================
   MULTI SELECT
========================================================= */

function enterMultiSelectMode(msg) {

    isMultiSelectMode = true;

    selectedMessageIds.clear();

    if (
        msg &&
        msg.id
    ) {

        selectedMessageIds.add(
            msg.id
        );
    }


    const bar =
        document.getElementById(
            'multi-select-bar'
        );

    bar.classList.remove(
        'hidden'
    );

    bar.classList.add(
        'flex'
    );


    updateMultiSelectUI();

    renderMessages(
        messagesCache
    );
}


function exitMultiSelectMode() {

    isMultiSelectMode = false;

    selectedMessageIds.clear();


    const bar =
        document.getElementById(
            'multi-select-bar'
        );

    bar.classList.remove(
        'flex'
    );

    bar.classList.add(
        'hidden'
    );


    renderMessages(
        messagesCache
    );
}


function toggleMessageSelection(
    msgId
) {

    if (
        selectedMessageIds.has(
            msgId
        )
    ) {

        selectedMessageIds.delete(
            msgId
        );

    } else {

        selectedMessageIds.add(
            msgId
        );
    }


    if (
        selectedMessageIds.size === 0
    ) {

        exitMultiSelectMode();

        return;
    }


    updateMultiSelectUI();

    renderMessages(
        messagesCache
    );
}


function updateMultiSelectUI() {

    document.getElementById(
        'selected-count-text'
    ).textContent =
        `${selectedMessageIds.size} selected`;
}


/* =========================================================
   MULTI SELECT ACTIONS
========================================================= */

function handleMultiSelectAction(
    actionType
) {

    if (
        selectedMessageIds.size === 0
    ) {
        return;
    }


    const selectedMsgs =
        messagesCache.filter(
            m =>
                selectedMessageIds.has(
                    m.id
                )
        );


    if (
        actionType === 'forward'
    ) {

        const firstMsg =
            selectedMsgs[0];

        if (firstMsg) {

            localStorage.setItem(
                'chatlite_forward_payload',
                JSON.stringify({
                    content:
                        firstMsg.content,
                    type:
                        firstMsg.message_type ||
                        'text'
                })
            );

            window.location.href =
                'chatlist.html?forward=true';
        }


        exitMultiSelectMode();

        return;
    }


    if (
        actionType === 'me'
    ) {

        let hidden =
            getHiddenForMe();


        selectedMessageIds.forEach(
            id => {

                if (
                    !hidden.includes(id)
                ) {

                    hidden.push(id);
                }
            }
        );


        saveHiddenForMe(
            hidden
        );

        exitMultiSelectMode();

        renderMessages(
            messagesCache
        );

        return;
    }


    if (
        actionType === 'everyone'
    ) {

        selectedMsgs.forEach(
            msg => {

                if (
                    msg.sender_username ===
                    currentUser.username
                ) {

                    msg.is_deleted_for_everyone =
                        true;
                }
            }
        );


        exitMultiSelectMode();

        renderMessages(
            messagesCache
        );
    }
}

   UNDO
========================================================= */

function showUndoBanner(
    seconds,
    onComplete
) {

    const banner =
        document.getElementById(
            'undo-banner'
        );

    const countdownEl =
        document.getElementById(
            'undo-countdown'
        );


    banner.classList.remove(
        'hidden'
    );

    banner.classList.add(
        'flex'
    );


    let timeLeft =
        seconds;


    countdownEl.textContent =
        timeLeft;


    if (
        pendingDeleteTimer
    ) {

        clearInterval(
            pendingDeleteTimer
        );
    }


    pendingDeleteTimer =
        setInterval(
            () => {

                timeLeft--;

                countdownEl.textContent =
                    timeLeft;


                if (
                    timeLeft <= 0
                ) {

                    clearInterval(
                        pendingDeleteTimer
                    );

                    banner.classList.remove(
                        'flex'
                    );

                    banner.classList.add(
                        'hidden'
                    );


                    if (
                        onComplete
                    ) {

                        onComplete();
                    }
                }

            },
            1000
        );
}


function triggerUndoAction() {

    if (
        pendingDeleteTimer
    ) {

        clearInterval(
            pendingDeleteTimer
        );
    }


    const banner =
        document.getElementById(
            'undo-banner'
        );


    banner.classList.remove(
        'flex'
    );

    banner.classList.add(
        'hidden'
    );
}


/* =========================================================
   AUDIO
========================================================= */

function toggleAudioPlay(
    audioId,
    btn
) {

    const audio =
        document.getElementById(
            audioId
        );


    if (!audio) {
        return;
    }


    if (
        audio.paused
    ) {

        audio.play();

        btn.textContent =
            '⏸';

    } else {

        audio.pause();

        btn.textContent =
            '▶';
    }
}


function seekAudio(
    audioId,
    value
) {

    const audio =
        document.getElementById(
            audioId
        );


    if (
        !audio ||
        !audio.duration
    ) {
        return;
    }


    audio.currentTime =
        (value / 100) *
        audio.duration;
}


function toggleAudioSpeed(
    audioId,
    speedBtn
) {

    const audio =
        document.getElementById(
            audioId
        );


    if (!audio) {
        return;
    }


    const nextRate =
        audio.playbackRate === 1
            ? 1.5
            : audio.playbackRate === 1.5
                ? 2
                : 1;


    audio.playbackRate =
        nextRate;


    speedBtn.textContent =
        nextRate + 'x';
}


function formatAudioTime(
    secs
) {

    if (
        isNaN(secs)
    ) {
        return '0:00';
    }


    const mins =
        Math.floor(
            secs / 60
        );

    const rSecs =
        Math.floor(
            secs % 60
        );


    return `${mins}:${
        rSecs < 10
            ? '0'
            : ''
    }${rSecs}`;
}


/* =========================================================
   FILE / MEDIA
========================================================= */

function stageFileSelected(
    event
) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    const reader =
        new FileReader();


    const progressBar =
        document.getElementById(
            'upload-progress-bar'
        );


    const statusText =
        document.getElementById(
            'upload-status-text'
        );


    document
        .getElementById(
            'media-preview-bar'
        )
        .classList.remove(
            'hidden'
        );


    document
        .getElementById(
            'media-preview-bar'
        )
        .classList.add(
            'flex'
        );


    progressBar.style.width =
        '10%';


    statusText.textContent =
        'Reading file...';


    reader.onprogress =
        data => {

            if (
                data.lengthComputable
            ) {

                const percent =
                    Math.round(
                        (
                            data.loaded /
                            data.total
                        ) * 90
                    );

                progressBar.style.width =
                    percent + '%';
            }
        };


    reader.onload =
        function(e) {

            progressBar.style.width =
                '100%';


            statusText.textContent =
                'Ready! Hit Send.';


            let type =
                'file';


            if (
                file.type.startsWith(
                    'image/'
                )
            ) {

                type =
                    'image';

            } else if (
                file.type.startsWith(
                    'video/'
                )
            ) {

                type =
                    'video';

            } else if (
                file.type.startsWith(
                    'audio/'
                )
            ) {

                type =
                    'audio';
            }


            stagedPayload = {

                content:
                    e.target.result,

                type:
                    type
            };


            const preview =
                document.getElementById(
                    'preview-container'
                );


            preview.innerHTML =
                '';


            if (
                type === 'image'
            ) {

                const img =
                    document.createElement(
                        'img'
                    );

                img.src =
                    e.target.result;

                img.className =
                    'max-h-20 rounded object-contain';

                preview.appendChild(
                    img
                );


            } else if (
                type === 'video'
            ) {

                const video =
                    document.createElement(
                        'video'
                    );

                video.src =
                    e.target.result;

                video.className =
                    'max-h-20 rounded';

                video.controls =
                    true;

                preview.appendChild(
                    video
                );


            } else {

                preview.textContent =
                    `Staged File: ${file.name}`;
            }
        };


    reader.readAsDataURL(
        file
    );
}


function clearStagedMedia() {

    recordedBlob =

}


/* =========================================================
   VOICE
========================================================= */

async function startVoiceRecording() {

    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        mediaRecorder =
            new MediaRecorder(
                stream
            );


        audioChunks =
            [];


        mediaRecorder.ondataavailable =
            e => {

                audioChunks.push(
                    e.data
                );
            };


        mediaRecorder.onstop =
            () => {

                recordedBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                'audio/webm'
                        }
                    );
            };


        mediaRecorder.start();


        isRecording =
            true;

        isPaused =
            false;


        document
            .getElementById(
                'message-input'
            )
            .classList.add(
                'hidden'
            );


        document
            .getElementById(
                'recording-ui'
            )
            .classList.remove(
                'hidden'
            );


        document
            .getElementById(
                'recording-ui'
            )
            .classList.add(
                'flex'
            );


        document
            .getElementById(
                'mic-btn'
            )
            .classList.add(
                'hidden'
            );


        recordingSeconds =
            0;


        document
            .getElementById(
                'recording-timer'
            )
            .textContent =
            '0:00';


        recordingTimerInterval =
            setInterval(
                () => {

                    if (
                        !isPaused
                    ) {

                        recordingSeconds++;

                        const m =
                            Math.floor(
                                recordingSeconds /
                                60
                            );

                        const s =
                            recordingSeconds %
                            60;


                        document
                            .getElementById(
                                'recording-timer'
                            )
                            .textContent =
                            `${m}:${
                                s < 10
                                    ? '0'
                                    : ''
                            }${s}`;
                    }

                },
                1000
            );

    } catch (err) {

        console.error(
            'Microphone error:',
            err
        );

        alert(
            'Microphone access denied or unavailable.'
        );
    }
}


function togglePauseRecording() {

    if (!mediaRecorder) {
        return;
    }


    const btn =
        document.getElementById(
            'pause-rec-btn'
        );


    if (
        !isPaused
    ) {

        mediaRecorder.pause();

        isPaused =
            true;

        btn.textContent =
            '▶ Resume';

    } else {

        mediaRecorder.resume();

        isPaused =
            false;

        btn.textContent =
            '⏸ Pause';
    }
}


function stopRecordingOnly() {

    if (
        mediaRecorder &&
        (
            isRecording ||
            isPaused
        )
    ) {

        if (
            mediaRecorder.state !==
            'inactive'
        ) {

            mediaRecorder.stop();
        }


        isRecording =
            false;

        isPaused =
            false;


        clearInterval(
            recordingTimerInterval
        );


        if (
            mediaRecorder.stream
        ) {

            mediaRecorder.stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        document
            .getElementById(
                'recording-ui'
            )
            .classList.add(
                'hidden'
            );


        document
            .getElementById(
                'recording-ui'
            )
            .classList.remove(
                'flex'
            );


        document
            .getElementById(
                'message-input'
            )
            .classList.remove(
                'hidden'
            );


        document
            .getElementById(
                'mic-btn'
            )
            .classList.remove(
                'hidden'
            );


        setTimeout(
            () => {

                document
                    .getElementById(
                        'media-preview-bar'
                    )
                    .classList.remove(
                        'hidden'
                    );

                document
                    .getElementById(
                        'media-preview-bar'
                    )
                    .classList.add(
                        'flex'
                    );


                document
                    .getElementById(
                        'preview-container'
                    )
                    .textContent =
                    `Voice Note Recorded (${recordingSeconds}s). Ready to Send.`;

            },
            100
        );
    }
}


function cancelRecording() {

    if (
        mediaRecorder &&
        (
            isRecording ||
            isPaused
        )
    ) {

        if (
            mediaRecorder.state !==
            'inactive'
        ) {

            mediaRecorder.stop();
        }


        if (
            mediaRecorder.stream
        ) {

            mediaRecorder.stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }
    }


    resetRecordingUI();

    clearStagedMedia();
}


function resetRecordingUI() {

    clearInterval(
        recordingTimerInterval
    );


    isRecording =
        false;

    isPaused =
        false;


    document
        .getElementById(
            'recording-ui'
        )
        .classList.add(
            'hidden'
        );


    document
        .getElementById(
            'recording-ui'
        )
        .classList.remove(
            'flex'
        );


    document
        .getElementById(
            'message-input'
        )
        .classList.remove(
            'hidden'
        );


    document
        .getElementById(
            'mic-btn'
        )
        .classList.remove(
            'hidden'
        );
}


/* =========================================================
   SEND FORM
========================================================= */

async function handleFormSubmit(
    e
) {

    e.preventDefault();


    if (
        isRecording
    ) {

        stopRecordingOnly();

        return;
    }


    let replyMeta =
        null;


    if (
        replyingToMessage
    ) {

        replyMeta = {

            sender:
                replyingToMessage
                    .sender_username ===
                currentUser.username
                    ? 'You'
                    : `@${replyingToMessage.sender_username}`,

            content:
                replyingToMessage.content
        };
    }


    /* VOICE */

    if (
        recordedBlob
    ) {

        const blob =
            recordedBlob;

        recordedBlob =
            null;


        const reader =
            new FileReader();


        reader.readAsDataURL(
            blob
        );


        reader.onloadend =
            async () => {

                await sendPayloadToSupabase(
                    reader.result,
                    'audio',
                    replyMeta
                );


                resetRecordingUI();

                clearStagedMedia();

                cancelReply();
            };


        return;
    }


    /* ATTACHMENT */

    if (
        stagedPayload
    ) {

        const payload =
            stagedPayload;

        stagedPayload =
            null;


        await sendPayloadToSupabase(
            payload.content,
            payload.type,
            replyMeta
        );


        clearStagedMedia();

        cancelReply();

        return;
    }


    /* TEXT */

    const input =
        document.getElementById(
            'message-input'
        );


    const content =
        input.value.trim();


    if (!content) {
        return;
    }


    input.value =
        '';


    await sendPayloadToSupabase(
        content,
        'text',
        replyMeta
    );


    cancelReply();
}


/* =========================================================
   SEND PRIVATE MESSAGE
========================================================= */

async function sendPayloadToSupabase(
    content,
    type,
    replyMeta = null
) {

    const storedContent =
        makeStoredContent(
            content,
            type,
            replyMeta
        );


    const newId =
        crypto.randomUUID();


    const payload = {

        id:
            newId,

        sender_username:
            currentUser.username,

        receiver_username:
            targetUsername,

        content:
            storedContent
    };


    console.log(
        'Sending private message:',
        payload
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .from('private_messages')
            .insert([
                payload
            ])
            .select();


    if (
        error
    ) {

        console.error(
            'PRIVATE MESSAGE INSERT ERROR:',
            error
        );


        alert(
            'Failed to send message: ' +
            error.message
        );


        return;
    }


    if (
        data &&
        data.length > 0
    ) {

        const newMessage =
            normalizeMessage(
                data[0]
            );


        if (
            !messagesCache.some(
                m =>
                    m.id ===
                    newMessage.id
            )
        ) {

            messagesCache.push(
                newMessage
            );


            messagesCache.sort(
                (a, b) =>
                    new Date(
                        a.created_at
                    ).getTime() -
                    new Date(
                        b.created_at
                    ).getTime()
            );


            renderMessages(
                messagesCache
            );
        }
    }
}


/* =========================================================
   MEDIA GALLERY
========================================================= */

function openMediaGallery(
    typeFilter
) {

    const modal =
        document.getElementById(
            'media-gallery-modal'
        );

    const grid =
        document.getElementById(
            'gallery-content-grid'
        );

    const title =
        document.getElementById(
            'gallery-title'
        );


    modal.classList.remove(
        'hidden'
    );

    modal.classList.add(
        'flex'
    );


    grid.innerHTML =
        '';


    title.textContent =
        `Private ${typeFilter.toUpperCase()} Gallery`;


    const matching =
        messagesCache.filter(
            m => {

                const type =
                    m.message_type ||
                    'text';


                if (
                    typeFilter ===
                    'image'
                ) {

                    return type ===
                        'image';
                }


                if (
                    typeFilter ===
                    'video'
                ) {

                    return type ===
                        'video';
                }


                if (
                    typeFilter ===
                    'file'
                ) {

                    return (
                        type === 'file' ||
                        type === 'audio'
                    );
                }


                return false;
            }
        );


    if (
        matching.length === 0
    ) {

        grid.innerHTML =
            `<span class="text-xs text-slate-500 col-span-2 text-center py-6">
                No ${typeFilter}s found in this conversation.
            </span>`;

        return;
    }


    matching.forEach(
        m => {

            const card =
                document.createElement(
                    'div'
                );


            card.className =
                'bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col items-center justify-center gap-2';


            const type =
                m.message_type ||
                'text';


            if (
                type === 'image'
            ) {

                const img =
                    document.createElement(
                        'img'
                    );

                img.src =
                    m.content;

                img.className =
                    'h-24 w-full object-cover rounded cursor-pointer';

                img.onclick =
                    () =>
                        window.open(
                            m.content,
                            '_blank'
                        );

                card.appendChild(
                    img
                );


            } else if (
                type === 'video'
            ) {

                const video =
                    document.createElement(
                        'video'
                    );

                video.src =
                    m.content;

                video.className =
                    'h-24 w-full rounded object-cover';

                video.controls =
                    true;

                card.appendChild(
                    video
                );


            } else {

                const link =
                    document.createElement(
                        'a'
                    );

                link.href =
                    m.content;

                link.download =
                    'file';

                link.className =
                    'text-xs text-indigo-400 underline font-semibold py-4';

                link.textContent =
                    `Download ${type}`;

                card.appendChild(
                    link
                );
            }


            grid.appendChild(
                card
            );
        }
    );
}


function closeMediaGallery() {

    const modal =
        document.getElementById(
            'media-gallery-modal'
        );


    modal.classList.add(
        'hidden'
    );

    modal.classList.remove(
        'flex'
    );
}


/* =========================================================
   REALTIME
========================================================= */

function subscribeToMessages() {

    if (
        messageSubscription
    ) {

        supabaseClient.removeChannel(
            messageSubscription
        );

        messageSubscription =
            null;
    }


    const me =
        currentUser.username;

    const other =
        targetUsername;


    messageSubscription =
        supabaseClient
            .channel(
                `private_messages_${me}_${other}`
            )

            .on(
                'postgres_changes',
                {
                    event:
                        'INSERT',
                    schema:
                        'public',
                    table:
                        'private_messages'
                },
                handleRealtimeMessage
            )

            .subscribe(
                status => {

                    console.log(
                        'Private chat realtime status:',
                        status
                    );
                }
            );
}


function handleRealtimeMessage(
    payload
) {

    const row =
        payload.new;


    if (!row) {
        return;
    }


    const belongs =
        (
            row.sender_username ===
            currentUser.username &&
            row.receiver_username ===
            targetUsername
        ) ||
        (
            row.sender_username ===
            targetUsername &&
            row.receiver_username ===
            currentUser.username
        );


    if (!belongs) {
        return;
    }


    const newMsg =
        normalizeMessage(
            row
        );


    if (
        !messagesCache.some(
            m =>
                m.id ===
                newMsg.id
        )
    ) {

        messagesCache.push(
            newMsg
        );


        messagesCache.sort(
            (a, b) =>
                new Date(
                    a.created_at
                ).getTime() -
                new Date(
                    b.created_at
                ).getTime()
        );


        renderMessages(
            messagesCache
        );
    }
}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    'beforeunload',
    () => {

        if (
            messageSubscription
        ) {

            supabaseClient
                .removeChannel(
                    messageSubscription
                );

            messageSubscription =
                null;
        }


        if (
            recordingTimerInterval
        ) {

            clearInterval(
                recordingTimerInterval
            );
        }
    }
);


/* =========================================================
   START
========================================================= */

fetchMessages();

subscribeToMessages();
