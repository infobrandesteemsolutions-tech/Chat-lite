<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Create Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative overflow-hidden shadow-2xl bg-slate-900 border-x border-slate-800 h-screen">
        
        <!-- Header -->
        <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90 backdrop-blur-md z-20">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='chatlist.html'" class="text-slate-400 hover:text-white p-1 cursor-pointer">
                    &larr; Back
                </button>
                <h2 class="font-bold text-base text-white">Create New Group</h2>
            </div>
        </div>

        <!-- Scrollable Form Container -->
        <div class="flex-1 overflow-y-auto pb-10 px-6 pt-6">
            <form onsubmit="handleCreateGroup(event)" class="space-y-5">
                
                <!-- Group Avatar Upload -->
                <div class="flex flex-col items-center justify-center">
                    <div class="relative group cursor-pointer" onclick="document.getElementById('group-avatar-input').click()">
                        <div id="group-avatar-preview" class="w-24 h-24 rounded-full border-4 border-slate-800 bg-slate-950 overflow-hidden shadow-xl flex items-center justify-center text-2xl font-bold text-orange-400">
                            GRP
                        </div>
                        <div class="absolute inset-0 rounded-full bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-[10px] text-center font-semibold p-1">
                            Group Photo
                        </div>
                    </div>
                    <input type="file" id="group-avatar-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                    <span class="text-[11px] text-slate-400 mt-2">Tap to upload group icon</span>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Group Name</label>
                    <input type="text" id="group-name" required placeholder="e.g. Project Innovate" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-orange-500 text-sm text-white">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Group Description</label>
                    <textarea id="group-desc" rows="2" placeholder="What is this group about?" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-orange-500 text-sm text-white resize-none"></textarea>
                </div>

                <!-- Add Members Section -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Initial Members (Chat Codes)</label>
                    <div class="flex items-center gap-2 mb-2">
                        <input type="text" id="member-code-input" placeholder="e.g. CL-ABC1234" class="flex-1 px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-orange-500 text-sm font-mono text-white uppercase">
                        <button type="button" onclick="addGroupMember()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 font-semibold rounded-xl text-xs text-white transition-all cursor-pointer">Add</button>
                    </div>
                    
                    <!-- Added Members Chip List -->
                    <div id="members-chip-container" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto p-2 bg-slate-950/50 border border-slate-800/80 rounded-xl">
                        <span class="text-xs text-slate-500 p-1">No additional members added yet.</span>
                    </div>
                </div>

                <button type="submit" id="create-btn" class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 font-semibold rounded-xl shadow-lg shadow-orange-600/30 transition-all mt-4 cursor-pointer text-white">
                    Create Group
                </button>
            </form>
        </div>

    </div>

    <script src="supabase.js"></script>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('chatlite_user'));
        let groupAvatarBase64 = null;
        let addedMemberCodes = [];

        if (!currentUser) {
            window.location.href = 'index.html';
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300;
                    const MAX_HEIGHT = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    groupAvatarBase64 = canvas.toDataURL('image/jpeg', 0.75);
                    document.getElementById('group-avatar-preview').innerHTML = `<img src="${groupAvatarBase64}" class="w-full h-full object-cover">`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addGroupMember() {
            const codeInput = document.getElementById('member-code-input');
            const code = codeInput.value.trim().toUpperCase();

            if (!code) return;
            if (code === currentUser.chat_code) {
                alert("You are automatically the creator/admin of this group.");
                codeInput.value = '';
                return;
            }
            if (addedMemberCodes.includes(code)) {
                alert("This chat code is already added.");
                codeInput.value = '';
                return;
            }

            addedMemberCodes.push(code);
            codeInput.value = '';
            renderMemberChips();
        }

        function removeGroupMember(code) {
            addedMemberCodes = addedMemberCodes.filter(c => c !== code);
            renderMemberChips();
        }

        function renderMemberChips() {
            const container = document.getElementById('members-chip-container');
            if (addedMemberCodes.length === 0) {
                container.innerHTML = `<span class="text-xs text-slate-500 p-1">No additional members added yet.</span>`;
                return;
            }

            container.innerHTML = '';
            addedMemberCodes.forEach(code => {
                const chip = document.createElement('div');
                chip.className = 'flex items-center gap-1.5 bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg text-xs font-mono text-orange-400';
                chip.innerHTML = `
                    <span>${code}</span>
                    <button type="button" onclick="removeGroupMember('${code}')" class="text-slate-400 hover:text-red-400 font-bold ml-1">&times;</button>
                `;
                container.appendChild(chip);
            });
        }

        async function handleCreateGroup(e) {
            e.preventDefault();
            const groupName = document.getElementById('group-name').value.trim();
            const groupDesc = document.getElementById('group-desc').value.trim();

            if (!groupName) return;

            const createBtn = document.getElementById('create-btn');
            createBtn.textContent = 'Creating group...';
            createBtn.disabled = true;

            // Generate unique Group Chat Code format: GRP-XXXXXX
            const groupChatCode = 'GRP-' + Math.random().toString(36).substring(2, 8).toUpperCase();

            // 1. Create Group record in a groups table (or structured JSON table schema)
            // Let's assume you have a 'groups' table with columns: id, name, description, avatar_url, chat_code, created_by
            const { data: groupData, error: groupError } = await supabaseClient
                .from('groups')
                .insert([{
                    name: groupName,
                    description: groupDesc,
                    avatar_url: groupAvatarBase64,
                    chat_code: groupChatCode,
                    created_by: currentUser.username
                }])
                .select()
                .single();

            if (groupError) {
                alert('Error creating group: ' + groupError.message);
                createBtn.textContent = 'Create Group';
                createBtn.disabled = false;
                return;
            }

            // 2. Add creator as Admin in group_members table
            const membersPayload = [{
                group_id: groupData.id,
                username: currentUser.username,
                role: 'admin'
            }];

            // Resolve added member chat codes to usernames
            if (addedMemberCodes.length > 0) {
                const { data: foundProfiles } = await supabaseClient
                    .from('profiles')
                    .select('username, chat_code')
                    .in('chat_code', addedMemberCodes);

                if (foundProfiles) {
                    foundProfiles.forEach(p => {
                        if (p.username !== currentUser.username) {
                            membersPayload.push({
                                group_id: groupData.id,
                                username: p.username,
                                role: 'member'
                            });
                        }
                    });
                }
            }

            const { error: memError } = await supabaseClient
                .from('group_members')
                .insert(membersPayload);

            if (memError) {
                alert('Group created, but encountered an error adding members: ' + memError.message);
            } else {
                alert('Group created successfully!');
            }

            window.location.href = 'chatlist.html';
        }
    </script>
</body>
</html>
